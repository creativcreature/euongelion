<main id="page">

  <h1>A sower went out to sow</h1>
  <div class="meta">Matthew 13:3–8 · riso cards · every frame computed · no images</div>
  <div class="band" data-aspect="3"></div>

  <div class="phone"><div class="band" data-aspect="2"></div><div class="label">Phone band (2:1)</div></div>

<script>
/*
 * Version 2 — Seed Cards.
 *
 * The parable dealt as a hand of riso-printed cards, one bold iconic idea on each:
 * the seed sack flings its seed; a triangle-and-circle bird snaps it off the path;
 * a sprout pops up between stones and wilts under an overprinted sun; zigzag thorns
 * close in; in good soil a stem rises and bursts into thirty, sixty, a hundred specks.
 * Then the cards flip, gather, and lift away, and the hand is dealt again.
 *
 * Print: three inks (cobalt, gold, crimson) laid down as flat riso fills with
 * stochastic grain, speckle voids, uneven density, roller streaks, wobbly edges and
 * misregistration. Overlapping inks overprint (gold + cobalt = green, gold + crimson =
 * orange, crimson + cobalt = purple). Nothing is loaded; every frame is drawn by code.
 */
// ============================================================================
// Riso print shader
const FRAG = `
precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform sampler2D u_tone;
uniform sampler2D u_line;
const vec3 PAPER = vec3(235., 220., 178.) / 255.;
const vec3 COBALT = vec3(26., 77., 152.) / 255.;
const vec3 GOLD = vec3(239., 188., 63.) / 255.;
const vec3 CRIMSON = vec3(206., 52., 66.) / 255.;
float hash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1., 0.)), u.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), u.x), u.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for (int i = 0; i < 4; i++){ s += a * vnoise(p); p = p * 2.03 + 17.; a *= .5; } return s; }
// A riso drum: coverage k becomes grain (mid tones) or a solid with speckle voids.
float riso(vec2 px, float k, float s, float unit, float boil){
  if (k < .004) return 0.;
  vec2 q = px / unit;
  float g = hash(floor(q / 1.15) + s * 17. + boil);
  float clump = vnoise(q * .21 + s * 31. + boil * .13);
  float thr = mix(g, clump, .5) * .94 + .03;
  float ink = smoothstep(thr - .05, thr + .05, k);
  float holes = step(.962, hash(floor(q / 2.2) + s * 5.3 + boil * .7));
  float blotch = smoothstep(.55, .95, fbm(q * .012 + s * 9.));
  float solid = smoothstep(.55, .8, k);
  ink *= 1. - (.85 * holes + .1 * blotch) * solid;
  return clamp(ink, 0., 1.);
}
void main(){
  vec2 R = u_resolution;
  vec2 px = vec2(gl_FragCoord.x, R.y - gl_FragCoord.y);
  float unit = R.y / 500.;
  float boil = floor(u_time * 8.);
  vec2 q = px / unit;
  vec2 wob = (vec2(vnoise(q * .08), vnoise(q * .08 + 13.)) - .5) * 1.8 * unit;
  vec2 drift = vec2(sin(u_time * .21), cos(u_time * .17)) * .4 * unit;
  vec2 offB = vec2(1.3, -.8) * unit + wob + drift;
  vec2 offG = vec2(-1.0, .9) * unit + wob.yx;
  vec2 offR = vec2(.7, 1.4) * unit - wob - drift;
  float kB = texture2D(u_tone, (px + offB) / R).r;
  float kG = texture2D(u_tone, (px + offG) / R).g;
  float kR = texture2D(u_tone, (px + offR) / R).b;
  float lB = texture2D(u_line, (px + offB) / R).r;
  float lG = texture2D(u_line, (px + offG) / R).g;
  float lR = texture2D(u_line, (px + offR) / R).b;
  float dens = .8 + .2 * fbm(q / 240. + 3.);
  float streak = .93 + .07 * vnoise(vec2(q.y * .011, 3.));
  float dB = max(riso(px, kB, 1., unit, boil), lB * (1. - .5 * step(.97, hash(floor(q / 1.6) + boil)))) * dens * streak;
  float dG = max(riso(px, kG, 2., unit, boil), lG) * (.9 + .1 * dens);
  float dR = max(riso(px, kR, 3., unit, boil), lR) * (.88 + .12 * dens) * streak;
  float grain = .955 + .045 * vnoise(px * .75 + boil * 13.1) + .025 * (fbm(q * vec2(.02, .3)) - .5);
  vec3 col = PAPER * grain;
  col *= mix(vec3(1.), min(vec3(1.), GOLD / PAPER), dG * .96);
  col *= mix(vec3(1.), CRIMSON / PAPER, dR * .9);
  col *= mix(vec3(1.), COBALT / PAPER, dB * .92);
  gl_FragColor = vec4(col, 1.);
}`;
const VERT = `attribute vec2 a_position; void main(){ gl_Position = vec4(a_position, 0., 1.); }`;

// ============================================================================
// Utilities
const TAU = Math.PI * 2;
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => { x = clamp01(x); return x * x * (3 - 2 * x); };
const easeOut = (x) => 1 - Math.pow(1 - clamp01(x), 3);
const easeIn = (x) => Math.pow(clamp01(x), 3);
const easeInOut = (x) => { x = clamp01(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const backOut = (x, s = 1.9) => { x = clamp01(x); const c3 = s + 1; return 1 + c3 * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const elasticOut = (x) => { x = clamp01(x); if (x === 0 || x === 1) return x; return Math.pow(2, -9 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1; };
const pulse = (t, at, w) => Math.exp(-(((t - at) / w) ** 2));
const fract = (x) => x - Math.floor(x);
function mulberry(seed){ let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const range = (seed, n) => { const r = mulberry(seed); return Array.from({ length: n }, () => r()); };
const tone = (b = 0, g = 0, r = 0) => `rgb(${Math.round(clamp01(b) * 255)},${Math.round(clamp01(g) * 255)},${Math.round(clamp01(r) * 255)})`;
const quadPts = (a, c, b, n = 12) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return [u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]; });
function ribbon(ctx, pts, wOf){
  const n = pts.length; if (n < 2) return;
  const Lp = [], Rp = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const w = Math.max(0, wOf(i / (n - 1), i)) / 2;
    Lp.push([pts[i][0] - dy * w, pts[i][1] + dx * w]); Rp.push([pts[i][0] + dy * w, pts[i][1] - dx * w]);
  }
  ctx.beginPath(); ctx.moveTo(...Lp[0]); for (let i = 1; i < n; i++) ctx.lineTo(...Lp[i]);
  for (let i = n - 1; i >= 0; i--) ctx.lineTo(...Rp[i]); ctx.closePath(); ctx.fill();
}
const taper = (w, s = .2, e = .25) => (t) => w * Math.min(1, t / s + .15, (1 - t) / e + .15);
const pathOf = (pts) => { const p = new Path2D(); p.moveTo(...pts[0]); for (let i = 1; i < pts.length; i++) p.lineTo(...pts[i]); p.closePath(); return p; };
const circle = (x, y, r) => { const p = new Path2D(); p.arc(x, y, Math.max(0, r), 0, TAU); return p; };
const ellipse = (x, y, rx, ry, rot = 0) => { const p = new Path2D(); p.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); return p; };
const rrect = (x, y, w, h, r) => { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; };
/** A shape given in local coordinates, placed at (x, y), rotated, scaled. */
function placed(pts, x, y, rot = 0, sx = 1, sy = sx){ const c = Math.cos(rot), s = Math.sin(rot); return pts.map(([px, py]) => [x + (px * sx) * c - (py * sy) * s, y + (px * sx) * s + (py * sy) * c]); }
const blob = (n, seed, wob = .12) => { const R = range(seed, n); return Array.from({ length: n }, (_, i) => { const a = i / n * TAU, r = 1 + (R[i] - .5) * wob; return [Math.cos(a) * r, Math.sin(a) * r]; }); };

// ============================================================================
// Drawing on the two plates. Inks ADD, so overlapping shapes overprint like riso drums.
class Ink {
  constructor(W, H){
    this.tc = document.createElement('canvas'); this.T = this.tc.getContext('2d');
    this.lc = document.createElement('canvas'); this.L = this.lc.getContext('2d');
    this.stack = [];
  }
  begin(W, H){
    for (const c of [this.tc, this.lc]) { if (c.width !== W) c.width = W; if (c.height !== H) c.height = H; }
    this.W = W; this.H = H; this.A = W / H;
    for (const x of [this.T, this.L]) { x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.globalAlpha = 1; x.fillStyle = '#000'; x.fillRect(0, 0, W, H); }
    // stage: x centred, y 0 (top) … 1 (bottom), one unit = band height
    for (const x of [this.T, this.L]) x.setTransform(H, 0, 0, H, W / 2, 0);
    this.k = H; this.stack = [];
  }
  push(tx, ty, rot = 0, sx = 1, sy = sx){
    for (const c of [this.T, this.L]) { c.save(); c.translate(tx, ty); c.rotate(rot); c.scale(sx, sy); }
    this.stack.push(this.k); this.k *= Math.max(1e-4, Math.min(Math.abs(sx), Math.abs(sy)));
  }
  pop(){ this.T.restore(); this.L.restore(); this.k = this.stack.pop(); }
  clip(path){ this.T.clip(path); this.L.clip(path); }
  px(n){ return n / this.k; }
  ink(path, b = 0, g = 0, r = 0, alpha = 1){ const T = this.T; T.globalCompositeOperation = 'lighter'; T.globalAlpha = alpha; T.fillStyle = tone(b, g, r); T.fill(path); T.globalAlpha = 1; }
  paper(path){
    this.T.globalCompositeOperation = 'source-over'; this.T.fillStyle = '#000'; this.T.fill(path);
    this.L.globalCompositeOperation = 'source-over'; this.L.fillStyle = '#000'; this.L.fill(path);
  }
  line(pts, w, b = 0, g = 0, r = 0){ this.L.globalCompositeOperation = 'lighter'; this.L.fillStyle = tone(b, g, r); ribbon(this.L, pts, typeof w === 'function' ? w : () => w); }
  dot(x, y, rad, b = 0, g = 0, r = 0){ this.ink(circle(x, y, rad), b, g, r); }
}

// ============================================================================
// Inks as named mixes
const COB = [.92, 0, 0], GLD = [0, .95, 0], CRM = [0, 0, .9];
const GREEN = [.5, .95, 0], ORANGE = [0, .95, .62], PURPLE = [.62, 0, .85], BROWN = [.35, .8, .6];

// Card size (local units): width 1, height CH, origin at centre.
const CH = 4 / 3;
const cardPath = () => rrect(-.5, -CH / 2, 1, CH, .045);

function seedIcon(D, x, y, s, rot){
  const pts = placed(blob(14, 9, .02).map(([a, b]) => [a * 1.35, b * .82]), x, y, rot, s);
  D.ink(pathOf(pts), 0, .95, .15);
  if (s * D.k > 3.5) D.line(quadPts(placed([[-1.05, 0]], x, y, rot, s)[0], placed([[0, -.25]], x, y, rot, s)[0], placed([[1.05, 0]], x, y, rot, s)[0], 8), taper(D.px(1.3)), .9, 0, 0);
}

// ---- Card faces -------------------------------------------------------------
// Every face runs on the film's own clock: ev holds absolute beat times, and ev.sp
// speeds the whole action up for the fast recaps late in the loop.

function faceSower(D, t, ev){
  const thr = ev.throw, sp = ev.sp || 1;
  const anticip = pulse(t, ev.wind, .17), fling = smooth((t - thr) / .1) * (1 - smooth((t - thr - .45) / .45));
  const tilt = -.42 * anticip + .55 * fling;
  const breathe = 1 + .035 * Math.sin(t * 3.1) * (1 - fling);
  const refillOn = ev.refill !== undefined && t > ev.refill - .1;
  const deflate = lerp(1, .8, smooth((t - thr - .08) / .35)) * (refillOn ? lerp(1, 1.25, smooth((t - ev.refill) / .45)) : 1);
  D.ink(ellipse(0, .4, .42, .05), 0, 0, .35);
  D.push(-.02, .38, tilt, deflate * breathe * (1 + .08 * pulse(t, ev.refill === undefined ? -9 : ev.refill, .1)), (2 - deflate) * breathe * (1 - .1 * pulse(t, ev.refill === undefined ? -9 : ev.refill, .1)));
  D.push(0, 0, 0, 1.25);
  const body = [];
  for (let i = 0; i <= 20; i++) { const u = i / 20, a = Math.PI * u; body.push([-Math.cos(a) * (.31 + .02 * Math.sin(u * 9)), -Math.sin(a) * .06]); }
  const sackPts = [[-.31, 0], [-.33, -.12], [-.27, -.26], [-.14, -.34], [-.08, -.38], [-.2, -.48], [-.12, -.5], [-.06, -.46], [0, -.52], [.06, -.46], [.13, -.51], [.21, -.47], [.09, -.38], [.15, -.34], [.28, -.26], [.33, -.12], [.31, 0], ...body.slice().reverse().map(([x, y]) => [x, -y * .6])];
  D.ink(pathOf(sackPts), 0, .95, 0);
  D.ink(pathOf([[-.31, 0], [-.33, -.12], [-.27, -.26], [-.14, -.34], [-.1, -.2], [-.13, -.04], [-.18, .03]]), 0, 0, .55);
  D.ink(ellipse(0, -.45, .12, .035), 0, .4, .5);
  for (let i = 0; i < 6; i++) seedIcon(D, -.09 + i * .036, -.47 + (i % 2) * .018, .02, i * 1.3);
  D.ink(rrect(-.11, -.4, .22, .05, .02), .92, 0, 0);
  D.ink(ellipse(-.1, -.39, .07, .03, .5), .92, 0, 0);
  D.ink(ellipse(-.12, -.34, .025, .06, -.3), .92, 0, 0);
  D.paper(ellipse(-.105, -.39, .03, .01, .5));
  D.line(quadPts([-.2, -.28], [-.15, -.14], [-.2, -.02]), taper(D.px(2.2)), .85, 0, 0);
  D.line(quadPts([.05, -.33], [.09, -.18], [.04, -.03]), taper(D.px(2.2)), .85, 0, 0);
  D.line(quadPts([.2, -.25], [.25, -.14], [.21, -.05]), taper(D.px(1.8)), .85, 0, 0);
  D.ink(rrect(.1, -.2, .12, .1, .015), 0, 0, .9);
  for (let i = 0; i < 4; i++) D.line([[.11 + i * .033, -.21], [.11 + i * .033, -.19]], D.px(1.4), .85, 0, 0);
  D.pop(); D.pop();
  // the wind-up shows as a crouch and two crimson tension marks
  if (anticip > .15) for (let i = 0; i < 2; i++) D.line([[-.42 - i * .05, -.2 + i * .12], [-.3 - i * .05, -.16 + i * .12]], taper(D.px(3.4) * anticip), 0, 0, .9);
  // the fling: a swoosh out of the mouth, sweeping up and to the right
  const reveal = easeOut((t - thr) / .24), fade = 1 - smooth((t - thr - .3) / .4);
  if (reveal > 0 && fade > 0) {
    const cx = .24, cy = -.26, r = .3;
    const a0 = Math.PI, a1 = lerp(a0, Math.PI * 1.85, reveal);
    const tail = lerp(a0, a1, smooth((t - thr - .1) / .35));
    const pts = Array.from({ length: 24 }, (_, i) => { const a = lerp(tail, a1, i / 23); return [cx + Math.cos(a) * r, cy + Math.sin(a) * r * 1.2]; });
    D.T.globalCompositeOperation = 'lighter'; D.T.fillStyle = tone(0, 0, .9 * fade); ribbon(D.T, pts, taper(.13 * fade, .7, .12));
    D.T.fillStyle = tone(0, .9 * fade, 0); ribbon(D.T, pts, taper(.05 * fade, .7, .15));
    for (let i = 0; i < 3; i++) { const a = a1 - .15 - i * .2; const r0 = r + .11 + i * .02; D.line([[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0 * 1.2], [cx + Math.cos(a) * (r0 + .12), cy + Math.sin(a) * (r0 + .12) * 1.2]], taper(D.px(3.4) * fade), .9, 0, 0); }
  }
  // seed pattering back onto the card
  if (t > thr && t < thr + 1.2) {
    const R = range(611, 80);
    for (let i = 0; i < 14; i++) {
      const age = t - thr - R[i * 4] * .07; if (age < 0) continue;
      const x = -.02 + (.1 + R[i * 4 + 1] * .35) * age, y = -.3 + (-(.4 + R[i * 4 + 2] * .5)) * age + 1.9 * age * age;
      if (y > .42 || x > .55) continue;
      seedIcon(D, x, y, .026 + R[i * 4 + 3] * .012, age * 12 + i);
    }
  }
  if (refillOn) for (let i = 0; i < 12; i++) {
    const u = (t - ev.refill + .5 - i * .035) / .5; if (u < 0 || u > 1) continue;
    seedIcon(D, lerp(-.45 + i * .06, -.02, u), lerp(-.7, -.3, u * u), .032, u * 6 + i);
  }
}

function facePath(D, t, ev){
  const sa = ev.seed, b0 = ev.bird, sp = ev.sp || 1, S = (o) => b0 + o / sp;
  D.ink(pathOf([[-.5, .08], [.5, -.02], [.5, .34], [-.5, .44]]), 0, .92, 0);
  for (let i = 0; i < 6; i++) { const x = -.45 + i * .18; D.ink(rrect(x, lerp(.27, .17, (x + .5)), .1, .028, .014), .85, 0, 0); }
  for (let i = 0; i < 14; i++) { const R = range(300 + i, 3); D.dot(-.46 + R[0] * .92, lerp(.1, .4, R[1]) - (R[0] - .5) * .08, .008 + R[2] * .01, .7, 0, 0); }
  const eaten = S(.5);
  if (t >= sa && t < eaten) { const land = t - sa; const hop = Math.abs(Math.sin(Math.min(land, .5) * 12)) * Math.exp(-land * 8) * .09; seedIcon(D, .02, .19 - hop, .034, .4 + land * 3 * Math.exp(-land * 5)); }
  if (t > S(-.25)) {
    const walk = clamp01((t - S(-.25)) / (.55 / sp));
    let bx = lerp(.95, .26, easeOut(walk));
    const hopPhase = fract(walk * 2);
    let by = .06 - (walk < 1 ? Math.sin(hopPhase * Math.PI) * .12 : 0);
    const landSq = walk < 1 ? pulse(hopPhase, 0, .09) + pulse(hopPhase, 1, .09) : pulse(t, S(.3), .06);
    let rot = 0, sx = 1 + .16 * landSq, sy = 1 - .18 * landSq, wing = 0, head = 0, beakOpen = 0;
    head = .34 * pulse(t, S(.34), .07) - .3 * pulse(t, S(.44), .05);
    const peck = pulse(t, S(.5), .05);
    rot = -.85 * peck; beakOpen = pulse(t, S(.46), .045);
    const gulp = pulse(t, S(.62), .05);
    const wig = t > S(.7) && t < S(1.05) ? Math.sin((t - S(.7)) * 34 * sp) * .22 * (1 - (t - S(.7)) / (.35 / sp)) : 0;
    rot += wig;
    const fly = clamp01((t - S(1.05)) / (.5 / sp));
    if (fly > 0) { bx -= easeIn(fly) * 1.1; by -= easeIn(fly) * 1.2; wing = Math.sin(t * 34); rot -= .35 * fly; }
    else wing = .25 * pulse(t, S(.9), .12);
    D.push(bx, by - .04, rot, -sx * 1.3, sy * 1.3);
    D.paper(ellipse(0, .1, .165 * (1 + gulp * .1), .135)); D.paper(circle(.14, -.07 + head * .04, .09 * (1 + gulp * .35))); D.paper(pathOf([[-.2, .1], [-.34, .02], [-.32, .16]]));
    D.ink(ellipse(0, .1, .16 * (1 + gulp * .1), .13), .72, 0, 0);
    D.ink(pathOf([[-.2, .1], [-.34, .02], [-.32, .16]]), .9, 0, 0);
    D.ink(pathOf(placed([[0, 0], [-.17, -.02 - wing * .3], [-.13, .07]], .02, .12, 0)), 0, .95, 0);
    D.push(.14, -.07 + head * .04, head);
    D.ink(circle(0, 0, .085 * (1 + gulp * .35)), .72, 0, 0);
    D.ink(pathOf([[.07, -.03], [.2 + .02 * beakOpen, -.005 - .04 * beakOpen], [.08, .02]]), 0, 0, .95);
    D.ink(pathOf([[.07, .02], [.19, .02 + .04 * beakOpen], [.08, .04]]), 0, 0, .95);
    D.paper(circle(.02, -.02, .026)); D.dot(.027, -.022, .012, .95, 0, 0);
    D.pop();
    if (fly === 0) for (const lx of [-.03, .05]) D.line([[lx, .22], [lx - .01, .33]], D.px(2.4), .9, 0, 0);
    D.pop();
    // the snatch: three crimson flick marks

  const key = KEYS.reduce((a, k) => (lt >= k.t ? k : a), KEYS[0]);
  const irisU = key.iris ? clamp01((lt - key.t) / .22) : 1;
  if (irisU < 1) {
    const f = cards.find((c) => c.kind === key.focus);
    D.T.save(); D.L.save();
    const r = lerp(.02, A * 1.3, easeOut(irisU));
    D.clip(circle(f.x, f.y, r));
  }
  const order = key.mode === 'solo' ? [...cards].sort((a, b) => (a.kind === key.focus ? 1 : 0) - (b.kind === key.focus ? 1 : 0)) : cards;
  for (const card of order) drawCard(D, card, lt);
  if (irisU < 1) { D.T.restore(); D.L.restore(); }

  // the throw: seed sprays out of the sack, crosses the whole band, and lands on each soil
  const sower = cards.find((c) => c.kind === 'sower');
  if (lt > 1.3 && lt < 2.9 && sower) {
    const from = toStage(sower, [-.02, -.3]);
    const S = range(77, 200);
    for (let i = 0; i < 44; i++) {
      const age = lt - 1.35 - S[i * 4] * .12; if (age < 0 || age > 1.5) continue;
      const vx = (.9 + S[i * 4 + 1] * 1.9), vy = -(.5 + S[i * 4 + 2] * .9);
      const x = from[0] + vx * age, y = from[1] + vy * age + 1.5 * age * age;
      if (x > A / 2 + .2 || y > 1.1) continue;
      seedIcon(D, x, y, .016 + S[i * 4 + 3] * .012, age * 10 + i);
    }
  }
  // the four seeds that find their soil
  for (const card of cards) {
    if (card.kind === 'sower') continue;
    const ev = EV1[card.kind];
    const target = toStage(card, SEED_SPOT[card.kind]);
    const from = sower ? toStage(sower, [-.02, -.3]) : [0, -.3];
    const u = (lt - 1.38) / (ev.seed - 1.38);
    if (u <= 0 || u >= 1) continue;
    const x = lerp(from[0], target[0], u), y = lerp(from[1], target[1], u) - .55 * 4 * u * (1 - u);
    seedIcon(D, x, y, card.w * .05, u * 12 + card.i);
  }
  // the harvest sweeping back across the band into the sack
  const good = cards.find((c) => c.kind === 'good');
  if (good && sower && lt > 13.4 && lt < 15.2) {
    const S = range(88, 260);
    const to = toStage(sower, [-.02, -.32]);
    for (let i = 0; i < 64; i++) {
      const u = (lt - 13.4 - S[i * 4] * .5) / 1.1; if (u <= 0 || u >= 1) continue;
      const a = S[i * 4 + 1] * TAU, rr = .5 * (.55 + S[i * 4 + 2] * .45);
      const f = toStage(good, [Math.cos(a) * rr, -.2 + Math.sin(a) * rr * 1.15]);
      const x = lerp(f[0], to[0], easeInOut(u)), y = lerp(f[1], to[1], easeInOut(u)) - .4 * Math.sin(u * Math.PI) * (1 + S[i * 4 + 3]);
      seedIcon(D, x, y, good.w * .026, u * 10 + i);
    }
  }
  // seed rain over the whole table before the faces turn back
  if (lt > 19.35 && lt < 20.5) {
    const S = range(31, 200);
    for (let i = 0; i < 40; i++) {
      const u = (lt - 19.35 - S[i * 3] * .5) / .8; if (u <= 0 || u >= 1) continue;
      const x = (S[i * 3 + 1] - .5) * A * 1.05;
      const y = lerp(-.15, 1.05, easeIn(u));
      seedIcon(D, x, y, .018 + S[i * 3 + 2] * .012, u * 14 + i);
    }
  }
  // the last seed of the loop drops in the middle and bounces
  if (lt > 21.6) {
    const u = (lt - 21.6) / .45;
    const y = lerp(-.2, .55, easeIn(Math.min(1, u))) - (u > 1 ? Math.abs(Math.sin((u - 1) * 6)) * .12 * Math.exp(-(u - 1) * 5) : 0);
    seedIcon(D, 0, y, .03, u * 9);
  }
}

// ============================================================================
function createScene(canvas){
  const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'low-power' });
  if (!gl) return null;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position'); gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const u = (n) => gl.getUniformLocation(prog, n);
  const tex = (unit) => { const tx = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx);
    for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v); return tx; };
  const toneTex = tex(0), lineTex = tex(1);
  gl.uniform1i(u('u_tone'), 0); gl.uniform1i(u('u_line'), 1);
  const D = new Ink();
  return {
    render(t, W, H){
      D.begin(W, H);
      drawFrame(D, t);
      for (const [tx, src, unit] of [[toneTex, D.tc, 0], [lineTex, D.lc, 1]]) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tx); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, src); }
      gl.viewport(0, 0, W, H);
      gl.uniform1f(u('u_time'), t); gl.uniform2f(u('u_resolution'), W, H);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    },
  };
}

const stillAt = () => 11.9;   // the fullest frame: the hundredfold burst
const params = new URLSearchParams(location.search);
if (params.has('capture')) {
  document.body.classList.add('capture');
  const page = document.getElementById('page'); page.innerHTML = '';
  const w = Number(params.get('w') || 1500), aspect = Number(params.get('aspect') || 3);
  const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w / aspect);
  c.style.cssText = `width:${c.width}px;height:${c.height}px;display:block`; page.appendChild(c);
  const scene = createScene(c);
  window.__render = (t) => scene.render(t, c.width, c.height);
  window.__loop = LOOP;
  window.__ready = true;
} else {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const bands = [...document.querySelectorAll('.band')].map((el) => { el.style.aspectRatio = `${el.dataset.aspect} / 1`; const canvas = document.createElement('canvas'); el.appendChild(canvas); return { el, canvas, scene: createScene(canvas), time: 0, visible: true }; });
  const io = new IntersectionObserver((es) => { for (const e of es) { const b = bands.find((x) => x.el === e.target); if (b) b.visible = e.isIntersecting; } });
  bands.forEach((b) => io.observe(b.el));
  let last = 0;
  const frame = (now) => {
    requestAnimationFrame(frame);
    if (now - last < 1000 / 30 - 1) return;
    const dt = last ? Math.min(100, now - last) / 1000 : 0; last = now;
    for (const b of bands) {
      if (!b.scene || !b.visible) continue;
      const dpr = Math.min(1.5, devicePixelRatio || 1);
      const w = Math.max(1, Math.round(b.el.clientWidth * dpr)), h = Math.max(1, Math.round(b.el.clientHeight * dpr));
      if (b.canvas.width !== w) b.canvas.width = w; if (b.canvas.height !== h) b.canvas.height = h;
      b.time = reduced.matches ? stillAt() : b.time + dt;
      b.scene.render(b.time, w, h);
    }
  };
  requestAnimationFrame(frame);
}
