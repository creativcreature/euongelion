  - id: SA-026
    title: custom-generation-account-gate-one-free-per-verified-account
    note: 'Founder-ratified 2026-07-10 (custom-generation brief Q&A). Soul Audit submit, 3-option review, and all curated reading remain anonymous and free forever. Bespoke (custom-generated) plans require a verified account; each new verified account receives exactly 1 free generation, then the paywall. Amends the anonymous-generation scope of SA-002/SA-018; SA-033 (no gate before reading a devotional) remains intact — the gate exists at exactly one moment: requesting a custom generation.'
  - id: SA-027
    title: paid-custom-generation-six-access-paths-subscription-primary
    note: 'Founder-ratified 2026-07-10. Locked pricing stands: $7/mo, $77/yr, $140/2yr, $200/3yr (Master Plan 0.2); the brief~s $4.99/$39/$99 figures are dead. Six entitlement doors into one generation pipeline, subscription emphasized as default: (1) subscription, (2) 1 free generation per verified account, (3) one-time credit packs, (4) BYOK in Settings only — amends the 2026-05-03 BYOK-tier rejection to a de-emphasized non-tier path, (5) MCP round-trip per docs/run/RESEARCH_OAUTH.md Option D, (6) gift/sponsor codes. The gospel and all curated content are never paywalled; only bespoke generation is gated. Build order: brief section 11 phases.'
  - id: SA-028
    title: billing-subscription-state-single-source-public-users
    note: 'Founder-ratified 2026-07-10 ("implement right fully — not half fixes"). Subscription/entitlement state has one source of truth: public.users (webhook-written subscription_tier plus new stripe_customer_id/stripe_subscription_id columns). All entitlement reads (billing/entitlements, chat quota, brain providers) move off Supabase Auth user_metadata onto the DB row. Customer mapping by stored Stripe IDs, not email match. Entitlement changes are driven by verified Stripe webhooks only, never client redirects; nightly reconciliation against Stripe.'
  - id: SA-029
    title: jabez-series-sabbath-first-week-shape-and-content-rulings
    note: 'Founder-ratified 2026-07-12 (Prayer of Jabez series build). (1) A prefab 7-day series starting on a Sunday opens with the Sabbath day (Day 1), followed by five deep-dive teaching days in the week chiasm A-B-C-B-prime-A-prime (Days 2-6) and closes with the Recap (Day 7) — reordering the AUTHORING-SPEC default (recap Day 6 / sabbath Day 7). (2) Recap days must carry Further-Your-Learning material equipping study beyond the series. (3) Prosperity-gospel misuse of a passage is confronted head-on, charitably and by name. (4) Founder reads the full text BEFORE any imagery is generated. (5) Series imagery generator: Higgsfield GPT Image 2, riso duotone per the founder mockup reference; videos must be official-channel and embeddable (inline playback, never embed-blocked). AMENDED 2026-07-22 (founder): the Jabez build process is ratified as THE standard for ALL prefab devotional builds, codified as the /devo-go skill (.claude/skills/devo-go/); deviations require a new registered ruling. Note: unrelated to the ad-hoc "SA-029/SA-030" fix labels in CHANGELOG 2026-05 (soul-audit debug session) — those were never registered decisions; this yaml is the canonical registry.'

  - id: SA-030
    title: two-minute-open-self-contained-devotional-head
    note: 'Founder-ratified 2026-07-22. FORWARD-ONLY (not retroactive to existing series, incl. prayer-of-jabez): every new prefab devotional day opens with a self-contained ~2-minute devotional — anchor Scripture as is, one vocab word, one reflection, one short prayer — followed by a DEEP DIVE CTA that jumps into the full devotional on the same page; after the CTA, the deep dive proceeds per the usual A-B-C-B-prime-A-prime structure (SA-029 / AUTHORING-SPEC). The 2-minute block is complete on its own: a reader who stops at the CTA has had a whole devotional. Enforced opt-in by the validator when a day declares format: two-minute-open. Codified in the /devo-go skill. Note: unrelated to the ad-hoc "SA-030" fix label in CHANGELOG 2026-05 — never a registered decision; this yaml is canonical.'

  - id: SA-031
    title: harvest-series-featured-area-policy-and-uninterrupted-pipeline
    note: 'Founder-ratified 2026-07-26 (The Harvest series build, F-082). (1) FEATURED-AREA POLICY: the homepage featured area shows exactly 7 series; the MAIN feature slot always belongs to the MOST RECENT series; too-busy-for-god rotated out for the-harvest. Supersedes the 2026-05-08 Bible-365-first featured direction. Applied in src/data/series.ts FEATURED_SERIES and src/data/series-rails.ts FEATURED_SERIES_SLUGS. (2) MONDAY-START SHAPE: a series starting Monday runs five deep-dive days (A-B-C-B-prime-A-prime, Days 1-5), Saturday Recap (Day 6), Sunday Sabbath close (Day 7) — the AUTHORING-SPEC default shape; SA-029(1) sabbath-first applies only to Sunday starts. (3) UNINTERRUPTED PIPELINE ("run the full pipeline please... no interruption. end to end", 2026-07-26): the /devo-go pipeline runs end-to-end without pausing at the SA-029(4) reading gate or the deploy-confirmation gate; the reading artifact is still published and all gates/evidence still run and are reported — they become non-blocking. Founder reviews live output and requests revisions after. This amends SA-029(4) and the devo-go skill gate order.'

  - id: SA-032
    title: harvest-v4-cluster-cross-testament-accuracy-and-account-resume
    note: 'Founder-ratified 2026-07-27 (The Harvest v4 + platform). (1) ACCOUNT-STATE RESUME: signing out must never lose reading state — the active devotional and any soul-audit plan follow the ACCOUNT (active_series user-keyed; devotional_plan_instances.owner_user_id stamped at sign-in and lazily on read), so signing back in resumes exactly where the reader left off on any device. Sign-out still clears local cookies. (2) PARABLE-CLUSTER RULE: a series seeded on a parable that Scripture groups in a discourse (Matthew 13 kingdom parables) covers the cluster as interrelated — the-harvest v4 spans Sower + Wheat-and-Weeds with Mustard/Leaven/Net woven in. (3) CROSS-TESTAMENT RULE (all prefab days, forward): NT-anchored days carry a real OT connection that day; OT-anchored days carry a NT connection; corpus-verbatim only. (4) IMAGERY ACCURACY GATE: every illustration fact-checked (botanical/historical/textual) against the claim it illustrates before placement — style-checking alone is insufficient (precedent: identical-formed-heads wheat/darnel plate, founder-caught in production). (5) REPETITION SWEEP: editor pass must count and thin cross-day recurring phrases before READY. Codified in the /devo-go skill.'

  - id: SA-033
    title: wake-up-mount-retirement-and-cleanup-pass-2
    note: 'Founder-standing orders executed 2026-07-27 ("keep going - finish and deploy everything"; wake-up pin 2026-07-12). (1) Legacy /wake-up/* double-mount RETIRED: shared readers relocated to canonical /devotional/[slug] and /series/[slug]; silo branching removed; permanent redirects preserve every old URL incl. the RSS feed path; footer/tab-bar/sitemap/error-boundary/sunday links swept. (2) Settings AI & KEYS repaired within SA-026: the mislabeled single key field split into honest Anthropic + OpenAI fields; Google (upstream model shut down)/MiniMax/NVIDIA picker options and key fields retired from the UI (router untouched). (3) Uncited fear-stat copy removed from identity/peace/hope series contexts per PUBLIC-FACING-LANGUAGE tone rules (SOURCE-OF-TRUTH open item #11). (4) Unwired soul-audit UI orphans removed; deferred infra (clarifier, phase-5 queue, voice-bank) and /design/imagery-samples deliberately KEPT.'

  - id: SA-034
    title: two-minute-open-v2-scripture-writeup-and-third-person-series-voice
    note: 'Founder-ratified 2026-08-10 (the he-cannot-deny-himself series build, F-085). (1) TWO-MINUTE-OPEN v2 — FORWARD-ONLY amendment to SA-030: the self-contained opening block gains a short write-up ABOUT the anchor scripture between the vocab word and the reflection, so the open teaches the passage instead of jumping from a word straight to a question. New sequence: scripture, vocab, teaching (~150-250 words), reflection, prayer, cta. Days declare format "two-minute-open-v2"; the validator enforces the six-module sequence AND that the DEEP DIVE cta targets #devotional-section-7 (section ids are 1-indexed over the module array). The five-module "two-minute-open" shipped in the-harvest remains valid and is NOT migrated; it is simply not used for new days. Codified in content/AUTHORING-SPEC.md and the /devo-go skill. (2) THIRD-PERSON SERIES VOICE: a founder may pin a series to third-person/first-person-plural narration, overriding the AUTHORING-SPEC section 2 voice table permission to use "you" in teaching/bridge/story/insight/vocab prose. reflection, prayer, takeaway, and interactive modules stay in direct address because the form IS address. Pinned for he-cannot-deny-himself; recorded in the series brief and enforced by an editor grep. (3) SEED-VS-ANCHOR: a passage the founder names as the week sentiment rather than the week text (here 1 Thessalonians 5:1-10) is honored as a secondary scripture and named in the recap, never promoted to anchor.'
  - id: SA-035
    title: prerendered-narration-complete-reading-contract-and-single-voice-lock
    note: 'Founder-driven 2026-08-11 (F-086). (1) AUDIO EDITION IS PRE-RENDERED, NOT SYNTHESISED. The Web Speech reader shipped in F-030 is demoted to a fallback for devotionals with no rendered track. `speechSynthesis` is not a media element, so Media Session cannot attach: no lock screen, no background playback, and iOS halts it when the screen sleeps. Listening while working was impossible by construction regardless of voice quality. Narration is now pre-rendered to AAC and played through a real <audio> element. (2) THE READING CONTRACT IS COMPLETE-BY-DEFAULT. Measured across 521 devotionals, the old fixed field list spoke a median 70.7% of each entry's distinct prose - about 252,000 words catalog-wide were never read, including every `profile` module. src/lib/audio/segments.ts now carries an ordered field list per module type PLUS a catch-all sweep, so a field appearing in only a handful of modules can never go silent; mirrored fields (teaching.content == teaching.body, identical in 1,410 of 1,422) are deduped rather than read twice. Result: +37.2% words spoken, median 1.37x, zero devotionals regressed. (3) NARRATOR IS A PRESET VOICE, NOT A FOUNDER CLONE. The clone path (Voicebox + qwen-TTS from interview audio) was abandoned on measurement: it could not reach narration pace by any lever - seeds moved rate +/-0.4 w/s, the `instruct` field is a confirmed no-op on the MLX path, and register-specific reference profiles changed pacing not at all - so every take needed an audible ~1.35x time-stretch. Two constants in the prototype spec were also wrong: the founder's 'natural rate' of 2.82 w/s is really 3.57, and take A3's reported 2.87 w/s measures 3.48, because v1 computed rate from API metadata instead of the audio it wrote. Canonical voice is Kokoro-82M `am_michael` at ~162 wpm. (4) ONE VOICE, MECHANICALLY ENFORCED. A catalog narrated by two voices is obvious to a listener and invisible to text-accuracy checks. spec/verify_voice_lock.py fails on any track that is not the canonical voice. (5) PRONUNCIATION OF GREEK/HEBREW TRANSLITERATIONS IS HUMAN-VERIFIED. Whisper was not trained on them and mangles them whatever the voice does, so the automated gate is invalid for exactly these terms. Overrides live in spec/pronunciation-overrides.json and alter only what is sent to the engine, never the devotional text, so the reading stays verbatim. The `pronunciation` field already in the content is NOT usable as-is: the engine reads its hyphens as breaks (KHEH-sed -> 'k-sad').'

  - id: SA-036
    title: commissioned-series-day-count-is-a-founder-input-not-an-assistant-inference
    note: 'Founder-corrected 2026-08-14 (F-087, the looking-at-the-sun series). This decision RECORDS A REVERSAL. The reading was first built and shipped as a SINGLE day on the assistant''s own inference from the phrasing of the request ("a devotional", "a link to the devo") plus a delivery date; the assistant then wrote that choice into this file as though it were policy. The founder rejected it the same day and the series was rebuilt clean-sheet as the full seven days. The rulings that stand are these. (1) DAY COUNT IS A REQUIRED FOUNDER INPUT AND IS NEVER INFERRED. /devo-go lists "passage/topic + day count + start day" among its required inputs and instructs the operator to lock the week shape via AskUserQuestion BEFORE writing anything. Skipping that gate is a process violation regardless of how reasonable the inference looks, and a reading commissioned for a named person is still a seven-day series unless the founder says otherwise. The default is seven. (2) DO NOT ENCODE AN ASSISTANT JUDGEMENT CALL AS A DECISION. production-decisions.yaml records founder rulings. Writing an unasked-for scope choice into it disguises a judgement call as policy and makes the drift harder to spot later; the prior text of this entry is the precedent for what not to do. (3) A CONVERSATION TRANSCRIPT IS A VALID CONTENT SEED, AND THE SPOKEN WORDS ARE THE SPINE. Source content came from a Granola meeting transcript (2026-08-13) in which the founder gave an impromptu five-minute reading. Every substantive move in the published week traces to something he actually said — wilderness as instruction rather than punishment, rest and grace, the Martha problem, "pay attention to what you pay attention to," running the race with endurance, and the sun image the series is named for. The transcript is the seed and the emotional spine; it is NOT a citation source, and every scriptural, lexical, historical and biographical claim was verified independently to the standard of any other build. The named recipient appears nowhere in the published text. (4) COMMISSIONED SERIES DO NOT TAKE THE HOMEPAGE FEATURE SLOT WITHOUT A RULING. SA-031(1) gives the main homepage feature to the most recent series. A series commissioned for one person enters SERIES_DATA and NEW_SERIES_ORDER, takes one editorially-appropriate /series rail placement, and leaves FEATURED_SERIES and HOMEPAGE_TODAY untouched unless the founder directs otherwise. Reach is by direct link. (5) THE IMAGERY ACCURACY GATE (SA-032) EXTENDS TO CAPTIONS. Where a library plate is right for the moment but wrong in a verifiable detail, the caption states the discrepancy rather than asserting the detail. Precedent set here: the rothem of 1 Kings 19 is a low desert shrub and the chosen plate renders a full-canopied tree, so the caption says so in parentheses. Silence would have been a false claim; discarding an otherwise correct plate over an incidental detail would have been waste. (6) VIDEO CHANNEL VERIFICATION IS NOT OPTIONAL. A re-upload (`iVwauTiyFjM`) carrying BibleProject''s exact title and content was caught by oEmbed reporting the channel as "Starry Night Elf" and was rejected; the official id is `_TzdEPuqgQg`. Confirms traps.md section 12 as a standing check rather than a historical note.'

  - id: SA-040
    title: devo-go-imagery-is-generated-through-the-locked-pipeline-never-selected-from-the-library
    note: 'Founder-rejected 2026-08-14 (F-087): "THE ARTWORK IS INCORRECT!!! YOU DIDNT USE THE DEVO-GO PROMPT FOR IMAGES!!" All ten looking-at-the-sun plates were replaced. (1) SELECTING FROM THE LIBRARY IS NOT THE IMAGERY STAGE. F-087 shipped with "images from the library only, nothing generated"; /devo-go references/imagery-and-video.md defines that stage as GENERATION through Higgsfield gpt_image_2. The library-first rule in CLAUDE.md governs incidental site imagery; a prefab series build runs the generation pipeline. (2) THE REFERENCE IMAGES ARE LOAD-BEARING AND MANDATORY. D-012 requires the empty-tomb hero (public/images/site/homepage/hero/header-v2.webp) be passed as medias role=image on EVERY generation, with a founder wokegodx plate for stipple and figure treatment. Text-only prompts drift, and the measurements show it: the rejected set carried 0.00 percent crimson across all ten, gold up to 34 percent as a co-dominant ink (day4-samaritan gold #da991d at 24 percent beat blue), blue collapsed to near-black navy #0e1d3e at delta 118-130 from ultramarine #1B3FAE, grays present against the no-grays rule, day1 rendered as a duotone photo-gradient and day4 as flat mid-century vector. Regenerated with references attached, all ten measure delta 36-62 and gold at or under 0.5 percent. (3) PASS THE ANCHOR FOR TECHNIQUE, NOT THE GOLD PLATES FOR COLOR. D-010 says study the founder references for shape and artistry and IGNORE color; the model cannot ignore color. Two of the five wokegodx plates are gold or orange dominant, and passing them invites the exact gold-flood failure being fixed. Pass the anchor hero for palette plus one figure plate for grain, and override its background in words. (4) THE FIGURE LOCK IS THE FIRST THING TO CHECK, NOT THE LAST. D-010 requires historically and regionally accurate figures and D-011/D-013 lock African/African-American; the rejected day4-samaritan rendered two Europeans. The first regeneration still produced a European Christ on day 5 and bleached Elijah to cream on day 3, because in a duotone strong light washes dark skin out. The clause that fixed it: skin STAYS dark cobalt dot density, the light rims him and never bleaches him to cream. (5) MEASURE, DO NOT EYEBALL. Every plate is sampled for dominant-blue distance from #1B3FAE and for crimson and gold pixel share before placement; the numbers caught what a glance would have called handsome. The style check follows the SA-032 fact check and both are mandatory. (6) FIX THE IMAGE, NOT THE CAPTION. SA-036(5) let a caption state a plate discrepancy because the plate was a fixed library asset. Under generation SA-032 governs instead: the rothem was re-rendered as the low broom shrub it actually is and the apology was struck from the caption.'

  - id: SA-041
    title: figures-are-identity-obscured-so-the-reader-can-stand-in-their-place
    note: 'Founder-directed 2026-08-14 (F-087), on the SA-040 replate: "supposed to be scientifically and historically accurate depictions if depicting literal people. And the aim is to obscure their identity more so so the reader can read themselves into the image. You nailed the style but not the subject." (1) ACCURACY AND ANONYMITY ARE TWO DIFFERENT AXES AND BOTH ARE REQUIRED. D-010 governs the DEPICTION: period-correct dress, correct anatomy and posture, correct setting, correct botany, African/African-American per D-011/D-013. THIS decision governs the IDENTITY: no rendered individual likeness. Satisfying the first does not satisfy the second, which is exactly how the SA-040 pass shipped four plates that were historically accurate and still wrong — they were portraits. (2) NO PORTRAITS. A devotional image is one the reader steps INTO, not one they look AT. Figures are seen from behind, turned away, bowed, cropped, wrapped, or read as bold graphic silhouettes with the face lost in shadow or swallowed by the light, edges dissolving into stipple. No eyes, no rendered facial features, no recognizable individual. This is not new direction so much as the governing form of what D-011 and D-013 already said in passing (chiaroscuro silhouettes; ONE bold African silhouette in vast negative space). (3) THE TEST IS WHETHER THE READER CAN BE THE PERSON. Day 3 is the reader lying wrapped under the broom; day 5 is the reader kneeling with an arm thrown over the eyes; the series card looks AT the sun WITH the figure rather than looking at the figure. The six plates that survived the correction survived because no face was visible in them: three figures walking away up the Emmaus road, feet on a track, hands on a scroll, and the three plates with no people at all. (4) SCOPE. Applies to literal named biblical people and to anonymous figures alike, on every narrative surface. Object and landscape plates are unaffected.'

  - id: SA-044
    title: active-day-is-shown-and-advanced-the-series-page-is-a-library-and-search-takes-phrasing
    note: 'Founder-directed 2026-08-14 (F-090), three asks in one night. (1) THE ACTIVE DEVOTIONAL SHOWS THE ACTIVE DAY. "The Active devotional should always show the active day as well. Not just default to day one. If I mark it done, the next day should show." Two independent halves were both missing. PATCH /api/devotionals/active has accepted a currentDay since 2026-05-14 and clamps it to the series length, but NO CLIENT EVER CALLED IT, so active_series.current_day sat where the series was started while completion accumulated only in localStorage. And the surfaces that did know the day linked past it: the library ACTIVE card printed "Day 3" above a button to a bare /daily-bread. markDevotionalComplete is now the single choke point that advances the server day, and src/lib/reading/active-day.ts owns both halves so they cannot drift apart again. It deliberately NEVER falls back to day 1 — an unresolvable day links to the SERIES page, because silently restarting someone three days in is what made the bug look like working software. "Next day" is the first INCOMPLETE day, not last-completed + 1, which skipped gaps when a reader went out of order. (2) THE SERIES PAGE IS A LIBRARY. "The series page needs revamp as series are hiding… function like a library of magazines, be more interactive and better searchable… 2 views, 1 is the full library alphabetical and sortable in various ways, and 2 is a list. actually add a feature style as well that shows it more bento box style." The rails view was the hiding mechanism: a handful of curated sideways shelves over 37 series meant anything in no rail was unreachable without switching views and knowing to look. Replaced by FEATURE (bento, newest eligible series leading, in-progress promoted), LIBRARY (every slug in ALL_SERIES_ORDER, six sorts, A-Z jump rail) and LIST. Coverage is now structural rather than editorial and is asserted in tests against ALL_SERIES_ORDER, so a new series appears without anyone remembering to shelve it. Filing drops leading articles for BOTH the sort and the bucket — when only the bucket stripped "The", the jump rail read "... R S N W T V". (3) SEARCH BY PHRASING, AND IT IS NOT THE SOUL AUDIT. "I want the user to be able to search by phrasing etc so they can find the most relevant devotionals - this is NOT the soul audit." The existing searchSeries/searchDevotionals use AND semantics, correct for a command-palette lookup and useless for how people describe a need: "I feel anxious about money" returned ZERO because no teaser contains the token "i". searchLibraryByPhrase drops stopwords, scores OR with a SQUARED coverage multiplier so partial matches sink, and pays an exact-phrase bonus per field. It searches devotionals as well as series, because a reader describing a feeling usually wants the one reading that meets it. No consent gate, no plan, no curation — it ranks the existing catalog and links into it. Both scorers stay: the precise one is still right for known-title lookup. (4) THE HOMEPAGE FEATURE ROTATES, AND THE COMMISSIONED SERIES IS AN EXCEPTION. "New series in the features each refresh, except the latest uploaded should always be the first shown on homepage." / "Each page refresh." Rotation MUST happen on the client: the homepage carries s-maxage=31536000, so a rotation computed during render is frozen into the edge cache and every visitor sees the same "random" set, and any Math.random() in render is a hydration mismatch. Server render is deterministic; an effect reshuffles the tail after hydration; the lead never moves. The lead is the newest ELIGIBLE series, derived from the end of NEW_SERIES_ORDER rather than hardcoded — the old HOMEPAGE_TODAY literal still named a series two releases old. Founder confirmed the exception directly ("not looking at the sun - thats an exception"), upholding SA-036(4): a commissioned series is excluded from the homepage lead, from the rotating tail, and from the /series bento hero, but still appears in LIBRARY and LIST because nothing may hide.'

  - id: SA-046
    title: an-existing-highlight-is-editable-recolour-note-remove
    note: 'Founder-reported 2026-08-15 (F-092): "the highlight feature doesnt work on desktop. I can highlight text, but not change colors or make notes etc. i am also signed in." (1) THE COLOURS WERE NEVER BROKEN — THERE WAS NO SECOND ACT. Reproduced on production: selecting text and picking a swatch works, and the mark paints in the chosen colour. What did not exist was any way back IN. handleSelection returns early for any selection anchored inside .reader-highlight — a guard that correctly prevents nested highlights, but which left an existing mark completely inert: clicking it did nothing, re-selecting it did nothing, and a scan of every button in the reader returned no note, edit or delete control at all. A highlight was frozen the instant it was made. Being signed in was incidental; the same was true signed out. (2) THE API ALREADY SUPPORTED ALL OF IT. /api/annotations has had PATCH (style + body, by annotationId) and DELETE since before this report. This was a missing SURFACE, not a missing feature, and nothing server-side changed. (3) CLICKING A HIGHLIGHT NOW OPENS IT. The same toolbar reopens anchored to the mark, where the swatches recolour it in place, a note can be written on it, and it can be removed. The mark repaints IMMEDIATELY and reconciles after, for the same reason the create path does (SA-038): the reader action must land visibly whether or not the network does. (4) NOTES LIVE IN style.note, NOT body. body already carries the anchor text and hydration falls back to it (anchor_text || body), so putting a note there would make a note and its anchor indistinguishable on restore. style is ours, PATCH accepts it, and colour and note then travel the same path. A noted passage is dotted-underlined so notes are findable by eye rather than by clicking every mark. (5) DEVICE-KEPT HIGHLIGHTS EDIT TOO. A highlight made signed-out has no id; recolour and remove rewrite localStorage instead of calling the API. The same control must not behave differently depending on something the reader cannot see. (6) THE TOOLBAR PREVENTS DEFAULT ON MOUSEDOWN. Without it the browser collapses the selection as the toolbar is clicked, which is a live hazard for the create path even though it was not the cause here.'

  - id: SA-047
    title: the-toolbar-flips-when-there-is-no-room-and-color-gold-is-not-gold-in-light-mode
    note: 'Founder-reported 2026-08-15 (F-092), following SA-046: "it works but i need to be able to remove the highlight. also the chat button style doesnt work - its black on blue currently (hard to see) and needs to change style according to whether light or dark mode." (1) REMOVE WORKED; IT WAS UNREACHABLE. Verified end-to-end on production, including persistence: create, click, Remove, reload — the mark stays gone and the localStorage row is cleared. The defect was POSITIONAL. The toolbar always rendered above the passage, clamped to y >= 10 and translated up by its own height, so for a highlight near the top of the window it landed off the top of the screen or underneath the sticky masthead, and its controls could not be clicked at all. It now flips BELOW the passage when there is less than 140px of room above. A control that exists but cannot be reached is not a control. (2) --color-gold IS A LEGACY ALIAS AND HAS NOW CAUSED THIS TWICE. The chat launcher used the utilities `bg-gold text-tehom`. --color-gold resolves to COBALT #1f2a8d in light mode (the name is historical; the alias is --color-cobalt) and to #c8a56a only in dark, so light mode painted a near-black #0a1320 icon on a blue disc. This is the same trap that made the /series bento kickers invisible in light mode 24 hours earlier (SA-044). RULE: any element whose GROUND is fixed across themes, or which pairs a background and a foreground, must set BOTH halves explicitly per theme — never reach for `bg-gold`/`--color-gold` and assume it is gold. The launcher now measures 9.7:1 (cobalt on cream) in light and 7.9:1 (gold on deep ink) in dark.'

  - id: SA-054
    title: 'Mobile paragraph spacing — space belongs to the leading, not the viewport'
    status: accepted
    note: 'Founder-directed 2026-08-16: "indents dont seem to be working on site and it makes text hard to read, this could be just a mobile thing, but we will need a site wide check on that." Then, after measurement: "reads fine on desktop, its a mobile paragraoh spacing issue- no indent needed i think." (1) THERE WERE NO INDENTS TO BREAK. text-indent appears nowhere on prose paragraphs — the only two occurrences in the codebase are an auth-code input and a hanging-punctuation fallback. Indents were never implemented, so nothing regressed; the founder was reading a symptom (paragraphs running together) and reasonably attributed it to a missing indent. Founder then ruled no indent is wanted. (2) THE CAUSE IS A VIEWPORT-RELATIVE CLAMP. .devotional-shell-panel .vw-body sets margin-bottom to --devotional-rhythm-sm, which is clamp(0.75rem, 1vw, 1rem). On a 390px phone 1vw is 3.9px, so the clamp collapses to its 0.75rem floor: a 12.75px gap under a 33.3px line-height, a ratio of 0.39. On a 1655px desktop the same token resolves to 16.55px. Paragraph space that is expressed in vw decouples from the type it separates. (3) THAT SELECTOR ALSO BEATS TAILWIND. space-y-6 was on the container and would have produced 25.5px, verified by injecting a control .space-y-6 into the live page which measured 25.5px correctly. The two-class unlayered descendant selector .devotional-shell-panel .vw-body wins over the @layer utilities space-y rule — the same layering trap this project has hit before. (4) THE FIX IS em, SCOPED TO MOBILE. margin-bottom: 1.45em inside a max-width 767px query, measured on production at 0.80 of line-height against 0.39 before. em tracks the type size, including the reader font-scale control. Desktop is deliberately untouched at 0.36 because the founder confirmed it reads correctly, and changing an accepted surface to satisfy a formula would be the wrong trade. (5) THE CHECK IS RATIO-BASED AND VIEWPORT-AWARE. scripts/check-paragraph-spacing.mjs measures gap divided by line-height across six routes at two viewports, because a 13px gap is generous under 16px type and invisible under 33px type. Mobile gates at 0.5, desktop at 0.33. Two calibration bugs were found and fixed while building it: multi-column containers put the next paragraph at the TOP OF THE NEXT COLUMN, so raw geometry returned ratios like -4.06 and read as catastrophic failure — the probe now detects the column break and falls back to declared margins; and single-pair containers (cookie banner, headline dek) are banners rather than reading flows and were producing more noise than signal, so a container now needs three consecutive pairs to be judged. A gate that cries wolf stops being believed, which is the same lesson SA-052 recorded about brightness-based image checks.'
  - id: SA-053
    title: 'Devotional readability — gate the tail, lower the arc, forward-only'
    status: accepted
    note: 'Founder-directed 2026-08-16: "It feels slightly too mature for some audiences. I think it needs to be 8th grade level reading maybe slightly more elevated. I can follow, but other folks may find it a bit too dense of material. I want the breadth of content to stay the same, but slightly lower reading level. just slightly." Then, on scope: "I dont want any retro active changes to text- just to the skill for future devotionals." (1) MEASURE FIRST, AND THE MEASUREMENT OVERTURNED THE PREMISE. Across the four most recent series (looking-at-the-sun, he-cannot-deny-himself, the-harvest, prayer-of-jabez), authored prose only with quoted Scripture excluded, the weighted Flesch-Kincaid is 7.7 and Reading Ease is 71 — that is already 8th grade and already plain English. Lowering the AVERAGE further would flatten prose that is correctly pitched. (2) THE DENSITY IS IN THE TAIL, WHICH AVERAGES HIDE. Each series carries 11-25 sentences of 45-95 words scoring grade 33-36, and 12-17% of all sentences run 30+ words. A reader stalls on those; the mean does not register them. So the gate is on the tail, not the mean: series-wide FK <= 8.5, under 8% of sentences at 30+ words, and NOTHING over 45 words. (3) THE DOMINANT FAILURE IS ONE SENTENCE SHAPE. 36% of the over-30-word sentences are setup clause + embedded archaic quotation + continuation, all punctuated as a single sentence — Milton, Augustine, a 1924 speech. The rule is now: setup sentence, quote its own sentence, response sentence. This single habit is the largest source of density in the catalog. (4) STORY AND INSIGHT MODULES ARE THE OFFENDERS at 20.9 and 24.3 words per sentence against teaching at 16.6. (5) THE FIX IS RE-PUNCTUATION, NEVER DELETION. Modelled: splitting long sentences at clause boundaries that already exist moves FK 7.7 -> 7.2 and 30w+ from 15% -> 11% without cutting a single word. That satisfies the founder constraint that breadth of content stays the same — same research, same quotes, same ideas, fewer stalls. (6) THE READING-LEVEL ARC SURVIVES BUT ITS CEILING DROPS. workflow.md specified "8th -> 12th -> college -> 12th -> 8th"; the chiastic arc is deliberate and stays, but the peak comes down to "8th -> 10th -> 11th -> 10th -> 8th". A flat cap would have destroyed the pivot day design, which is why this was raised with the founder before changing it rather than after. (7) FORWARD-ONLY. Founder ruled explicitly against retroactive edits to shipped devotional text. No devotional JSON was modified; the change is to the devo-go skill and a new gate script only. (8) TOOLING: scripts/check-readability.mjs reports both the mean and the tail and exits non-zero on the tail, run at the Phase 5 editorial gate.'
  - id: SA-052
    title: 'Series imagery — region-accurate people, fully developed frames'
    status: accepted
    note: 'Founder-directed 2026-08-15 (F-097). Founder rejected the existing series imagery and the first regeneration: "these all look like generic ai white people and not region and hostory seocific people"; "I dont like blacked out faces, so just try to hide faces through posing, but if a face is shown its ok"; "not NO white people for modern depictions, but not whitte people only"; "I would prefer the hero images not have soo much whitespace... no stark nothing backgrounds." (1) THE WHITEWASH WAS A RENDERING PROBLEM, NOT ONLY A WORDING PROBLEM. In a cobalt-on-cream duotone the cream paper is the ONLY other ink, so unprinted skin IS white skin. Naming an ethnicity while leaving skin near paper still outputs a white person. The prompt now states skin as a VALUE — brown to deep brown, therefore printed at DENSE dot coverage, obviously darker than the ground. This single line is the highest-leverage change in the pass. (2) THE EMPTY BACKGROUNDS WERE SELF-INFLICTED. The old style block asked for "generous negative space, high horizon line, small figure scale", which the model read as permission to leave the frame blank. Deleted and replaced by a FULLY DEVELOPED FRAME clause; measured bare-paper coverage across the final set is under 0.5 percent. (3) ANONYMITY COMES FROM SCALE AND POSE, NOT FROM BLACKOUT. The four founder-approved plates all keep the human small and turned away, so no face is ever rendered. The rejected batch made the figure large and frontal, which forced the model to invent a face and a wardrobe. Faces are now hidden by posture, angle, bowed head or head covering; a visible region-accurate face is explicitly acceptable; a featureless black void is explicitly forbidden. (4) THE GRAIN WAS UPSCALING, NOT COMPRESSION. next.config.ts sets images.unoptimized, so Next serves the raw file with no srcset. The headline slot is aspect-ratio 1408/768 at sizes="(max-width:900px) 100vw, 66vw" — about 1267 CSS px on a 1920 desktop and about 1125 device px on a 375pt phone at 3x. A 1024 square was being UPSCALED about 1.24x in the slot that matters most, and upscaled Ben-Day dots read as mush. Install is now 1600x872, the same shape as the slot, which also serves the OG card at 1.91:1. A square was the wrong master shape for every consumer. (5) THE GATE ADMITS WHAT IT CANNOT MEASURE. verify-masters.mjs measures border and blank-paper coverage and REFUSES to score the figures, printing instead which plates still need a human look. A plate can clear both measurements and still be a man in a sweatshirt. rooted failed at 3.7 percent blank sky, was regenerated with an explicit sky clause, and passed. 33/33 measured pass. (6) FOUR PLATES ARE UNTOUCHED. he-cannot-deny-himself, looking-at-the-sun, prayer-of-jabez and the-harvest are the founder-approved bar and are skipped by name in the install script. (7) THE PROMPT SET LIVES ON DISK, NOT IN CONTEXT. The first attempt lost its entire subject set to compaction and had to be re-authored from scratch at real cost. prompt-preamble.md, series-image-subjects.json, build-prompts.mjs, verify-masters.mjs and install-series-masters.mjs now hold the whole pipeline, and run state is derived from what is on disk. (8) OPEN, NOT SHIPPED: the founder also asked for imagery that reads "slightly more editorial". That is an aesthetic direction change affecting all 33 plates and was NOT attempted on my own reading of "slightly". Page weight also rose from 5.5 MB to 17.8 MB for the set (about 490 KB per hero against about 150 KB), because dense halftone is worst-case for compression; reducing further visibly degrades the dots.'
  - id: SA-049
    title: ten-print-forms-for-the-catalog-and-a-ground-that-does-not-follow-the-theme
    note: 'Founder-directed 2026-08-15 (F-094): "bento title hierarchy needs addressing. the Title and image are the main pieces of info. I want the list view to not show the category. The bento image sizing is off. The Library look should have less columns. Overall the page design needs more finesse with special attention paid to each page state. I want an additional version that looks like a newspaper rack... lets say 10 distinct and unique ways of displaying the info that is super sortable and searchable... BEAUTIFULLY DESIGNED... REFERENCE INNOVATIVE AND UNIQUE REAL WORLD DESIGN... TOGGLABLE WITH ICONS." (1) TEN LAYOUTS, EACH A REAL FORM OF DISPLAYING PRINT. Ten arbitrary CSS grids would have been ten arbitrary CSS grids. The founder own words for this page are "a library of magazines" and "each devotional is a newspaper on the rack", so every view takes its proportions and furniture from a real print form: FEATURE (Monocle front-of-book), RACK (a kiosk rail), COVERS (Phaidon plate wall), SPINES (a shelf), LIST (a stock list), INDEX (back-of-book dot leaders), CONTACT (a Magnum contact sheet), MOSAIC (Richter Atlas), BROADSHEET (a newspaper page), ISSUES (an issue chronology). (2) NUMBERS MUST MEAN SOMETHING. Decorative 01/02/03 markers are the generic default. Here the contact sheet numbers frames by their position in the CURRENT sort (re-sort and the numbering changes, as a re-laid contact sheet would) and ISSUES numbers by release order from seriesRecencyRank. Spine WIDTH encodes length, because width is the one thing a real shelf tells you at a glance. (3) TITLE AND PLATE CARRY THE TILE. The bento previously led with a gold uppercase kicker ABOVE the title — the brightest element on the tile was the least important thing on it. The kicker is gone; the tile is now plate + title, with length as a quiet line beneath. Rows went 150px to 210px so a landscape plate is not squeezed into a letterbox. (4) THE ICONS ARE MINIATURES OF THEIR OWN LAYOUT. The Rack glyph is a rail with papers over it; Spines is bars of differing width on a board; Index has a dotted leader. A reader can tell what a control will do before pressing it, which generic grid/list icons cannot. (5) --mock-ink INVERTS PER THEME AND MUST NEVER GROUND --plate-ink TYPE. In dark mode --mock-ink IS cream, so `background: var(--mock-ink); color: var(--plate-ink)` rendered the spines cream-on-cream and invisible. Added --plate-ground (#131b40), fixed in both themes, for every surface that carries plate type. This is the THIRD variant of the same trap after SA-044 and SA-047: any surface whose ground must not follow the theme needs a fixed token, not a mock token. (6) EVERY STATE IS DESIGNED, NOT DEFAULTED. Searching hands the page to results; an empty result names what was searched and offers five seed phrases that actually return something, plus a way back; a returning reader sees "Day n of m" and a progress rail; a cold reader sees neither. There is deliberately NO pre-hydration spinner — the catalog is static and server-rendered, so the page arrives complete and only the reader own progress fills in. (7) THE CHOSEN LAYOUT PERSISTS. With ten of them, dropping the reader back into FEATURE on every visit would be a small insult; the choice is stored per device and read after hydration so the server pass stays deterministic.'

  - id: SA-050
    title: seven-layouts-centred-controls-and-a-resume-line-that-defers-to-the-shelves
    note: 'Founder-directed 2026-08-15 (F-094), reviewing the ten layouts live: "on desktop center the toggles. remove contact sheet and broad sheet, and index. center the sort on desktop as well." Then: "the inprogress needs to be made much less prominent. the series I see as more important and the continue as secondary to that (still above fold)." (1) SEVEN, NOT TEN. INDEX, CONTACT and BROADSHEET are removed. Ten was the brief; seven is what survived review. A switcher is worth more when every option on it earns its place, and the three cut were the three that carried no artwork or no hierarchy — an index and a broadsheet are lovely as objects and weak as ways to choose a reading you have not seen. The components are deleted rather than left unmounted; git history holds them if they are ever wanted back. (2) THE CONTROLS ARE CENTRED AND STACKED. The bar was a space-between row with views left and sort right, which read as an application toolbar. Centred and stacked it reads as a masthead control, which is what this page is. (3) IN-PROGRESS IS SUBORDINATE TO THE SHELVES. The resume affordance was a bordered tile with a gold label, a heading and a CTA line — louder than any single series on a page whose entire job is choosing a series. It is now ONE quiet line ("Continue · <title> · Day n"), meta-sized and muted, above the search and above the fold but plainly secondary. Added as a `resume` variant on ActivePlanBadge rather than by changing `tile`, which stays available. It renders nothing at all when there is no active plan, so a cold reader sees only the shelves.'

  - id: SA-051
    title: red-is-reserved-for-the-words-of-christ-and-attribution-is-never-inferred
    note: 'Founder-directed 2026-08-15 (F-095): "the continue is the right size but maybe needs a color or something to stand out a bit. also- through out the site- Jesus direct words in Red. ensure the highlight color is correct for such text." Then, asked whether a source exists: "are there no guides to this for the edition we have online anywhere?" (1) THE RESUME LINE GETS A WARM ACCENT, NOT RED. Bronze #8a5e12 on cream (5.1:1) and gold #d8b273 on the deep ground, with a 3px left rule and a 7 percent wash. Deliberately NOT red: red is now reserved site-wide for the words of Christ, and spending it on a navigation affordance would empty it of meaning. (2) THE RED IS THE BRAND RED. The first pass invented #7a1c12 by contrast measurement WITHOUT checking the palette; the founder corrected it - "i have a red color that is a part of the branding already". --color-crimson already exists (#c4192e light / #e25868 dark, the riso spot ink, already used for pullquote marks) and red letter now uses that token. Measured: 5.2:1 on cream and 4.2:1 on the deep ground, which clears AA at the display sizes scripture is set in. The brand crimson does NOT survive a highlight behind it (purple 2.8, blue 3.1, pink 3.2), so INSIDE a highlight only it deepens to #7d0f19 - the same hue further down, 5.1:1 on the worst ground and 9.3 on cream - reading as the brand red darkened rather than a second colour. LESSON: check the design tokens before measuring a new value; a contrast-correct invented colour still fragments the palette. (3) ATTRIBUTION IS NEVER INFERRED, AND NO SOURCE EXISTS FOR OUR EDITIONS. Verified rather than assumed: the KJV OSIS on disk carries 2,021 exact words-of-Jesus milestone pairs but covers 1 of our 125 Gospel passages; the OFFICIAL public-domain BSB USFM (usfm-bible/examples.bsb, 43LUKBSB.usfm, 156KB) contains ZERO \wj markers and only footnote markup; NIV is copyrighted with no open dataset; STEPBible-Data has no speaker attribution. Our Gospel passages are BSB 70, NIV 50, ESV 2, NKJV 2, KJV 1. (4) A QUOTATION-MARK PASS IS WRONG ON THIS CATALOG, DEMONSTRABLY. Luke 10:33-37 (BSB) in looking-at-the-sun-day-4 has three quoted spans; the middle one, "The one who showed him mercy", is the expert in the law, not Jesus. A naive pass puts Christ colour on another man words. KJV compounds it by not punctuating speech at all. STANDING PRINCIPLE: a missing red word is a typographic omission, a wrongly red word is a false attribution. Under-mark, never over-mark. (5) SO THE RENDERER SHIPS AND THE ATTRIBUTION DOES NOT. Module.redLetter carries spans copied verbatim from the passage; renderRedLetter wraps them longest-first and SKIPS any span it cannot find rather than widening the red. Three attribution options are with the founder and unanswered: a safe auto-pass constrained by the KJV verse list that skips mixed-speaker verses (recommended), hand-authoring, or an auto-pass plus a per-passage review artifact. Full investigation recorded in docs/run/HANDOFF-2026-08-15-library-and-red-letter.md.'

  - id: SA-052
    title: one-reader-shape-covers-leads-the-switcher-and-red-letter-reaches-multi-verse-passages
    note: 'Founder-directed 2026-08-15 (F-094/F-095), three corrections on the live build. (1) DAILY BREAD IS THE SAME READER. "The daily bread reader should look exactly the same as the normal reader (ie centered column, no image on the right on scroll etc." The difference was one prop: the dedicated reader passes DevotionalRhythm enabled={false}, and CuratedActiveView passed enabled={rhythmImages.length > 0}, which turned on the alternating text-left / sticky-image-right rhythm on Daily Bread and nowhere else. Both are now one centred column. If the rhythm is ever wanted back it must be turned on in BOTH or neither - a reader that changes shape by route reads as two products. (2) COVERS LEADS THE SWITCHER, ISSUES SECOND, PATHWAY SORT REMOVED. The art is the fastest way to recognise a reading you have seen and recency is the second, so those are the first two controls and Covers is the default view. Pathway (Sleep/Awake/Shepherd) is gone from the sort - it is an authoring taxonomy, not something a reader browses by, and the list had already dropped it as a column (SA-049). (3) RED LETTER REACHES THE COMMON GOSPEL SHAPE. The founder had still seen no red: "Infact- I havent seen one red letter yet." The passages he was opening are MULTI-VERSE MIXED in NIV - John 6:25-29 is narration, Jesus, narration, Jesus - which fell through every path: not all whole-verse, not a single verse, and NIV wording never matches BSB. Added a fourth path that attributes the passage OWN quotations by their reporting clause ("Jesus answered,"), accepted ONLY when the count of Jesus-attributed quotations equals the count of His speeches the KJV says begin in that verse range - two independent sources agreeing rather than one heuristic guessing, and any unattributable quotation voids the whole passage. ORDERING IS LOad-BEARING: this runs only AFTER the verbatim path returns nothing, because the verbatim path carries parable narration that has no quotation marks at all (Luke 10:30-35). Running it first regressed Luke 10 to the single quoted line and silently dropped the parable - caught by the existing negative-control test.'

  - id: SA-053
    title: red-letter-is-comprehensive-explicit-attribution-wins-and-direction-is-load-bearing
    note: 'Founder-directed 2026-08-15 (F-095), pushing for completeness: "If it literally says \"jesus said\" it is safe to make a red letter. Be more diligent and cross reference as much as possible. Needs to be comprehensive." (1) EXPLICIT ATTRIBUTION IS DECISIVE ON ITS OWN. The previous guard required the count of Jesus-attributed quotations to equal the count of speeches the KJV expects AND allowed no unattributable quotation anywhere, so a single unclear quote discarded the ones we were certain of - passages reading literally "Jesus said to them," and "Then Jesus declared," were left black. Now an explicit subject attribution marks that quotation regardless of what else is in the passage. (2) DIRECTION MATTERS AND NEARLY INVERTED THE MEANING. "They said to Jesus" names him as the OBJECT. A loose /Jesus.*said/ match would have painted the crowd words in Christ colour - the precise failure this whole module exists to prevent. Object forms are now matched FIRST and rule him out. (3) THE REPORTING CLAUSE IS THE GAP BETWEEN QUOTATIONS, NOT A FIXED WINDOW. A fixed 80-character look-back reached past the previous quote and picked up an unrelated clause; in "The crowd said to Jesus, \"...\" Jesus answered, \"...\"" it saw "said to Jesus" while attributing the SECOND quote and ruled Christ out of his own words. Look-back is clamped to the previous quotation end and look-ahead to the next quotation start. (4) A CLAUSE ENDING IN A COMMA LEADS INTO THE NEXT QUOTE. The text between two quotations is genuinely ambiguous - "...?\" Jesus answered, \"..." could trail the first or lead the second. Punctuation settles it; without this the first speaker words were attributed to Christ. (5) THREE MORE CROSS-REFERENCES, EACH GATED. A bare "he said" is trusted only when no other speaker is named anywhere in the passage, so the pronoun has one possible referent. A continuation quote is trusted only when nobody else has spoken in between. A dominical formula ("Very truly I tell you", "I am the") corroborates only inside a verse range the KJV already says he speaks in. (6) KJV WORDING ADDED TO THE VERBATIM PATH. KJV does not punctuate speech at all, so a KJV passage has no quotations to attribute and BSB wording never matches it. Luke 10:38-42 ("Martha, Martha") was the single passage in the catalog left black for this reason. RESULT: 93 of 153 Gospel modules attributed, 60 correctly black because their range contains no speech of his, and ZERO remaining passages that contain his words and lack attribution. Coverage is comprehensive by measurement, not by assertion.'

  - id: SA-054
    title: feature-is-a-front-page-spines-are-shelves-and-today-is-the-daily-edition
    note: 'Founder-directed 2026-08-16 (F-094/F-097). (1) FEATURE IS A FRONT PAGE, NOT A BENTO. "Try something different here- make it feel like a literal newspaper grid, with different sized stories etc." A broadsheet allocates space by importance, so the view does too: a LEAD with a 21:9 plate and a banner headline, two boxed SECOND stories separated by a column rule, a ruled RAIL of briefs, then the rest set as four columns of listings. Every size says something about the series rather than decorating it. (2) RACK: FOUR TO A RAIL, NOT SIX. "Rack doesnt feel like a news paper rack enough and I think there are too many columns." At four each paper is wide enough to read as a folded front page - masthead, rule, plate, standfirst - which is the order a real front page uses. (3) SPINES: SHELVES, NOT A SCROLLBAR. "Spine should have several rows of books and the spines can be larger. No overflow scroll, all on page visible." Twelve to a shelf, each shelf with its own board, wrapping instead of scrolling, and spines widened to 104-190px so a row FILLS rather than trailing into whitespace. Width still encodes length. (4) /today IS THE DAILY EDITION AND EARNS A NAV ENTRY. "I want it to be like a literally daily edition of a newspaper... this is a place where people can come for daily content." Masthead with a thin-over-thick double rule, a dateline carrying Vol/No DERIVED from the date (same day = same edition for every reader) and the real liturgical day, a front page of lead story plus an "Also in this edition" rail, then the full reading below. SA-033 still holds: DAILY BREAD means YOUR devotional; TODAY is the edition, a different thing, and the nav no longer duplicates because they are no longer one destination. (5) THE EDITORIAL SECTIONS ARE DECLARED AND EMPTY, BY DESIGN. Dispatches, Community and the prayer list have NO data source in this repo - there is no feed of global reports and no submissions table. src/data/daily-edition.ts declares and types them; each renders ONLY when it carries real entries and is absent entirely otherwise. No placeholder card, no "coming soon". Inventing a dispatch from Nigeria or a prayer request would publish fiction as fact under a masthead, in a devotional context - the one failure this product cannot afford. Every Dispatch carries a required `source` because an unattributed report is a rumour.'

  - id: SA-055
    title: subject-desks-matched-bookends-and-a-real-daily-edition
    note: 'Founder-directed 2026-08-16 (F-098), second round on the same surfaces. (1) THE FEATURE BOTTOM IS A NEWS SITE, NOT A CLASSIFIED COLUMN. "the top feels like a newspaper, the bottom needs more finnese… should feel like a newpaper but like newspaper website with sections and such", and "please bring images into the feature toggle state for all devotionals". Below the front page the catalog now prints as SUBJECT DESKS - Beginnings, Scripture, The interior life, Under pressure, Identity and work, Together, Hard questions - each laid out as a section front: a lede column with a plate beside a filling grid of equal thumbnails. Every entry carries an image. Sections are by SUBJECT, never by pathway: SA-050 removed pathway from browse and it does not return through the side door. src/data/series-sections.ts sweeps anything unclassified into a final desk, so no reading is ever dropped - a browse surface that silently omits a series is worse than an imperfect heading. (2) RACK PAPERS ARE ALL ONE SIZE. "i do not like the giant image at the bottom of rack. all of them should be same sized." The cause was flex: 1 1 0 - the final rail holds one paper, not four, so that paper stretched to the full width of the rack. Fixed basis now; a kiosk does not resize its papers to fill the bar. (3) SHELVES CENTRE BETWEEN MATCHED BOOKENDS. "Center the books on spine- add unique book ends on each row that are site thematic." Six thematic pairs - lamp, wheat, fish, anchor, chi-rho, door - drawn from this site own furniture, the left one mirrored as a real matched pair is, indexed by shelf so the wall never reshuffles. Eight spines per shelf, not twelve: at the widened sizes twelve overflowed the row and WRAPPED inside itself, putting the bookends around two lines of books and the board under only the lower one. (4) THE DAILY EDITION CARRIES A REAL PAPER. "The today page needs more content, you will have to invent stuff that makes sense… needs images to lead thumbnails, icons etc… the site will eventually have practical guides on biblke reading and studying etc too. Today page could lead this effort. Could use a daily cartoon." Added: THE PRACTICE (one finishable thing to do today), a Greek/Hebrew WORD STUDY at standard lexical meaning, HOW TO READ (the first practical Bible-reading guides, each led by a plate chosen for its subject), THE DAILY PANEL (our riso parable plates with a written caption - what an editorial cartoon actually is, since a gag strip is the wrong register for this masthead), and THE PRAYER LIST as a weekday intercession pattern. Rail briefs gained thumbnails. All of it rotates by day of year, never at random, because an edition that differs between two readers on the same morning is a feed wearing a masthead. (5) THE INVENTION LINE, MADE EXPLICIT. The founder authorised invention; this decision records WHERE it applies. We invent our own voice - practices, guides, captions, categories of intercession, lexical glosses. We do not invent other people REPORTED FACTS. DISPATCHES, COMMUNITY and reader PRAYERS stay empty and their sections stay absent, because a dispatch saying a named church in a named place did a thing, or a prayer request from a named reader, is a claim about real people with no source behind it. Everything in the prayer list is a category of need true every week in every place; nothing claims a fact about a person. (6) HOME IS A MARK. "change the Home menu item to an icon of a biblical style home." A Levantine house - flat roof oversailing the walls as the parapet Deut 22:8 requires, tall arched door - in three strokes, because a stair and a window turned it to mud at the 18px it actually renders at. Accessible name stays "Home". (7) PLATES ARE DERIVED, NOT SHIPPED RAW. next.config sets images.unoptimized, so a 1-2 MB library PNG reaches the browser untouched. The 16 edition plates are webp derivatives in public/images/edition/: 25.1 MB became 2.26 MB.'

  - id: SA-056
    title: weight-based-front-page-and-the-rose-window
    note: 'Founder-directed 2026-08-16 (F-099). (1) FEATURE ALLOCATES COLUMN INCHES BY WEIGHT. "Feature needs restyling, feels very unbalanced. I like asymettry, but the hiearchy doesnt make sense in terms of size of devotionals." The fix is not to even the sizes out - it is to make them mean something. A front page gives a story column inches in proportion to its weight, and here weight is the LENGTH of the reading. Setting a 365-day companion as a one-line brief while a five-day ran across the top was the nonsense being described. Sorted by days descending, recency breaking ties; the lead is bylined "The long read". The asymmetry stays, it just tells the truth about scale now. A test reads the day counts down the page and asserts they never increase. (2) SEVEN SPINES TO A SHELF, LARGER TITLES. "7 books per row on the spines, larger font for the titles." Seven buys ~30px of spine width, spent on type: 1.12rem to 1.45rem. Spine height 380px to 515px, because at the larger size the long titles clipped mid-word, which on a spine reads as a printing fault. Any title that ever outgrows its spine ellipsises rather than being cut. (3) ISSUES TAKES MASTHEAD SCALE. "Issues I want the title larger." An issue row is a masthead line, so its title moves off the body scale (--mock-type-1) onto clamp(1.5rem, 2.3vw, 2.25rem). (4) MOSAIC IS REPLACED BY THE ROSE WINDOW. "Mosaic needs a completely different treatment, not a fan of it. Make whatever this one is extemely unique and creative. think outside the box. Completely new idea/layout for that one." Every other view in the set is a rectangle - grid, rail, shelf, list - so this one leaves the rectangle. A rose window is the one piece of furniture a church puts its whole story into, and it is built the way a catalog is: a centre, then rings working outward, each pane its own scene, legible only when the light is behind it. Unlit glass by default; the pane under the cursor lights, and the HUB carries its title at readable size so thirty-seven captions are not fighting each other around the rim. Nothing spins on load and nothing rotates on hover - a window is still, and this is a reading surface. Rings are computed (12, 24, 36, remainder), never hardcoded to 37, so the window still closes when the catalog grows. Under 700px it unrolls into a ringed list, because outer-ring panes fall below the 44px touch minimum on a phone. (5) THE ROSE PANES LOAD EAGER, NOT LAZY. Chrome never fires its lazy loader for the panes - they are transformed off their grid position with translate(-50%,-50%), and every one sat with an empty currentSrc and an unlit plate while sitting in the middle of the viewport. Plate gained an `eager` prop that sets loading="eager" WITHOUT the preload hint `priority` adds; thirty-six preloads would compete with the page. (6) statusLabel ALREADY FALLS BACK TO dayCountLabel. Pairing them printed "6 DAYS - 6 DAYS". Never pair them.'

  - id: SA-057
    title: carved-bookends-thinner-spines-and-a-rose-that-grows
    note: 'Founder-directed 2026-08-16 (F-100). (1) BOOKENDS ARE GENERATED ART, NOT GLYPHS. "the book ends needs to be generated iconic art or something. The icons are not good looking. I want modeled thought out book ends." The line-art marks are gone. Seven riso plates of actual carved-stone bookends - lion, lamb, lampstand, wheat, olive, anchor, fish - each a real object with plinth, back-plate and weight, generated in the locked brand style (cobalt on cream, heavy Ben-Day halftone, no greys, no text) as one consistent carving series. Library was checked first per the image rules and holds no cut-out bookend forms, only full scenes with grounds. Each plate is CUT OUT to transparency so it sits on either theme's ground rather than carrying a cream rectangle into dark mode. Cutout method matters and is recorded: a per-pixel colour key punches holes through the halftone, so the mask is built by flood-filling from the border on a BLURRED greyscale copy (which bridges the dots), then keeping only the largest connected component (which drops the faint haze islands the generator leaves above the object). (2) SPINES ARE THINNER, WITH BIGGER TYPE. "the books are too thick and type still too small.. i think the titles have too much padding or something." Width range dropped from 132-200px to 78-134px; type 1.45rem to 1.72rem. The "padding" was not padding: justify-content: space-between pinned the title to the top and the day count to the foot, so every short title floated above a dead gap. The title centres now and the day count is out of flow. THE REAL CLIPPING CAUSE, worth keeping: a hardcoded max-height: 300px on .spine-title, predating the larger type. In vertical writing mode the INLINE axis is vertical, so max-height caps LINE LENGTH - it was ellipsising titles while the spine still had hundreds of pixels spare. Seven per row stands. (3) LIST TAKES A BOLD FIRST COLUMN. "On List- makle the far left column bold." The title is the column you scan down, so it carries the weight. (4) THE ROSE WINDOW NOW GROWS. "I like ROse, but not sure it can grow with more series being added." It could not: ring capacities were the literal list [12, 24, 36] with a fixed 16% radial step, so a fourth ring landed past the rim and a fifth had nowhere to go. The geometry is derived from the count instead - pane size scales down in bands, each ring is filled to what its own circumference holds without panes touching, and the whole window scales inward if the outermost ring would overshoot the frame. A geometry test asserts, for catalogs of 8 through 300, that nothing is dropped, no panes on a ring overlap, no ring overlaps the one inside it, nothing hangs off the frame and nothing collides with the hub.'

  - id: SA-059
    title: daily-bread-and-today-swap-and-a-shared-site-bottom
    note: 'Founder-directed 2026-08-16 (F-103). THE BIG ONE: DAILY BREAD AND TODAY SWAP, AND THE PAPER IS RENAMED. "Daily Bread should be the Today page, and Today page should be the Daily Bread page. The Daily Edition, is now The Daily Bread." So: /daily-bread now serves THE PAPER, whose masthead reads The Daily Bread (was The Daily Edition at /today), and /today now serves YOUR READING - your active plan, your place in it, your next reading (was /daily-bread). SA-033 SUPERSEDED IN NAMING ONLY: its substance stands - one of these two pages means YOUR devotional and the other means the shared edition - but the names traded places, so any earlier note reading "today means YOUR devotional via the Daily Bread resolver" is now inverted. THE SWAP IS BY MEANING, NOT BY STRING. Every internal reference that means "take me to my plan reader" was repointed to /today: the middleware auth matcher, /my-devotional redirect, the soul-audit current/manage/select/select-status route payloads, onboarding-flow destination, global-search plan-day hrefs, DevotionalLibraryRail planHref, the mobile tab, LibraryView / SeriesActions / DevotionalActions router pushes, and the library page pointer. Anything that means "the paper" stayed on /daily-bread, and the /todays-edition alias now redirects there (with force-dynamic so it answers a real 308 instead of a 36KB meta-refresh page). Nine test files encoded the old contract and were updated with it. ALSO IN THIS DECISION: (a) desktop nav items are smaller (0.78em); (b) the home mark is SOLID, not outlined - at 14px a filled silhouette holds its shape where a hairline outline goes muddy; (c) EVERY page now ends with the same bottom, extracted from the home page into src/components/SiteBottom.tsx (footer columns, then the EUANGELION masthead, then the legal line). It was inlined in page.tsx and simply ABSENT from About, Help, Support and the legal pages, which ended mid-air. 34 files now use it; (d) the copyright is one line of small type. It kept wrapping at exactly 489px because `.homepage-bottom-legal p` (0-1-1) out-specifies a bare class (0-1-0), so the 92ch paragraph measure survived - the override has to be `.homepage-bottom-legal p.homepage-bottom-legal-line`; (e) the home resume-plan banner and the Soul Audit input are centred (the input takes a 44rem measure with auto margins).'

  - id: SA-060
    title: mobile-pass-the-lancet-and-site-wide-scroll-motion
    note: 'Founder-directed 2026-08-16 (F-104), mobile pass + motion. (1) MOBILE SERIES TOGGLES. "the mobile version of the series toggle states needs to be finnessed." Rack: the kiosk bar is hidden under 640px - "The rack doesnt need the bold blue divider between rows there are no rows", and at one paper per row that bar becomes a heavy rule between single papers, the opposite of its purpose. Papers also stop leaning (the tilt reads as breakage at full width). Covers: one per row at 4:5 - "Covers shove be 1 to a row and sized appropriately." (2) THE ROSE BECOMES A LANCET ON MOBILE. "The Rose concept doesnt even work for mobile- so the entire concept needs to be rethought out." Correct - a rose window is a WIDE wall opening and a phone is a narrow wall. Narrow walls get LANCETS: tall single-light windows set in a row. So the concept is rebuilt rather than shrunk. One mullion runs the height of the window, the lights hang off it alternating side to side, and each carries its TITLE beside the glass - the one thing the desktop wheel cannot do, which arguably makes the mobile form the more readable of the two. Glass, tracery, unlit-until-touched and the hub all survive; only the geometry changes. (3) HOME. The Bible-365 secondary CTA is removed (the featured slot makes one offer, not two). The featured plate went from ~525px tall to a 21:9 banner capped at 300px - "the featured devotional is 2x too tall". (4) HOW WE WRITE IS FOOTER-ONLY. "menu item should only be in footer" - out of the desktop bar AND the mobile hamburger. It is a colophon, not a destination. (5) THE SCROLL LINE WAS INVISIBLE FOR TWO REASONS, BOTH FIXED. It sat at z-index --z-sticky (100) while the topbar is 120 and the nav 110, so the header painted straight over it; and it was --color-gold, which IS cobalt in light mode (the standing token trap), so even uncovered it vanished into the header. It now rides at z-index 400 on the very top edge, in --mock-blue. (6) SITE-WIDE SCROLL MOTION. "I want the entire site to have more livilieness and scrolling animation and such… moments of paralax." Reference for feel: oci.madebybuzzworthy.com. One island (src/components/motion/Reveal.tsx): an IntersectionObserver that adds a class on first entry, plus a rAF parallax for opt-in layers. THE SAFETY PROPERTY, which is the whole design: the pre-reveal hidden state exists ONLY under .motion-ready, a class the island adds on mount. No JS, no class, no hidden content - the page renders exactly as it does today. Motion can only ADD to a working page, never gate it. Reveals fire once; prefers-reduced-motion stops the rAF loop ever starting; parallax is capped at 28px so an image never separates from its caption. (7) THE PAPER IS A BENTO SHEET. Founder, on Daily Bread: "It should feel like a bento style newspaper layout, with content pieces broken up with box contianers and lines seperating and grouping information." Structural reference (NOT motion): seaharvest.net.au. Every editorial piece below the front page is now a ruled COMPARTMENT, and compartments butt edge to edge sharing rules - which is how a page is made up and why a newspaper reads as one sheet rather than a stack of cards. Founder scoped this explicitly: the Sea Harvest vocabulary applies to the Today and Daily Bread pages ONLY, not site-wide.'

  - id: SA-062
    title: flow-replaces-the-rose-and-leads-the-toggles
    note: 'Founder-directed 2026-08-16 (F-106). FLOW REPLACES THE ROSE WINDOW AND LEADS THE TOGGLES. "this will be the first toggle on the series page. I want each series in a grid and to similarly function like this… Just the fluid motion, sizing and grid structure etc. Specifically the fuctionality motion and fluidity." Reference: nicolaromei.com, whose own instruction to the reader is "SCROLL / DRAG TO INTERACT W/ THE ARTBOARD" - so what is borrowed is a BEHAVIOUR, not a look. Founder was explicit: "Dont make things black and white or anything." Palette, plates and type stay Euangelion. Rose is REMOVED entirely (view, geometry, tests and CSS) - it was beautiful on a desktop and never survived a phone. Flow is also the DEFAULT view, because first has always meant default on this page. TILE SIZE ENCODES LENGTH: a 60+ day reading takes a 2x2, a 7+ day takes a 2x1, everything else a single cell, packed leftmost-lowest so the board has no holes. Deterministic from the sort order - change the sort and the board rearranges to match, never random. THE BOARD IS A CSS GRID, AND THIS IS THE IMPORTANT PART. The first build positioned tiles absolutely on a measured canvas, and the measurement was the bug: an un-laid-out frame reports clientWidth 0, `??` kept the 0 because 0 is a number, and the board froze at its default column count leaving a block of dead space on the right - exactly the "awkward spaces" the founder called out in the same message. Rewritten as a grid at width:100%, the board FILLS ITS FRAME BY CONSTRUCTION and no measurement can be wrong. Only the column COUNT comes from the viewport (2 on a phone, rising to 5 on a wide desktop). MOBILE FLOW IS A NATIVE SCROLLER, NOT A DRAGGED BOARD. "the mobile version is psecifically aimed at the way users use mobile devices." A drag-panned board is a desktop idea; on a phone it fights the platform and, worse, TRAPS the page - a finger inside the frame pans the board to its end and then has nowhere to go. Under 900px the frame is an ordinary scroll container with the board static inside it: same tiles, same packing, and the momentum belongs to the OS. FLOW PLATES LOAD EAGER. Chrome does not fire its lazy loader for children of a transformed container - the same trap the rose window hit - so every tile would sit as an empty plate ground forever.'

  - id: SA-063
    title: imagery-ruling-fail-open-motion-and-the-mobile-menu
    note: 'Founder-directed 2026-08-16 (F-107). Closing the loose ends. (1) IMAGE GENERATION IS CODEX BUILT-IN ONLY. Founder ruling, now in CLAUDE.md: use Codex built-in image_gen (covered by the ChatGPT subscription). NEVER ~/.codex/skills/.system/imagegen/scripts/image_gen.py - it calls the OpenAI Images API and BILLS THE API ACCOUNT per image. Nano Banana is banned for this project ("Stop using nano banana"), overriding the global cost-based default. Higgsfield stays retired. DISCLOSURE: 8 images were generated through the billed CLI BEFORE that ruling arrived; the founder accepted the spend. Claude Code has no built-in image_gen, so image work belongs to the Codex session - and there is no codex binary on PATH, so it cannot be driven as a subprocess from here either. Size ceiling (1536x1024 / 1086x1448) is expected and the never-upscale rule is lifted for built-in runs; upscaling happens downstream in Photoshop/Topaz. THE STYLE ANCHOR IS THE REAL VARIABLE. Text-only prompts drift off-brand regardless of generator - which is what made the first pass look wrong and nearly got the generator blamed. The founder-approved anchors (prayer-of-jabez, he-cannot-deny-himself, looking-at-the-sun, the-harvest) must be attached as references on every generation. (2) REVEAL MUST FAIL OPEN. The home page shipped its three step cards INVISIBLE: they carried data-reveal, the observer never fired for them, and they sat at opacity 0. Content hidden behind motion is strictly worse than no motion. Two guards added, both of which can only REVEAL: anything already inside the viewport is revealed on mount, and a sweep 2.5s after mount reveals anything still hidden. The worst case is now a missing animation, which is the correct way for this to degrade. (3) THE MOBILE MENU HAD NO CSS AT ALL. "The menu doesnt work properly on mobile when scrolling." .mock-mobile-secondary-nav had zero rules - an unstyled block rendered inside a sticky topbar, so it inherited the header stacking, travelled with it, and a long list had nowhere to go. Now a fixed panel anchored to the VIEWPORT (not the header, which can leave the screen), z-index 300, scrolling inside itself with overscroll containment, full-width rows at 2.9rem tap height. (4) FOUR PAGES RENDERED THE MASTHEAD TWICE. SiteBottom draws it, and today/library/series-slug/devotional-slug each drew their own immediately after - introduced when SiteFooter was swapped for SiteBottom in F-103. De-duplicated. (5) THE MASTHEAD INTRO. "Show euangelion first white on blue, then animate to system setting background." Reference: telhaclarke.com.au. A cobalt curtain with the wordmark reversed out, lifting to reveal the page already sitting underneath in whatever theme the reader is in. Home only, once per session, pointer-events none and aria-hidden from the first frame so it can never block a reader, skipped entirely under reduced motion. The page is NEVER hidden behind it - the overlay is painted on top of a fully rendered document. The wordmark also shrinks on scroll, driven by the nav is-docked state that already existed rather than a second listener. (6) /today TAKES THE PAPER FURNITURE TOO, per the founder scoping Sea Harvest structure to "Today and Daily Bread pages" only. (7) HOW WE WRITE was untruthful BY OMISSION - it documented none of what had shipped since. Added the red-letter method (KJV OSIS cross-referenced onto BSB wording, never inferred from quotation marks) and the Audio Edition (synthetic voice, said plainly, full text not an abridgement).'

  - id: SA-064
    title: the-press-impression-and-a-button-that-is-actually-centred
    note: 'Founder-directed 2026-08-16 (F-108). (1) THE OPEN ANIMATION IS THE PRESS IMPRESSION. Founder on the first attempt: "The open animation is needing much more attention. It was half assed." It was - a solid panel that faded a word in and slid away, which any site could wear. Rebuilt as the sequence only THIS masthead can make: INK (solid cobalt with the wordmark KNOCKED OUT, so the letters are paper showing through rather than white type laid on top - which is how the real thing prints), SET (the word arrives over-tracked and tightens, the way type is set into a stick), REGISTER (a crimson ghost offset a few pixels slides into alignment - misregistration is this brand actual signature, on every plate on the site, so the intro is made OUT OF the identity rather than decorated with it), and HAND OFF (the ink lifts on a hard edge and the wordmark flies to the MEASURED position and size of the real masthead, so the intro BECOMES the site instead of getting out of its way). TWO CALIBRATIONS, both found by slowing it 6x and photographing it: the WIDEST frame is the one that must fit the viewport (at 10.5vw with 0.34em tracking the word ran off both edges), and the slip own opacity keyframes OVERRIDE the shared fade-in, so starting it at full strength made the crimson arrive before the cream and the whole thing read as a red word. It fades in from zero and trails now. Safety unchanged: paints on top of a fully rendered page, pointer-events none and aria-hidden from frame one, home only, once per session, skipped under reduced motion, hard-stopped at 3.2s. (2) THE RESUME BUTTON IS CENTRED, THIRD TIME OF ASKING. "the homepage continue devotion button hasnt been centered." The banner had justify-items: center and I twice reported it done on that basis. It was not: the COPY only looked centred because text-align was doing that job inside full-width grid items, which masked the fact that item alignment never reached the link at all. Diagnosed by forcing the resume state locally and photographing it - the button sat hard left against the padding edge. It now carries justify-self, align-self AND margin-inline: auto so it holds whether that container is ever grid, flex or block. THE LESSON: a rule being present in the stylesheet is not evidence the element obeys it; render the state and look.'

  - id: SA-065
    title: flow-scrolls-natively-and-the-mobile-audit-passes
    note: 'Founder-directed 2026-08-16 (F-109). (1) FLOW SCROLLS NATIVELY. Founder: "the Flow doesnt work atall." Measured, and it did not: one wheel notch threw the board 835px because the hand-written momentum loop stacked its own inertia on top of the operating system, and drag moved it ZERO. The transform + momentum machinery was the wrong foundation. The frame is now an ordinary scroll container and drag simply moves scrollTop; the platform already has momentum, rubber-banding, scrollbars, keyboard paging and accessibility, so there is far less to break. Verified: native scroll exact (300 -> 300, no lurch), drag 1:1 (100px gesture -> 100px travel), 37 tiles, 37/37 plates loaded. The smear is now driven off REAL scroll travel rather than a velocity we were guessing at, and settles 90ms after motion stops. (2) SPINES ARE RESPONSIVE. The first genuine mobile measurement (Playwright at 390px, after the Chrome resize tool was found to silently not resize) showed spine tap targets at 31px wide - under the 44px minimum and far too narrow to read a title on. Seven to a shelf is a DESKTOP number: three on a phone, four on a small tablet, seven above 900px. Now 71px. (3) THE MOBILE AUDIT IS DONE AND PASSING. All seven toggles at 390px: zero horizontal overflow in every view, all 37 links present in every view, every tap target above minimum. THE REASON THIS TOOK FOUR ATTEMPTS: the Chrome resize tool reports success and does not resize, and the in-page JS tool can attach to a stale document (it reported a 1313px viewport against a 414px window, and clientWidth 0 for a visibly-sized element). Playwright sets a real viewport and is the tool for this. (4) A STRAY BRACE FROM A CSS SPLICE broke the build. Verify brace balance after any programmatic CSS edit - a one-line node check counts depth and reports the first negative.'

  - id: SA-066
    title: flow-is-an-artboard-not-a-card-wall
    note: 'Founder-directed 2026-08-16 (F-110). "Flow is designed nothing like the example fyi." Correct - it was a bordered gallery widget with a caption scrim on every tile; the reference (nicolaromei.com) is a full-bleed ARTBOARD of pure imagery. Rebuilt to match on four points: (a) FULL BLEED - the frame breaks the page measure with width:100vw and margin-inline: calc(50% - 50vw), so the tiles ARE the surface rather than sitting inside a box; (b) TILES BUTT ON A HAIRLINE - 3px gutter, not 14px, which is the difference between cards on a page and one printed sheet cut into plates; (c) NO PERMANENT CAPTIONS - the plates are pure image and the name arrives only on hover or focus (kept in the DOM, never injected, so assistive tech always has it; always-on under 900px where there is no hover); (d) FOUR TILE SHAPES rather than two, because a grid of two sizes reads as a card wall. AND THE HOLES. Measured 13 empty cells in the middle of the board - the exact "awkward spaces" the founder objects to. Three causes fixed in order: shape choice is now ADAPTIVE (a 2-wide tile that would skip over a single-column trough goes narrow instead), a RELOCATION pass moves single-cell tiles up into whatever gaps survive, and any gap that still remains is closed by growing the tile directly above it down by one. Proven by a harness across every column count: ZERO holes and ZERO overlaps at 2, 4, 6 and 8 columns, which are the only counts FlowView ships. __tests__/flow-packing.test.ts pins it. ALSO: the plates are EAGER again. They sit inside a scroll container and Chrome leaves them unloaded there - the board renders as a flat dark field with no tiles visible at all. That cost two debugging rounds; do not make them lazy.'

  - id: SA-067
    title: flow-is-a-uniform-repeating-grid-inside-the-border
    note: 'Founder-directed 2026-08-16 (F-111), correcting F-110. (1) FLOW IS A UNIFORM REPEATING GRID, NOT A MOSAIC. "the image crop/size needs to mirror the example i provided, sasme sixe and aspect ration (croping no skewing or stretching or nything). needs to overflow and repeat, and titles need to show. also needs to be contained within the newspaper boardeer." Four corrections to my own over-correction: every plate is the SAME SIZE at a fixed 4:3, cropped with object-fit cover and never stretched (measured: one unique tile size, ratio 1.333); the catalog REPEATS four times so the board overflows and can be travelled rather than running out after two screens - every tile is still a real series, it simply comes round again the way a pattern does, and nothing is invented; TITLES ARE ALWAYS ON, because a hover-only name is invisible on a phone and to anyone scanning; and the frame is CONTAINED WITHIN THE PAGE MEASURE again (1308px inside a 1389px page on a 1440 viewport) - full bleed was my invention and the newspaper border is the point of this site. The whole packing algorithm is deleted with the mosaic: a uniform grid cannot have holes, so the three-stage hole-filling machinery and its test are gone rather than left as dead weight. (2) THE HOMEPAGE FEATURE. "homepage feature image should fill container. the text on the right should not have soo much - 10-14 words max. container height can be slightly shorter." The art had a FIXED height, so whenever the copy column was taller the plate stopped short and left the gap being described; it now stretches to the row with a floor, and the row height is set by the copy. The teaser went from 69 words to 12 - a featured slot is a headline and a line, not a paragraph, and the full introduction is one tap away. Row height 530px -> 291px.'

  - id: SA-068
    title: flow-rebuilt-against-the-founders-own-gallery
    note: 'Founder-directed 2026-08-16 (F-112). FLOW IS REBUILT AGAINST THE FOUNDER OWN GALLERY, not nicolaromei. "im honestly not a fan of this now that I see it close to implimented. i think the one I made for my personal website is a little better… I want the same card size, boarder and the columns also have a scroll movement." Reference: creativcreature.wokegod.world/gallery, MEASURED rather than guessed at - 80x80 cards on an 88px pitch, object-fit cover, 4px radius, dense uniform grid, no captions over the image. WHAT FLOW TAKES FROM IT: uniform SQUARE cards, cover-cropped and never stretched, a soft 4px radius with a hairline border, dealt into columns. WHAT IT CHANGES ON INSTRUCTION: "I only need the two largest size levels… not the small sizwe… but larger than the reference" - so exactly TWO steps, 340px and 250px, both far above the reference 80px, switchable from a control above the board. And "the type should uppear bellow image, not on top" - the caption sits under the plate now, never over it, which also means it never covers artwork. THE COLUMNS MOVE. "the columns also have a scroll movement." The board is a row of columns four cards deep running sideways, and each column is nudged vertically as the board travels - alternating direction at rates that do not divide evenly, so no two neighbours move together. Capped at 26px: this is life, not parallax for its own sake, and a column must never drift far enough to put a card out of reach. THE WHEEL IS ATTACHED NATIVELY WITH passive:false. React registers wheel listeners as PASSIVE, so calling preventDefault inside a React onWheel handler fails and logs an error on EVERY notch - 199 of them in one session before it was caught. FOUR REBUILDS OF THIS VIEW IN ONE DAY, and the lesson is the same each time: I designed from a description instead of measuring the reference. The founder had to say "Please look at the dang site. ACTUALLY LOOK AT IT" before I screenshotted it. Measure the reference first.'

  - id: SA-069
    title: preview-replaces-flow-and-covers-leads-again
    note: 'Founder-directed 2026-08-16 (F-113). PREVIEW REPLACES FLOW, AND COVERS IS THE DEFAULT AGAIN. "not a fan at all. Change it to a two column version with the left column th image and the right column a small 2-3 sentence summary of the devotional. Instead of cflow this is Preview. Cover is now the default then preview is the next toggle etc." Flow is DELETED - component, styles, drag/wheel/drift machinery and its tests. It went through FOUR rebuilds in one day and never landed, and the reason is worth keeping: every one of those rebuilds was designed from a description of a reference rather than from measuring the reference, and the founder finally had to say "Please look at the dang site. ACTUALLY LOOK AT IT". The brief that replaced it is plainer and better - a reader wants to see the art and find out what the reading is about, and everything the artboard was doing (panning, drifting columns, size levels, blur) stood between them and both of those. PREVIEW IS RULED ROWS: plate on the left in a FIXED column, copy on the right. Fixed, not fractional - at a fractional share the plate grew with the page and every row ran ~390px tall, which is a lot of scrolling across 37 series; fixed holds every row to ~210px at any viewport. Stacks to one column under 700px, where two would leave the summary in a gutter too narrow to read. THE SUMMARY IS REAL COPY. Every series already carries a hand-written `introduction`. Most are already two or three sentences; three run to six, so the summary prints the FIRST THREE - the author own words in the author own order, simply stopped early. Nothing is paraphrased, nothing generated, and there is no CSS clamp, so nothing is ever cut off mid-word. Preview is SERVER-RENDERED: it holds no state, so it has no business being a client island.'

  - id: SA-070
    title: preview-centred-and-every-entry-carries-its-plate
    note: 'Founder-directed 2026-08-16 (F-114). PREVIEW IS CENTRED AND EVERY ENTRY CARRIES ITS PLATE. "the two columns should be centered on page. There are missing images in Rack and Feature toggles." Two separate faults reported together. CENTRING: Preview stretched the full page width, and because the plate column is deliberately FIXED (F-113, which is what holds a row near 210px instead of 390px), all the slack landed in the copy column - the summary sat against the left edge with a long empty gutter beside it. Fixed with a measure rather than a stretch: width min(100%, 74rem) with margin-inline auto. Row height is unchanged. FEATURE WAS GENUINELY MISSING FIVE IMAGES - a markup fault, not a loading one. The brief rail rendered headline and byline only, with no plate at all; measured live it was 37 series links against 32 img elements, so five series appeared in that view with no artwork whatsoever. Each brief now carries a small square plate, 72px, 56px under 640px. RACK WAS A LOADING FAULT: its markup was complete but its plates were loading=lazy in a rail, and a plate that has not been scrolled into view has no pixels, which is indistinguishable from a missing image to anyone looking at the page. They load eager now. This is the FOURTH time lazy loading inside a rail or a transformed container has been read as missing artwork - the rose window, Flow twice, now Rack. In a dense rail of small plates, eager is the correct default.'

  - id: SA-071
    title: feature-and-rack-artwork-was-collapsed-to-zero-height
    note: 'Founder-directed 2026-08-16 (F-115). THE FEATURE AND RACK ARTWORK WAS COLLAPSED TO ZERO HEIGHT. "There are missing images in Rack and Feature toggles." then "Rack images still not showing" and "same with Feature on series". THE IMAGES WERE NEVER MISSING. Every file was on disk, every img tag was in the DOM, every one of them loaded, nothing 404d. They rendered at zero height: fp-story-plate 619x0, fp-desk-lede-plate 529x0, fp-desk-item-plate 0, rack-plate 363x10. 31 collapsed images in Feature, 37 in Rack. CAUSE: Plate renders Image fill, which is ABSOLUTELY POSITIONED, and an absolutely positioned child contributes nothing to its parent height. A plate container with no aspect-ratio and no explicit height therefore has no height at all, and overflow hidden clips the artwork to a sliver. Four of the seven plate containers were written without one - cover-plate, issue-plate, fp-lead-plate and fp-brief-plate had ratios; fp-story-plate, fp-desk-lede-plate, fp-desk-item-plate and rack-plate did not. All four now declare 3/2, which is the series artwork own shape so nothing is cropped to achieve it. NOT A REGRESSION - checked at HEAD~1, HEAD~5 and HEAD~15, zero aspect-ratio lines in fp-story-plate at every one. These rules never carried a height. WHY THE FIRST FIX MISSED IT: the earlier pass counted ELEMENTS, not pixels - 37 links against 37 img tags read as healthy, and I reported it as verified. An image can be present, loaded and decoded and still be invisible. MEASURE RENDERED HEIGHT, NOT ELEMENT COUNT. Any plate wider than 60px rendering under 40px tall is a bug regardless of what the DOM says.'

  - id: SA-072
    title: soul-audit-input-sat-34px-off-centre
    note: 'Founder-directed 2026-08-16 (F-116). THE SOUL AUDIT INPUT SAT 34PX OFF CENTRE. "soul audit input box needs to be centered." Measured live at 1680px: the textarea sat 483px from the left and 517px from the right. EVERY ANCESTOR WAS ALREADY CENTRED. Walking the chain, section.shell-content-pad at 1629px, div.w-full.max-w-2xl at 714px and div.fade-in-section at 714px all reported identical left and right gaps. Only the textarea itself was off. CAUSE: the field carries vw-body-lg, a reading-measure utility that sets max-width 680px. Inside a 714px column that leaves 34px of slack, and because a textarea is display inline-block and the column aligns to start, all of that slack collected on the right - the box was narrower than its container and pinned to the left edge of it. FIX: block plus mx-auto on the textarea. That centres the field WITHOUT touching the measure - 680px is a good line length for a text field and is left exactly as it was. The same 680px cap also left two vw-body prose blocks flush left, so their centred text sat 17px left of the field; both take mx-auto now. vw-small is NOT capped, so those blocks were already correct and are untouched. THE LESSON: when something looks off centre, MEASURE THE ELEMENT ITSELF, NOT ITS CONTAINER. A perfectly centred parent tells you nothing about a child that is narrower than it, and this page had a centred container, a centred section and no overflow anywhere.'

  - id: SA-073
    title: get-matched-is-a-button-and-the-homepage-pills-are-gone
    note: 'Founder-directed 2026-08-16 (F-117). GET MATCHED IS A BUTTON, AND THE HOMEPAGE PILLS ARE GONE. "get matched should be a smaller cta. remove the pills on the homeopage version as well." THE CTA WAS A BANNER, NOT A BUTTON. On /soul-audit it ran w-full px-10 py-5 - the full width of the 680px column with 20px of vertical padding - and at that size it stopped reading as something you press and started reading as a section divider. It is w-fit px-8 py-3.5 now, sized to its own label, padding brought down but still comfortably above the 44px touch minimum. The homepage CTA was already inline (mock-btn-inline) and is untouched. THE CENTRING DETAIL WORTH KEEPING: cta-major is display inline-flex, and margin-inline auto does NOTHING to an inline-level box - so dropping w-full alone would have left the button hanging at the left edge of the column, the same class of bug as F-116 one element away. The first attempt - mx-auto flex w-fit ON THE BUTTON - did NOT work, measured live at 483px left against a 984px right gap, because cta-major inline-flex comes from a LAYERED rule that beats Tailwind flex utility. It is centred FROM ITS PARENT now (a div with flex justify-center), which holds whatever the button own display resolves to. THE HOMEPAGE PROMPT PILLS ARE REMOVED. Four sample-prompt buttons sat under the homepage field, shown only while it was empty. The placeholder already models what to write, and a Soul Audit works on what the reader actually names - offering four pre-written answers puts words in their mouth before they have found their own. The pill CSS is LEFT IN PLACE, unused: removing it would touch shared stylesheet regions while other sessions are working in the same file, and dead rules cost nothing. Worth deleting in a quiet pass. No test asserted the pills - the three test files containing those phrases use them as retrieval fixtures, not UI assertions.'

  - id: SA-074
    title: overnight-polish-sweep-collapse-menu-touch-targets-escape
    note: 'Founder-directed 2026-08-16 (F-118). OVERNIGHT POLISH SWEEP - collapsed plate, mobile menu, touch targets, Escape. "look through out the site and use /code-review as well as deep research to audit and find opportunities for polish throughout the site. Look for awkward spacing, visual issues, mobile site specific issues (the menu for instance) and any other thing to polish the site that you can find tonight and then polish it". Audited live at 390px and 1680px across /, /series, /series/[slug], /soul-audit, /daily-bread, /sunday, /pricing and /how-we-write, plus a dark-mode contrast pass. 1. A FOURTH COLLAPSED PLATE. edition-guide-plate had no aspect-ratio and no height while wrapping an Image fill, so all three How-to-read Bible-reading guides on /daily-bread rendered 335x0 - loaded and decoded, and invisible. Same fault as F-115. Found by sweeping EVERY *-plate/*-thumb/*-art rule in globals.css for a declared height rather than checking pages one at a time; every remaining container class passes. Now aspect-ratio 3/2, matching its sibling edition-panel-plate. 2. THE MOBILE MENU - the founder repeated complaint. Measured at 390px scrolled to y=1500, the PANEL ITSELF WAS FINE (fixed, z-index 300, correct offset, visible). Two faults sat around it: the PAGE KEPT SCROLLING behind the open panel, and TAPPING OUTSIDE DID NOTHING so the only way out was to find the toggle again. NO SCROLL LOCK SHIPPED, after measuring three variants: body overflow hidden does NOTHING (the scroller is html; measured y=1400 to y=1900 while locked); adding touch-action none intersects down onto the panel and makes the panel itself un-scrollable; html overflow hidden DOES lock and BREAKS position sticky on the topbar - measured topbar bottom 53px closed, MINUS 1346px the instant the lock applied, 53px again on close, i.e. the very bar the panel hangs from flew off screen. Background scroll behind a 216px dropdown is smaller than any of those regressions. THE ACTUAL ROOT CAUSE, found second: mock-mobile-menu-toggle carried a real min-height 44px, making it the tallest child of the topbar row and pushing the bar to 56px, while ~10 rules including the panel top are written against var(--mock-h-topbar, 42px). The open panel therefore overlapped the bar by 14px and PAINTED OVER THE BOTTOM THIRD OF ITS OWN CLOSE BUTTON - elementFromPoint at the X lower edge returned the panel, not the button. The toggle is now a 2rem box with a transparent 44px ::after, the same strategy its sibling icon controls already use. Verified: close button fully reachable, topbar still sticky. Also closes on outside tap, on nav-link tap (the route-change effect no-ops when the destination equals the current route, so tapping HOME while on / left it open) and when the viewport grows past 900px (previously the X vanished on rotate, stranding the panel). The outside-tap handler ignores the toggle itself, otherwise the toggle own close would be immediately followed by a reopen. Escape already worked. 3. TOUCH TARGETS UNDER 44PX: mock-icon-control 37x34, rr-view 40x35, rr-sort 39x25. These are dense, closely art-directed toolbars, so this does NOT resize them - a transparent ::after extends the HIT AREA to a 44px minimum and leaves every visible pixel where it is, scoped to pointer:coarse so mouse hover regions are unchanged. Verified none sits inside an overflow hidden container, which would clip the expanded area and make the fix a no-op. 4. ESCAPE NOW CLOSES SEARCH FROM ANYWHERE. GlobalSearchOverlay closed on Escape via a React onKeyDown bound to the PANEL, so it only fired while focus was inside; focus is moved to the input on open but inside a requestAnimationFrame that can lose the race. Caught live with activeElement on BODY and Escape doing nothing. A second run showed focus landing correctly, so it is INTERMITTENT rather than always broken - and rather than rewrite working focus logic on an unreliable signal, a document-level Escape listener was added while open. Purely additive. AUDITED AND DELIBERATELY NOT CHANGED: three 401s per page load (/api/devotionals/active,saved,archive) for signed-out readers - the 401 path is deliberate and documented in devotionalLibraryStore.refresh, and gating on authStore.userId would suppress real fetches for signed-in readers whenever the store had not initialised first, a far worse failure than console noise. Homepage GET MATCHED at 141x38 is under 44px but pre-existing, and the founder had just asked for CTAs to get smaller - flagged for a ruling. Dark mode passed (40 pairs, none below 4.5:1). Homepage and /daily-bread spacing checked: no empty boxes; the apparent 384px gap on /daily-bread is filled by the edition-rail briefs, not empty.'

  - id: SA-076
    title: toggle-icons-flashed-blue-on-touch-and-stayed-lit
    note: 'Founder-directed 2026-08-17 (F-120). TOGGLE ICONS FLASHED BLUE ON TOUCH AND STAYED LIT AFTER THE TAP. "why does the toggle icons on mobile highlight blue on page load? fix it" Two independent causes, both verified live. 1. THE BROWSER OWN TAP HIGHLIGHT. -webkit-tap-highlight-color was NEVER SET ANYWHERE in 14,000+ lines of globals.css, so mobile WebKit and Chrome paint their default translucent BLUE rectangle over any tapped button or link. On a design whose whole palette is cobalt that reads as the control lighting up blue. Set to transparent on html. Safe rather than an a11y regression: every one of these controls carries a real focus-visible style, which is what keyboard users rely on; the tap highlight only ever appears for touch, where it duplicates the control own pressed state. 2. HOVER FIRES ON TOUCH AND STICKS. @media (hover: hover) appears ZERO times in the stylesheet, so every :hover rule also matches on touch - and on touch there is no pointer to move away, so the state PERSISTS after the tap until the reader taps elsewhere. The hover state for these controls is a solid cobalt fill (mock-btn, mock-icon-control, mock-account-trigger, mock-mobile-menu-toggle all share one rule painting --mock-blue), so a tapped toggle stayed filled indefinitely. Combined with cause 1, one tap gave a blue flash followed by a blue box that never left. THE FIX SHAPE MATTERS: a @media (hover: none) block restores the resting appearance, using :not(:focus-visible) so the fill is PRESERVED for anyone who genuinely focuses with a keyboard - only the phantom hover is neutralised; scoped under .mock-home so it outweighs the .dark .mock-home dark-mode rescues at 0,4,0; and appended at the END of the file so it wins ties on source order, which is the standing constraint in this stylesheet where ~10,000 lines sit outside any @layer. rr-view and rr-sort keep their is-active fill; only the non-active hover is reset. VERIFIED: webkitTapHighlightColor rgba(0,0,0,0); three hover:none rules present with the intended selectors; desktop hover fill still resolves on a hover-capable pointer (--mock-blue light, --color-gold dark); resting background transparent with no interaction.'
  - id: SA-077
    title: touch-hit-pads-painted-blue-slabs-over-the-series-switcher
    note: 'Founder-directed 2026-08-17 (F-121). THE /series SWITCHER WAS COVERED IN TRANSLUCENT COBALT SLABS, larger than the controls, staggered, overlapping the SORT row and the wrapped LONGEST button. "I need this fixed" with a screenshot. NOT a recurrence of SA-076 - that was the browser tap highlight plus a sticky :hover, both fixed and both still fixed. This is a third independent cause wearing the same colour, which is why it survived. ROOT CAUSE: two systems writing to one ::after. EditorialMotionSystem scans the DOM after hydration and adds ink-line-interactive to every .mock-paper button, which the /series toggles are; those classes appear nowhere in SeriesBrowser.tsx, so the collision is invisible in the source. .ink-line-interactive::after is a gold hover underline kept invisible by height: 1px plus transform: scaleX(0). The 2026-08-16 touch-target sweep then minted its 44px hit pad on THAT SAME ::after, overriding both guards at once: height 1px became 44px so the hairline became a slab, and scaleX(0) became translate(-50%,-50%) so the thing keeping it invisible was replaced by the thing centring it - the slab un-collapsed and painted. The background survived untouched and currentColor on these controls is cobalt, so the slab was blue. A 44px pad on controls rendering 35px (views) and 25px (sorts) overhangs 4.4px and 9.6px per side; the sort overhang exceeds the 0.55rem row gap, so slabs reached into the rows above and below. Measured background color(srgb 0.106 0.145 0.445 / 0.942) confirmed the mechanism before any edit - the color(srgb) form is what WebKit computes color-mix() down to, which nothing else in the block could produce. THE FIX: move the hit pad to ::before, unclaimed on all three selectors, and let ::after go back to being the underline. One pseudo-element per owner. REJECTED: painting the pad transparent (background: none) would hide the slab while leaving two systems on one box - the same landmine, disguised, for whoever next adds an ::after rule here; and opting the controls out via data-no-ink-line would fix touch by deleting the gold hover underline on desktop, which was never asked for. .mock-icon-control moved too, though currently safe - it escapes decoration only because shouldSkipInteractive excludes .mock-topbar, and that exclusion should not be load-bearing. VERIFIED in WebKit/iPhone against production (cause) then the local build (fix): ::after back to 1px/scaleX(0); ::before >=44x44 and transparent; all 7 view and 5 sort taps activate the right control; a tap 3px ABOVE a 35px icon still activates it, so the pad is real and not merely declared. Site-wide sweep of 8 routes for the same collision found no other instance (.link-highlight::before registers on the detector but is a designed highlighter swash, scaleX(0) at rest). Desktop untouched - the block is pointer: coarse only. Locked by __tests__/touch-target-pseudo-element-contract.test.ts. NOTE FOR LATER, NOT FIXED HERE: the app sends Strict-Transport-Security on localhost too, and WebKit honours HSTS for localhost - it upgrades every http://localhost subresource to https, which fails TLS and leaves local pages unstyled and unhydrated in Safari-engine testing.'
  - id: SA-078
    title: green-build-stale-test-dead-imports-and-generated-artifact-drift
    note: 'Founder-directed 2026-08-17 (F-122). "Fix all outstanding issues, clear all backlogs... bring the entire site up to date with no outstanding items." FOUR CLASSES OF OUTSTANDING ITEM, all cleared. 1. THE FAILING TEST WAS STALE, NOT A REGRESSION. daily-bread-why-this.test.tsx asserted on the day title The Name You Answer To while the same file mocks DevotionalHeadline to null. That mock was harmless when it landed (45ad0ecd) because DailyBreadView rendered the title in its own h1; SA-045 (F-091, 6bd9d419) then moved the title INTO DevotionalHeadline so a plan day would read like a devotional, and the assertion started reaching for text the mock had removed. Red since 2026-08-15. The product is fine - the h1 still renders on /daily-bread. Re-anchored on scriptureText from the same fixture, which the reader does render and which proves the same thing; the why-row assertion, the actual subject of the test, is untouched. 2. EIGHT LINT WARNINGS, EACH CHECKED FOR A DROPPED CALL BEFORE DELETION - an unused import can mean dead code or a removed call site. withRedLetter/resolveRedLetter: all three Soul Audit files import both and use exactly one; RED LETTER IS APPLIED IN EACH, no silent degradation; trimmed the unused half. getSelectionWithFallback: the select route only ever calls saveSelection, it writes and never reads; removed. editionSlug: computed and never rendered (volume/dayOfYear do render as Vol N No N); removed with its import. PlanRecord: type imported, never referenced. Bible-365 useMemo missing-dep: FALSE POSITIVE - Array<typeof series.days> reads as a use of series when series.days is the precise dep; retyped as Array<SeriesInfo[days]> rather than widening the dependency. _isDayUnlockedOriginal: DELIBERATELY KEPT - the file comment says "Reference implementation kept for restoration. To re-enable day pacing, rename this back". Deleting it to satisfy the linter would have thrown away the documented path back to day pacing, so varsIgnorePattern ^_ was added to eslint config, following the argsIgnorePattern ^_ convention the codebase had already chosen. 3. GENERATED ARTIFACT DRIFT. devotional-teasers.ts showed a 1,682-line diff that was almost entirely quote style - the generator emits escaped single quotes, prettier rewrites to double - over an IDENTICAL 1,144 entries; prettier collapsed it to one real change, the rekindled-day-1 teaser regenerated from the day-1 text corrected in SA-075, and the live devotional JSON was confirmed to already carry that wording. red-letter/coverage.txt moved 153->157 modules and 93->96 tagged, which is Rekindled entering the corpus. 4. THE FOUR UNPUSHED COMMITS WERE NEEDED, VERIFIED NOT ASSUMED. All 20 Rekindled content assets in them - 7 devotional JSONs, 7 audio, 4 video, 2 images - are BYTE-IDENTICAL to production by sha256 fetched live. Production had been deployed from a local tree and never pushed: the work is live but unrecorded in origin/main, so discarding the commits would have deleted the only source record of content the site already serves. public/sw.js first appeared to differ; a byte diff against the live file showed it identical (transfer-encoding artefact in the first hash). RESULT: suite 0 failed / 2097 passed, lint 0 problems, type-check clean, no uncommitted tracked files, origin/main in sync. The ~180MB of untracked euangelion-voice-prototype audio and logs is another session working material - it sits outside public/ so it cannot reach the Workers deploy, and was deliberately left untouched rather than deleted.'

  - id: SA-079
    title: chat-billed-at-openai-rates-while-claude-served-the-request
    note: 'Founder-directed 2026-08-17 (F-123). Surfaced while answering "what is the site costing me". THE CHAT PATH BILLED CLAUDE TRAFFIC AT OPENAI PRICES. estimateCostUsd priced a call from the ROUTING SLOT rather than the engine that served it. The openai slot dispatches on key shape in executeProvider: an sk-ant- key runs callAnthropic (Claude Sonnet 4.6 against api.anthropic.com), anything else runs callOpenAI - and sortClaudeFirstThenCheapest confirms the slot identity in code by testing unique.includes(openai) to decide whether Claude is available. Both branches were then priced from the same openai profile, $0.05/$0.40 per MTok, against Sonnet 4.6 real $3/$15. Token counts were never wrong - executeProvider already prefers real usage from the provider response - only the RATE. For a typical message (~3000 in / ~700 out) recorded cost was $0.00043 against a real $0.0195, a ~45x understatement, so the platformBudget limitUsd 100 guard would not have tripped until roughly $4,500 of real spend. SCOPE IS CHAT ONLY, and the codebase had already diagnosed it: soul-audit/cost-ledger.ts computes USD from real tokens at Anthropic rates, writes to Supabase, backs a real budget cap, and its header names the router as the outstanding bug ("the brain router generic estimateCostUsd uses a cheap-provider profile that UNDER-bills Anthropic by ~60x"). So the EXPENSIVE path (devotional generation, ~$0.07/day, ~$0.48 per 7-day plan) was always priced honestly and gated; only chat under-billed. THE FIX: bill by ENGINE not slot. cost.ts gains a BillingEngine type and engineProfile() returning Anthropic real rates, read from the SAME env overrides as the Soul Audit ledger (SOUL_AUDIT_INPUT_USD_PER_MTOK / _OUTPUT_, defaults 3/15) so repointing the model moves both ledgers together and they cannot drift; executeProvider resolves billedAs where it already branches on key shape. providerBaseCostRank is DELIBERATELY UNCHANGED - it ranks routing slots for sortByCheapest and re-ranking Claude at its true cost would reorder the fallback chain, a behavioural change nobody asked for. Ranking is not billing. REJECTED renaming the openai slot to anthropic: it touches 9 files, changes the public shape of /api/brain/providers plus the settings UI and stored user preferences, and is the wrong primitive - the slot is genuinely polymorphic and under BYOK will serve a user sk-ant- key OR their OpenAI key and must price each correctly. Billing by engine is correct today and after BYOK; renaming is cosmetic and would still need this fix underneath. VERIFIED: recorded cost for a Claude chat message $0.00043 -> $0.0195; effective spend behind the $100 guard ~$4,500 -> $100; fallback ordering unchanged; 2097 tests, type-check and lint clean.'

  - id: SA-080
    title: narration-library-was-mastered-to-peak-not-loudness
    note: 'Founder-reported 2026-08-17 (F-124): narration plays quiet with the volume maxed. THE PLAYER WAS NOT AT FAULT. Every track was levelled to PEAK instead of LOUDNESS - true peak pinned at 0 dBTP while integrated loudness sat at -19.7 to -22.7 LUFS, well under the -16/-17 podcast range, which is exactly the waveform-looks-full-and-plays-quiet symptom. 73 of 535 files were not merely maxed but genuinely CLIPPING (>0 dBTP; bible-365-day-1 at +0.55). TARGET IS -17 LUFS BY FOUNDER EAR, not by spec default: three A/B renders were cut (-22.6 current / -17.0 / -16.3) and -17.0 was the approved one. THE FOUNDER CHOSE "OPTION B" AND OPTION B WAS UNSAFE. B was single-pass loudnorm, described to the founder as stable. It is not: it reports normalization_type dynamic (it RIDES the level, compressing LRA 4.6->3.4 on the A/B source - the pumping the founder was told two-pass avoids), and its true-peak control does not hold - on he-cannot-deny-himself-day-1 it produced +1.54 dBTP, WORSE than untreated, confirmed by both loudnorm and ebur128. The approved LOUDNESS was kept; the MECHANISM was replaced. THE REAL OBSTACLE, WHICH DEFEATED BOTH PROPOSED OPTIONS: AAC adds true-peak overshoot above the limiter ceiling and it is NOT a stable per-file constant that can be probed once (Option A proposed probing it at final gain). It swung 3.2 -> 7.9 dB on ONE file as gain moved. Rendering the identical filter chain to float WAV and to AAC isolated the cause: the limiter held -1.6 dBFS in PCM and the ENCODER still emitted +1.5 dBFS. A 5 ms limiter attack rides gain sharply enough that 80 kbps AAC cannot reconstruct it without ringing past the ceiling; at attack=20 the same file encodes to -2.3 dBFS. So the ceiling is not predicted, it is SOLVED FOR - every iteration re-encodes and re-measures the real file and re-aims the ceiling from that render own measured overshoot. FOUR TRAPS, ALL SILENT. (1) A RATCHETING CEILING MAKES FILES QUIETER THAN DOING NOTHING: an earlier revision only ever lowered it, over-limiting destroys loudness, gain then chases a target the limiter is holding down, and 10 files spiralled - bible-365-day-227 walked to a -9.1 dB ceiling and -18.6 LUFS, quieter than untreated. (2) GAIN AND CEILING ARE COUPLED AND ORBIT: 5 files were still out after 10 full-size corrections; halving the step after iteration 4 collapses the orbit. (3) NOT EVERY TRACK IS 24 kHz MONO - 528 are, the 7 he-cannot-deny-himself tracks are 44.1 kHz STEREO music-scored productions, and a hardcoded -ar 24000 -ac 1 downmixes them with nothing in the loudness numbers revealing it. (4) A FLAT STEREO BITRATE BREAKS THE DEPLOY, NOT THE SOUND: those 7 are already 20-23 MB and Workers rejects any asset over 25 MiB; at 160k they came out 27-31 MB. Bitrate is now derived per file from its duration against a 20 MiB budget with a hard 25 MiB guard that DELETES rather than ships, the budget deliberately well under the limit because the encoder delivers ~8% more than nominal -b:a plus container overhead. THE CACHE-BUST IS LOAD-BEARING: /audio/* is served max-age=31536000 immutable and getNarrationTrack() versions the URL SOLELY from track.bytes, so swapping files without re-stamping the manifest leaves every already-cached listener on the quiet masters for a year - the re-master would be invisible to precisely the heaviest users. Manifest re-stamped (535 entries, bytes lines only, prettier-clean); sw.js CACHE_NAME and SW_VERSION bumped v107->v108 because the manifest is bundled at build time. VERIFICATION: a truncated file still measures a perfect -17 LUFS, so loudness/peak checks cannot detect content loss - all 535 were re-verified with ebur128 (a DIFFERENT filter from the loudnorm that targeted them) plus duration/rate/channel comparison against each original. 535/535 pass: loudness -16.50..-17.30 LUFS, true peak -1.00..-3.90 dBTP, lift +2.4..+6.1 dB, LRA delta -0.52 LU mean (vs -1.2 for single-pass), duration drift -0.09..-0.04 s, clipping 73 -> 0. STANDING RULE: AN UNVERIFIED RENDER IS NOT A RESULT - the script accepts a file only on that file own post-encode measurement and deletes anything it cannot verify, so every failure here surfaced as a missing file and a loud complaint, never as a bad master reaching the library. SAFETY: all 535 originals backed up OUTSIDE the repo to ~/euangelion-audio-originals-2026-08-17 and verified byte-for-byte by md5 BEFORE any processing - 365 of them are gitignored bible-365 narrations that exist in exactly one place. The first backup attempt SILENTLY FAILED (macOS rsync 2.6.9 rejects --info=progress2 and the chain still exited 0, leaving an empty directory); caught by checking, redone with ditto. OPEN, FOUNDER CALL: the 170 git-tracked tracks grow 678 -> 1111 MiB (+433 MiB, 1.64x) because mono goes 48k -> 80k to avoid generational loss on a lossy->lossy re-encode; 64k also sits above the 48k source at roughly half the growth. NOT DEPLOYED - local swap and verification only.'

  - id: SA-077
    title: blue-italic-line-under-lead-scripture-removed
    note: 'Founder-directed 2026-08-17 (F-121). THE BLUE ITALIC LINE UNDER THE LEAD SCRIPTURE IS GONE. "devotionals have a wierd blue text below the lead scrioture. appears to be a mistake... unnecessary pull quotes in an italic small font. I need it removed on all devotionals relevant." Then, on being told it was the transliteration line: "That isnt transliteration if the hebrew sentence doesnt appear." Both correct. WHAT IT WAS: ScriptureModule rendered module.transliteration in two places, once paired with greekOriginal and once with hebrewOriginal, as vw-small italic at color var(--color-gold) - and --color-gold RESOLVES TO COBALT IN LIGHT MODE, so a small blue italic line sat immediately under the passage, visually indistinguishable from a stray pull quote. It read as a mistake because of how it was STYLED, not what it said. THE FOUNDER SECOND POINT IS THE SUBSTANTIVE ONE. A transliteration is only a transliteration of what is actually shown. Measured across all 26 occurrences: 25 pair a SINGLE WORD OR SHORT PHRASE with a gloss (Hebrew bedarkekha rendered as one word, transliterated as vedarkekha - "in your way"), and only 1 is a genuine full-verse transliteration (bible-365-day-286, 11 Greek words to 11 matching words). So in 25 of 26 cases this was never a transliteration of the passage at all - it was a WORD STUDY, a lemma plus its meaning, which is exactly what the WordNote/vocab modules already do properly, in the right place, with lexicon grounding. Duplicated content wearing pull-quote styling. Zero of the 26 lacked an original-language line, so nothing was orphaned; the mismatch was one of SCOPE, not presence. WHAT CHANGED: both render blocks removed from ScriptureModule.tsx, nothing else. The transliteration FIELD STAYS IN THE JSON so restoring the block alone brings it back and no content was destroyed - this also keeps the change off content files another session is actively editing. Vocab/WordNote transliterations are untouched: the field name appears in 532 devotionals but only 26 instances sit on a scripture module; the other ~506 belong to word-study features. Greek and Hebrew original lines still render with their existing muted styling. A RULE THIS RETIRES: the comment above the block asserted a project rule that "Hebrew/Greek must never appear without transliteration alongside it." That rule no longer holds, and the code now says so rather than claiming a constraint it does not follow. If the intent was pronunciation support, the correct home is the WordNote module, which already supplies a transliteration AND a lexicon entry. One case worth a second look: bible-365-day-286 was the single genuine full-verse transliteration and is removed with the rest per "all devotionals relevant"; restoring only that one is a data-level change. THE LARGER HALF - THE EMPHASIS-TAG ROW. The transliteration was only 25 devotionals; the founder screenshot pointed at the real offender. module.emphasis rendered TWICE: once as the highlighted words INSIDE the passage (gold-shimmer, kept) and again as a wrap-row of the SAME phrases beneath the reference, styled vw-small italic at color var(--color-gold) - the same cobalt-in-light token trap - so every emphasised phrase appeared a second time in small blue italic, reading exactly like a pull quote nobody wrote. SCOPE: 529 of 575 devotionals, 1,785 chips - that is the "all devotionals relevant" the founder meant. Both render sites removed (the two variants differ in formatting and had to be matched separately). module.emphasis still drives the in-passage highlighting via renderPassage(), and the field is untouched in the JSON. Verified: 0 chip rows, 0 transliteration lines, 5 in-passage highlights intact. VERIFICATION NOTE WORTH KEEPING: the first check after the rebuild still showed 2 chip rows and nearly sent me hunting for a second component - the SERVED HTML had zero, and the browser was holding a SERVICE-WORKER CACHED PAGE. Curl the origin before believing the DOM.'

  - id: SA-080
    title: polish-backlog-batch-1-contrast-headings-credit-dead-code
    note: 'Founder-directed 2026-08-17 (F-125). POLISH BACKLOG BATCH 1. "archive the yeses from the document. code through the night. Be methodical, track it, and do not break the site. clean code, cleanup bugs. dont change the content. the audio must line up with the content as is" Decisions archived at docs/audits/POLISH-BACKLOG-DECISIONS-2026-08-17.md: 52 approved, 1 DECLINED (item 01, moving header/footer outside main - do not re-propose), 14 undecided and NOT to be built. SHIPPED: 07 contrast on the two highest-stakes controls - the 988 hotline CTA measured 3.60:1 because --color-crimson lightens to #e25868 in dark, and the delete-account confirm measured 2.83:1 because color var(--color-bg) resolves to #0b1420 in dark. Both are now PINNED literals (#c4192e, #fff) rather than tokens: a suicide hotline and an irreversible deletion do not get a theme-dependent contrast ratio. 64 the founding-member track was a cream at 8% assuming a dark ground, ~1.01:1 on the light page - tokenised. 65 .mock-btn takes min-height 44px; min-height only grows a control already under it, so the smaller CTA sizing the founder asked for is untouched. 02 the reader heading ladder: CuratedActiveView rendered its own h1 AND DevotionalHeadline h1 in the same path (the earlier return is an error branch, not an alternative) so the series title drops to h2; eight section labels on /today were styled p elements invisible to heading nav and are now h2/h1; module headings sat at h3 directly under the reading h1 skipping a level on 519 of 530 devotionals and are now h2; TeachingModule mapped markdown ## to h2 INSIDE that heading own section, shifted down to h3/h4. Tailwind v4 preflight zeroes heading margin/size/weight so every tag swap is visually inert. 03 the 37 series titles were inert spans - a screen-reader user had nothing to jump between on the flagship browse page. All eight title classes emit h3, the Feature desk name moves to h2, and two CSS rules neutralise the UA heading defaults (rack-masthead excluded from the margin reset, stock-title from the weight reset, because each already declares that property). Verified live: H3, font-weight 400, margin 0, 38 titles, one h1, zero overflow. 60 THE ARTWORK IS CREDITED. Founder: "artist is Christopher James Parker + Ai" then "add Christopher James Parker + AI, to God be the Glory". 350 entries carried artist Generated; all now carry the full credit. Separately those entries carry a title that is the source filename title-cased, so src/lib/artwork-alt.ts detects the machine-title pattern and gives those images alt="" - the visible figcaption beside them already carries title and credit, so a screen reader hears it once instead of twice. Hand-written titles keep their descriptive alt. 57 the dead mobile-nav system (mock-mobile-nav-panel and five siblings, ZERO tsx usages) is deleted - thirteen rule blocks. This is why an earlier session concluded the menu had no styles: they existed under the OLD class names after a rename. 58 is-open is now applied rather than deleted, activating styling already designed for it. ID COLLISION RESOLVED: another session shipped 97b99a90 under F-121/SA-077 (touch hit pads painted blue slabs over the /series switcher - caused by MY F-120 ::after hit pads colliding with EditorialMotionSystem, which claims the same pseudo-element). My a841dd97 used the same ids and my publish overwrote their PRD body. Theirs is restored at F-121 (first writer keeps the id) and my scripture record moved to F-126 with a bridging note, since neither commit message can be rewritten. Verified their fix still holds: the switcher ::after content is none, no slabs.'

  - id: SA-081
    title: polish-backlog-batch-2-public-edition-tab-and-menu-focus
    note: 'Founder-directed 2026-08-18 (F-127). POLISH BACKLOG BATCH 2. 36 THE PUBLIC EDITION IS IN THE TAB BAR. /daily-bread is the only fully public reading surface and had NO TAB AT ALL, while TODAY and LIBRARY are both auth-gated - a signed-out reader primary navigation was 40% sign-in wall. It sits second, beside TODAY, because the two are the reading destinations: TODAY is your plan, DAILY BREAD is the shared paper. The grid was repeat(5, minmax(0,1fr)) and is now grid-auto-flow column with grid-auto-columns minmax(0,1fr), so the bar adapts and the next change does not need a magic number edited in two places. MEASURED AT 390px: six tabs at 64px each, all labels on one line, 44px tall, zero bar and page overflow. The longest label DAILY BREAD first measured 63px inside a 64px tab - it fitted, with 1px to spare, which is not a margin - so the label tracking tightens from 0.08em to 0.04em below 420px, buying ~5px on the longest label and imperceptible on the short ones. 39 THE MOBILE MENU IS A DIALOG WITH REAL FOCUS MANAGEMENT. It announced as an unnamed group; focus never entered it, so a VoiceOver user tapped the hamburger and heard nothing; and Tab escaped into the page behind. Now role=dialog with its label, focus moves to the first item on open, and Tab/Shift-Tab cycle within the panel. Focus RETURN on close was already handled. DELIBERATELY NOT aria-modal=true: the page behind stays scrollable and reachable because the scroll lock was reverted in F-118 (every variant broke something worse, including position sticky on the topbar), and claiming inertness that does not exist would be a lie to assistive tech. 51 TABULAR FIGURES where digits stack - rr-count, cover-meta, issue-meta, preview-kicker, the series counter and per-card day counts. NOT global: oldstyle-nums is a real editorial choice for numerals inside prose and must not be overridden. 52 BALANCED HEADLINES - text-wrap balance on the ten title and standfirst classes, scoped to headings and deks because on running body copy it is both wrong and expensive. TEST CONTRACT UPDATED: mobile-tab-bar.test.tsx asserted exactly five destinations, which encoded the old contract; it now asserts the approved six with /daily-bread second. TRAP RE-CONFIRMED: the tracking fix measured as not applied until the service worker was cleared - the SW served stale CSS. Third time in this session. Verify computed styles only after clearing caches, or measure the served stylesheet directly.'

  - id: SA-082
    title: intro-timing-flash-and-parallax-inertia
    note: 'Founder-directed 2026-08-18 (F-128). THE INTRO STOPS FLASHING, AND THE PARALLAX GAINS WEIGHT. "The intro animation is a bit misstimed and the color transition looks like a glitch on the words. It is white overlayed over the blue masthead breifly for a frame or so and it looks like a mistake. Site wide animation paralaxing and such needs more finesse and innovation." THE FLASH WAS A TIMING OVERLAP, NOT A COLOUR BUG. Both timelines start together when .is-lifting lands: the ink retracts in 900ms, while the key plate faded over 260ms after an 820ms delay and so was still painted until 1080ms - 180ms AFTER the ink had uncovered the real cobalt masthead. Cream letters on top of cobalt letters. It landed on the wordmark specifically because .press-ink collapses toward top center, so the masthead band is the LAST thing it uncovers; the overlap could not have happened anywhere harmless. The fade now completes at 840ms (opacity 240ms ease 600ms), 60ms before the ink finishes, so the two never share a frame. Verified in the SHIPPED css: opacity .24s .6s against transform .9s. THE INTRO ALSO LINGERED: the sequence finishes at ~2050ms (hand-off 1050ms + 1000ms flight) but HARD_STOP sat at 3200ms, leaving ~1.15s of a transparent inert overlay over a finished page. Now 2250ms. PARALLAX HAS INERTIA INSTEAD OF TRACKING THE SCROLLBAR. The old loop mapped scroll position straight to a transform once per scroll event, which is why it read mechanical - the layer was rigidly pinned to the scrollbar and started and stopped in the same frame the finger did. Each layer now EASES toward its target at a fixed per-frame rate, so it leads into a scroll and settles after one. Measured: after an abrupt 420px jump the value glides from -0.02 to 15.02 over 29 frames rather than snapping. THREE PROPERTIES PRESERVED DELIBERATELY: the +/-28px cap is unchanged (depth, not drift); the FIRST FRAME SNAPS to target so nothing slides in from zero on load; and the loop PARKS ITSELF after 24 still frames, so a stationary page costs nothing - the old event-driven version did no work at rest and that property survives the move to a continuous animation. prefers-reduced-motion still disables the system before the loop starts. CONSIDERED AND REJECTED: a velocity-driven registration slip - a crimson ghost offsetting a pixel or two on fast scroll and settling, echoing the misregistration the intro is built from. It is the most on-brand motion idea available and was NOT shipped because it needs a pseudo-element on each plate, and ::after collisions have already cost this codebase two bugs in two days (F-120 hit pads over the switcher, fixed in F-121). It deserves its own decision, not a side effect of a timing fix.'

  - id: SA-083
    title: polish-backlog-batch-3-search-zero-state-and-type-craft
    note: 'Founder-directed 2026-08-18 (F-129). POLISH BACKLOG BATCH 3 - SEARCH ZERO-STATE AND TYPOGRAPHIC CRAFT. 45+47 THE SEARCH EMPTY STATE. The overlay opened onto a single hint line; every search in the Mobbin scan (Best Buy, IKEA, Matter, GitHub) gives the empty state something to act on, because the second search for a thing is more common than the first and retyping is the entire cost. RECENTS are recorded when the reader OPENS A RESULT, not on every keystroke - that is the signal the query was worth keeping. Six max, most recent first, with a CLEAR control, STORED IN THIS BROWSER ONLY: the search box is the one place a reader may type something they would not want on a server, and after this week privacy work the copy has to stay true. SUGGESTIONS ARE REAL SERIES NAMES read from SERIES_ORDER, so the empty state teaches the actual corpus rather than inventing example prose - which also keeps it inside the founder do-not-change-content rule. Verified: chip fills the input, 9 results, opening a result stores the recent, reopening shows it with CLEAR. 53 UPPERCASE LABEL TRACKING HAD TWO SOURCES OF TRUTH. .text-label declared 0.12em while .mock-home .text-label overrode it to 0.04em, and the newspaper shell wraps 25 of the ~32 surfaces that use the class - so the same label rendered two different ways depending on which shell it sat in, and the base value was effectively dead outside admin and onboarding. Now one --track-label token at the shell value, which is the design as it actually reads; onboarding and admin tighten to match everything else. 55 THE DROP CAP HAD ONLY HALF ITS OPTICAL ALIGNMENT. translateY was already lifting cap-bottom to body x-height; the horizontal half was missing, because a serif cap carries a left side bearing so the glyph sat a couple of pixels inside the text column it is meant to align with and the paragraph edge read as ragged. margin-left -0.05em pulls the ink flush with the measure rather than the glyph box. 56 HANGING PUNCTUATION REACHES THE READER PULL QUOTES. .type-prose already declared hanging-punctuation first last, but the reader blockquotes are .font-reading and never inherited it. The oversized decorative quote mark PullQuote renders is a separate thing and already hangs correctly; this is the quote character in the text itself. Support is WebKit-only, which is why the existing text-indent fallback carries the same intent elsewhere; both are harmless where unsupported.'

  - id: SA-084
    title: reader-line-spacing-and-measure-controls
    note: 'Founder-directed 2026-08-18 (F-130). LINE SPACING AND MEASURE JOIN THE READER SHEET. Backlog #15. Matter exposes Spacing and Width beside Font and Size, and for long-form scripture those two do more for legibility than typeface choice; neither was reachable here. The sheet now carries TEXT SIZE, LINE SPACING and LINE WIDTH in one stepper rhythm. LINE SPACING: Tight/Standard/Open maps to line-height 1.5 / inherited / 1.95. LINE WIDTH: Narrow/Standard/Wide maps --measure-reading to 58ch / 68ch / 78ch. Verified live from the sheet: measure 68ch to 78ch, line-height 25.5px to 33.15px, with data-reading-measure and data-reading-leading landing on html. HOW IT IS WIRED AND WHY: both ride html data attributes, the same channel data-text-scale already uses via providers.tsx, so every reading preference lives in one place rather than three mechanisms. LEADING IS SCOPED TO THE READING FLOW, not global - a global line-height would drag captions, labels and the masthead with it. MEASURE OVERRIDES --measure-reading, the token the reader column and PullQuote already share, so the whole column moves coherently instead of one element at a time. Named steps rather than raw sliders, matching how this reader already handles theme and text size: a reader picks a feel, not a number. BACKLOG #16 WAS ALREADY DONE. "Offer more than two reading grounds" has been shipped since F-067 - the sheet carries four named themes: Ink, Parchment, Vellum, Night. Recorded so it is not built twice; no code changed for it. A TEST HAD TO CHANGE: reader-theme-control.test.tsx asserted getByText(''Standard''), and all three steppers now read Standard at their defaults, so that query is ambiguous BY DESIGN rather than by bug. Scoped to the TEXT SIZE group with `within`.'

  - id: SA-085
    title: transport-remaining-time-and-backlog-already-built-audit
    note: 'Founder-directed 2026-08-18 (F-131). THE TRANSPORT LEADS WITH WHAT IS LEFT, AND FIVE BACKLOG ITEMS WERE ALREADY BUILT. 18 - the full panel meta read 0:00 / 6:37 - 1 of 10 - 0:03 left, where the trailing left was the CHAPTER remainder: two time values meaning different things, and the smaller one made a ten-minute reading look nearly over. Spotify reduces the same idea to "3hrs 43min left, 1% complete", the number a reader actually decides on at 6am. Now reads 10:00 left - 1 of 3 - 0% complete. The docked mini-player in the same component ALREADY counted down; the full panel now agrees with it instead of contradicting it. Two tests encoded the old elapsed/total contract and were updated while keeping the property each guarded. FIVE APPROVED ITEMS WERE ALREADY IMPLEMENTED, verified against the codebase before building: 16 more reading grounds (four named themes since F-067); 19 sleep timer (SleepTimer.tsx with fixed durations, end-of-chapter mode, countdown and a FADE-OUT rather than a hard stop); 20 chapter list (NarrationChapters, opened from the transport row); 30 week dots (PresenceWeekRow, F-066/SA-025); 32 Day N of M header (CuratedActiveView). #30 IS THE ONE WORTH READING TWICE. I built a WeekDots component before checking and REVERTED IT ENTIRELY. PresenceWeekRow already existed under a FOUNDER-LOCKED contract stricter than what I wrote: lit/unlit only, NO visible numbers, NO streak, NO missed, NO red, with the only count in the aria-label for accessibility rather than gamification. Mine rendered a visible "2 days of reading this week", a direct violation of the lock, and would have shipped a SECOND presence widget onto a page that already had one. Deleted component, test, CSS and placement; both touched files restored byte-for-byte to HEAD. THE LESSON, SECOND TIME THIS WEEK: audit the codebase before building from a pattern list. The backlog was drawn from a Mobbin scan plus verified defects, and the Mobbin-derived half was never checked against what already existed, so it OVERSTATED THE GAP. Remaining-item counts from that document should be treated as an upper bound, not a plan.'

  - id: SA-086
    title: polish-backlog-batch-4-hover-states-reading-time-named-stages
    note: 'Founder-directed 2026-08-18 (F-132). POLISH BACKLOG BATCH 4. 06 SIX BUTTONS HAD AN INVISIBLE HOVER STATE. hover:bg-gold hover:text-tehom, and --color-gold resolves to cobalt #1f2a8d in LIGHT mode, so hover painted near-black text on a blue field: measured 1.57:1. The six are both auth submits, both error-recovery buttons and the soul-audit error CTA - the exact moments a reader cannot afford a dead control. Fixed with the remedy this codebase already uses twice (SA-047 chat launcher, SA-080 mock-btn): a .cta-solid class painting BOTH halves explicitly per theme rather than trusting a token whose name lies about its value. Light cobalt on cream ~9.7:1, dark amber on deep ink ~7.9:1. focus-visible shares the rule as before, so keyboard users do not lose the affordance the fix restores. 26 READING ESTIMATES ON THE DAY CARDS. Waking Up puts a duration on every course item because "do I have time for this right now" is the question at 6am. src/lib/reading-time.ts derives minutes from the words count ALREADY IN audio-manifest.json (535 of 575) at 200wpm, which avoids inventing a second index over the same corpus and avoids reading public/devotionals at runtime, where Workers returns nothing. THE CAVEAT IS STATED NOT BURIED: that count is of the NARRATION SCRIPT and the segmenter omits pull quotes, captions, CTAs and art, so it is a slight UNDERESTIMATE of the full page - the right direction to be wrong in for a do-I-have-time signal, and why the label reads "min read" rather than a precise duration. Devotionals with no entry render nothing; a missing estimate beats a fabricated one. 42 THE COMPOSING SCREEN NAMES ITS STAGES. Three dots and Building your paths is honest but opaque. The three stages are the ones the submit route actually performs, in order: reading the input, matching against the library, composing three paths from retrieved Scripture. THE TIMING IS ESTIMATED AND THE CODE SAYS SO - the compose is a single request with no progress events, so this cannot instrument real boundaries. Two rules keep it honest: the LAST STAGE NEVER SELF-COMPLETES (nothing is marked done that the component cannot observe) and the whole thing unmounts the moment the request returns, so a false finished state is never shown. A DUPLICATION WAS CLOSED: the component doc claimed it was the single place this markup lived, which was true of the homepage only - /soul-audit still carried an inline copy, so the named stages would have landed on one surface and not the other. BACKLOG AUDIT - NINE MORE ALREADY BUILT, verified before writing: 25 ActivePlanBadge, 31 ReaderTimeline, 34 ReminderScheduler, 35 TodayReturningBand, 41 OptionCard, 43 audit-count surfacing, 48 rail empty states, 49 active-tab count, 67 restore purchases.'

  - id: SA-087
    title: search-filters-by-kind-and-highlights-grouped-by-series
    note: 'Founder-directed 2026-08-18 (F-133). SEARCH FILTERS BY KIND, AND HIGHLIGHTS GROUP BY SERIES. 46 - the corpus reaching the overlay is more varied than the surface admitted: series, devotionals and the reader own marginalia all arrive in one stream. Matter groups by content type; this filters to one at a time. ALL / SERIES / DEVOTIONALS / YOUR NOTES, each with its live count, between the input and the first group so the reader sees what the corpus holds before scrolling it. Verified with a real query: ALL 10, SERIES 2, DEVOTIONALS 8, YOUR NOTES 0, and choosing SERIES collapsed the results to that group alone. ''all'' is the default and RESETS ON EACH OPEN - the filter is an affordance, never a gate. Counts use tabular figures so the row does not shimmer as the query changes. 23 - Blinkist lists ''Atomic Habits - 1 highlight'' rather than a flat stream, and the reason shows up over time: a flat list stops being usable at roughly the point it starts being valuable. Two properties held deliberately: ORDER IS NEVER REWRITTEN (groups and rows both keep the incoming newest-first order, so grouping reorganises a reader history without reordering it) and NOTHING IS DROPPED (anything whose series cannot be resolved lands in a final ''Other readings'' group). Group headings are sticky so the series being scrolled stays named. A BUILD BREAK CAUGHT IN VERIFICATION: the first version imported findSeriesForSlug from @/lib/today-devotional, which also owns the Workers content fetch and drags node:fs and node:path with it - and the rail is a CLIENT component, so the build failed outright with UnhandledSchemeError: Reading from node:fs is not handled by plugins. type-check AND lint both passed; only the real build caught it. Replaced with a local resolver over the SERIES_DATA the file already imports. WORTH KEEPING: a green tsc says nothing about whether a server-only module just crossed into a client bundle - second time this week a gate has been green while the build was not.'

  - id: SA-088
    title: ref-counted-scroll-lock-one-owner
    note: 'Founder-directed 2026-08-18 (F-134). ONE OWNER FOR THE PAGE SCROLL LOCK. Backlog #59. Seven components each did their own naive save/restore of document.body.style.overflow, and because every one captured ''the previous value'' at its OWN open, nested opens leaked: menu opens saves '''' sets hidden; search opens saves ''hidden'' sets hidden; menu closes FIRST restores '''' and THE PAGE SCROLLS BEHIND OPEN SEARCH. Reachable in TWO TAPS on mobile, because the search button sits outside the menu panel so tapping it closes the menu and opens search in the same tick. An eighth site made it worse: page.tsx cleared overflow UNCONDITIONALLY ON MOUNT, so navigating home while any overlay legitimately held the lock silently unlocked the page underneath it. FIX: src/lib/use-scroll-lock.ts - depth, not cleverness. The FIRST lock captures the real previous value, nested locks only increment, the LAST release restores; a component closing out of order can no longer speak for the whole page. Migrated ArtworkLightbox, FirstRunIntro, NarrationChapters, TransportSheet, GenerationPaywall and GlobalSearchOverlay; the homepage reset is guarded on isScrollLocked() so it still clears the stale state it was written to catch and nothing else. ArtworkLightbox was the worst of the seven - it reset to '''' UNCONDITIONALLY including on close, so a lightbox opened over another overlay unlocked the page for that overlay too. The search overlay also loses its visibilitychange/pageshow re-assert, which existed to paper over exactly this class of stomp. DELIBERATELY STILL body overflow hidden: this change is about OWNERSHIP, NOT MECHANISM, and the limitation is recorded in the source rather than left to be rediscovered - the scrolling element is html, so on some platforms the page can still be moved; locking html DOES hold and BREAKS position sticky on the topbar, measured 53px to MINUS 1346px in F-118. Changing the mechanism is a separate decision with its own testing. VERIFIED in the browser at 390px running the real two-tap sequence: start '''', menu open '''' (no lock by design since F-118), tap search (menu auto-closes, search opens) HIDDEN, search closed ''''. Plus four unit tests including the out-of-order close and ''restores what was there before the first lock, not an assumed default''.'

  - id: SA-089
    title: publishing-record-byline-dates-one-version
    note: 'Founder-directed 2026-08-18 (F-135). THE PUBLISHING RECORD - BYLINE, PUBLICATION DATES, AND ONE VERSION. Founder: ''treat this like a true publishing house.'' Three records a publisher keeps, none of which existed. BYLINE: AuthorColophon had been mounted in both readers since 2026-05-13 with both call sites passing only translation, so three of its four lines had NEVER RENDERED. Now Written by MILO, edited by JAMES PARKER, as overridable defaults. Milo is the pseudonym for the synthesis of AI tools used to produce the readings; the founder declines the writing credit deliberately - ''Unless I actually write it, I dont consider myself the writer, and I dont write it intentionally because I want to benefit reading and discovering like a user.'' House copyright is NOT repeated - SiteBottom carries WokeGod LLC once, sitewide. DATES ARE GRADED BY EVIDENCE: only 121 of 575 readings have a true publication day - 86 from the Substack export and live JSON-LD, 35 from prefab series that shipped as a unit. The other 454 arrived in bulk imports where 365 SHARE 2026-05-08 ALONE. So each record stores its source and formatPublished() renders an exact day only for substack/series-ship, and THE MONTH ONLY for first-seen; rendering a day there would assert a publishing event that never took place. Dead ends checked so they are not re-checked: filesystem birth times are WORSE than git (8 distinct dates, files stamped LATER than their own commit) and the CHANGELOG records no per-series launches. The Substack CSV export is STALE - five genesis posts were recovered from the live page JSON-LD, a method validated by reproducing a known CSV date exactly. THE SERVICE WORKER VERSION PAIR HAD DRIFTED NINE RELEASES: sw.js CACHE_NAME v117 against the client SW_VERSION v108, despite a comment in sw.js demanding they match. The client compares SW_VERSION to localStorage and on mismatch unregisters every worker and deletes every euangelion- cache - the recovery path for a wedged worker. A returning reader''s stored v108 matched the shipped v108, SO IT NEVER FIRED FOR NINE RELEASES. The primary update path still worked (the worker''s own activate drops non-current caches), so this was a DEAD SAFETY NET rather than a broken site. package.json had sat at 0.7.0 since February 2026 through 88 decisions and 134 features with ZERO GIT TAGS. scripts/release.mjs now moves edition, cache name and client SW version in lockstep and heals a drift UPWARD, never backward, so no reader is handed a version they have already stored. New gate verify:publish-dates is wired into pre-commit after verify:appstore-gate and was tested in BOTH directions - it fails on a planted undated devotional and passes clean once removed. All nine gates green, so concurrent sessions are unaffected.'

  - id: SA-090
    title: daily-bread-edition-engine-and-the-whole-paper
    note: 'Founder-directed 2026-08-18 (F-136). THE DAILY BREAD BECOMES A DAILY PAPER, AND ONLY THAT PAGE - founder: "Fully locked to the one page tho!" THE DEFECT: every daily section is a fixed array in src/data/daily-edition.ts rotated by dayOfYear % length (14 practices, 6 guides, 10 panels, 12 word studies, 7 prayer foci), so the paper repeats every ten days and new content means editing TypeScript and deploying. THE ENGINE: one edition_items table keyed by (kind, publish_date, slot), one generator per kind, one runner serving both a nightly GitHub Action and the founder monthly batch. Content publishes by writing rows to Supabase - NO COMMIT AND NO DEPLOY - because Cloudflare Cron is INERT here (wrangler.jsonc triggers.crons commented out, OpenNext worker exports only fetch, no scheduled() handler) and auto-deploy on push to main is not reliably firing, so any design where daily content requires a deploy inherits this project''s most failure-prone operation every single day. MOST OF THE PAPER NEEDS NO MODEL: daily prayer, word study, crossword, unscramble, quiz, gallery, liturgical season and commemoration are all COMPUTED from assets already in the repo (the 7-translation corpus at public/bibles/{TR}/{BOOK}.json, public/lexicon-strongs.json, and the 643-set print archive) and write in as approved, because there is nothing to review in a computed crossword. Only invented voice (practice, strip captions, the weekly net-new lead) and third-party items reach the approval queue. THE CARTOONS ARE REPLACED, NOT REPAIRED: par-persistent-widow.webp is a man in a 1940s fedora at a door in a gothic-spired Western city, gold-lit on a dark ground, when the parable is a widow before a judge - it breaks the locked riso preamble on subject, period, region, palette and lighting simultaneously. The slot becomes a recurring strip, THE NINETY-NINE (the flock left behind while the shepherd goes after the one), whose cast was chosen partly on CHARACTER DRIFT: sheep are simple high-contrast silhouettes with no faces to drift and no period costume to get wrong, which is the only way an automated strip survives hundreds of generations. Claude specifies the prompts via scripts/imagery/build-prompts.mjs with the four founder-approved anchors attached; CODEX GENERATES - Claude Code has no image_gen and Nano Banana and Higgsfield stay banned for this pipeline. THE LIBRARY IS ABSENT, NOT WASTED: public/images/library/ and public/images/generated-*/ are gitignored and a find across the home directory returns nothing, so the 1,404-entry catalog describes 1,401 images that are NOT ON THIS MACHINE - only 3 carry assignedTo. Any plan assuming 602 riso posters is planning against assets that do not exist here. What does exist is 643 archived classical print sets (662MB), which the founder correctly said do not fit devotionals - they are Renaissance chromolithographs against a cobalt-and-cream riso brand. They ship as THE GALLERY with an attribution frame (artist, title, date, one paragraph of looking), because register shifting by SECTION is what a newspaper does, and a caption box turns a style clash into an arts column. They are audited first — VISUALLY: 15 parallel agents opened all 291 tracked prints (the served pool; the 643-set archive is the later expansion, same JSON) and verdicted each clean/text-artifact/unusable with a reason (145/116/30, docs/print-audit-2026-08-18.json). Only clean ever publishes. The first mechanical seed (first-40 alphabetical) was REFUTED by the adversarial verify pass, which opened arch-ancient-olive-press.webp and found a baked-in OLIVE PRESS placard the heuristic had marked clean — verdicts now come only from looking. THE PRAYER LIST STOPS BEING INVENTED: F-098 weekday categories were honest but authored; they are replaced by prayers pulled DIRECTLY FROM SCRIPTURE, printed in full with reference, which removes invention from the section entirely - founder: "make it a daily prayer with prayers pulled directly from scripture". Real people to pray for return only through sourced allowlisted feeds with attribution as a NOT NULL constraint, never as prose we wrote. ON THIS DAY IN CHURCH HISTORY IS EXPLICITLY NOT BUILT - without a sourced dataset it is exactly what the F-098 invention line forbids. THE LEAD is net-new on Sunday and rotates Monday to Saturday, capping LLM cost and review burden while the front page still has something genuinely new on a predictable rhythm. FAILURE BEHAVIOUR IS SPLIT DELIBERATELY per Development Rule 1: a missing SECTION renders nothing (F-098 contract, correct), a missing DATABASE renders a visible error - the page must never assemble a plausible paper out of fallbacks. Replaces the dead admin/youtube-allowlist and admin/feed-controls mockups, which are hardcoded arrays with no handlers and at least one fabricated channel id, violating Development Rule 6 as they stand.'

  - id: SA-091
    title: accounts-fully-implemented-gdpr-parity-progress-sync-billing
    note: 'Founder-directed 2026-08-18 ("also fully impliment accounts"), executed overnight under ultracode (F-137). METHOD: a read-only audit of the whole auth surface first (12 broken, 13 missing, every claim file:line), then five parallel build lanes, then ADVERSARIAL VERIFICATION which refuted every lane at least once, then a second fix round against the exact findings. THE P0 WAS A GDPR EROSION NOBODY COULD SEE: after the two-site-states data ruling (F-105, 2026-08-16 - its CHANGELOG "SA-062" label collides with the canonical decisions file and is deliberately not cited), signed-in annotations and session_bookmarks key session_token to the AUTH USER ID, but account deletion and data export swept only anonymous session tokens from user_sessions - so every note, highlight and bookmark a signed-in reader ever made SURVIVED "Delete My Account" under settings copy promising permanent removal, and was absent from their own export. push_subscriptions had the identical defect (user?.id ?? auditToken at write, absent from the keyed-table lists), caught by the verifier CLONING THE LANE''S OWN TEST HARNESS. Both fixed; a structural test now asserts every route writing user-id-into-session_token has its table in BOTH privacy lists, so the next adopter of this keying cannot drift silently. DOCUMENTED RESIDUAL GAP, not hidden: rows written before commit cccee2f6 under the euangelion_audit_session randomUUID (which was never inserted into user_sessions) are reachable by neither helper and were never swept by retention cleanup; closing that needs a decision on linking the audit cookie token to accounts. SIGN-UP WAS THE WEAKER TWIN exactly where it mattered most (the page whose users hit the 2/hr mailer cap): Google unconditional and ordered first, no Turnstile token (a 403 time bomb armed the day TURNSTILE_SECRET_KEY is set), no in-app OTP entry, no guest hatch - all brought to parity with sign-in, plus a Turnstile remount defect fixed in BOTH twins. READING PROGRESS IS THE REASON TO SIGN IN: user_progress existed since migration 004 with zero readers or writers; /api/reading-progress now mirrors listening-progress semantics (401 write signed-out, 200-null read), merge is a MONOTONE UNION (done anywhere = done), and the store carries an OWNER STAMP so a shared device never pushes user A''s history into user B''s account - B''s first sync replaces local with server state and re-stamps. BILLING: the portal resolves via readUserBillingState().stripeCustomerId FIRST (the migrations applied tonight made that real), falling back to the device-local checkout id; webhook and reconciliation writers now .select() and treat zero-row UPDATEs as failures instead of green logs. SURFACE: /account 308s to /settings (the mobile tab already linked it), display name UI over the existing full_name column, email change with confirmation-time sync of public.users.email (billing resolves users by that column; syncing at updateUser time would be wrong because the change is unconfirmed), onboarding_completed written NON-FATALLY alongside auth metadata (metadata stays the truth), and a middleware-matcher invariant test covering the F-083 regression class. STILL FOUNDER-BLOCKED, external services: custom SMTP (2 emails/hour is not a product) and Stripe env (read path live, purchase path off until BILLING_CHECKOUT_LIVE and keys exist).'

  - id: SA-092
    title: daily-bread-award-pass-footer-truth-and-the-paper-that-speaks
    note: 'Founder-directed 2026-08-19, eleven pinned items executed overnight under ultracode (F-138). RESEARCH BEFORE MOTION: last30days (68 items; the community turn is AWAY from scroll-hijack — "Show HN: I was wrong about scrollytelling landing pages" — toward motion that serves reading; CSS animation-timeline compositor-side at ~85% support) and Mobbin (New Yorker full-bleed heroes, SSENSE typographic covers, Front''s ruled three-column front page) set the register. THE CHOREOGRAPHY IS NATIVE AND GATED TWICE: design-system/edition-scroll-motion.css ships a scroll()-timeline reading spine, view()-timeline rule-draws and plate-settles, and a masthead fold — all inside @supports (animation-timeline) AND prefers-reduced-motion, zero JS, F-104''s reveals untouched on disjoint properties. THE TYPE LADDER IS ONE SYSTEM: ten rungs documented in design-system/TYPE-SCALE.md; 66 stray font-size declarations in the edition region migrated onto four new sub-body tokens; 11 heads assigned one rung per semantic level (compartment heads UP from 0.56rem micro to --type-meta; every feature headline at --mock-type-3). Any hard-coded rem is now a defect by contract. THE GALLERY IS A SPREAD WITH VASARI ENTRIES WRITTEN FROM LOOKING: 7 plates/day (lead + six-thumb contact row + lightbox paging all seven), and 145 per-print entries — image-derived title, what is literally in the frame, one line of connoisseurship — each written by an agent that OPENED the print; the Vasari register is STRICTLY for art and photo captions (founder mid-flight). Guard tests were re-scoped: the no-paint-words rule now applies only to generic-bank copy, because Vasari "shown" text describing Elijah''s extended hand IS reporting, not invention. THE PRAYER CARRIES ITS VERSES: superscript numbers straight from the corpus. GUIDES GREW INTO PAGES: six /guides/[slug] essays, documented history only (Guigo II cited; elsewhere method, never claimed lineage). AUTHORS: /authors/milo states plainly it is the pen name for the AI synthesis; james-parker is the editor; author marks from audited prints, NO fabricated photos. FOOTER TRUTH: a claim-by-claim audit against code fixed /how-we-write (server-side session storage claims, audio abridgement overstatement, the byline story, computed-vs-reviewed split of the Daily Bread), /help, /about, /credits, /pricing, translations and legal. THE PAPER SPEAKS: 15 rotation slugs (provision/truth/hope) had NO audio because the render pipeline never supported panels format — narration_extract.py now mirrors buildPanelSegments BYTE-FOR-BYTE (cross-language hash a01cf25bce1d verified; the vitest parity gate extended to panels), all 15 rendered through VOICEBOX ONLY (founder: "Voice box only, not elleven labs"), 0 failed, chapters MEASURED post-render by build_chapters.py. ~30 MODULES: seven new kinds (redletter, proverb, verse, archive, b365, voices, question) built, tested, runner-wired and interleaved so games break up — BLOCKED ON one founder paste (APPLY-NOW-2026-08-19b.sql widens the kind CHECK; the -19.sql half enables reading-progress sync). Probed prod directly: the paste had NOT run (23514 on the constraint probe, cleaned up), so the seed excludes new kinds and the sections render nothing until paste + one command (pinned). CONTAINER RULE STANDING: no content breaks its container on any touched page — the unscramble bank was the one overflow, fixed with min-width:0 + overflow-wrap, and the rule is now written into every new layout.'

  - id: SA-093
    title: audio-transport-measured-against-shipped-patterns
    note: 'Founder-directed 2026-08-19: "use last 30 days skill and mobbin for research and adhere to it", applied to the audio-forward brief (F-139). TWO INDEPENDENT RESEARCH PASSES, written up in docs/audio/AUDIO-UX-PATTERN-RESEARCH-2026-08-19.md: Mobbin gave 16 iOS screens and 4 recorded flows (ElevenReader, Spotify, Blinkist, Headway, The Atlantic, Waking Up, Bloom, Finimize, Calm, Substack, Apple News, Apple Podcasts, NYTimes Audio, Neuecast); last30days gave 61 items across 6 sources for 2026-07-20..2026-08-19, with honest coverage limits recorded (Reddit went partial at 25 items on an HTTP 429, X returned nothing, only 29 of 61 items fell in the last 7 days), so Mobbin is the load-bearing pass and absence of a complaint is not evidence of absence. THE RULING THAT MATTERS IS ABOUT SILENCE, NOT LAYOUT: r/pocketcasts split hard over trim-silence (u/ggommezz, 12 upvotes: "I trust the podcaster to deliver the content at a speed and with the pauses ideal for listening to. It is disrespectful to mess with that."), and because the renderer PAUSE_AFTER grammar is the beat after a Scripture line, silence here is content: SPEED SHIPS AND DEFAULTS TO 1x, TRIM-SILENCE NEVER SHIPS - not as a default, not as a toggle. CODE CHANGE, the only runtime change in this decision: the scroll mini bar forward-15 was desktop-only, leaving the phone a lone back-15 that read as an omission; is-wide-only comes off the forward button so both skip directions exist at every breakpoint, the remaining-time readout is what yields below 560px (was 460px), dead CSS removed, vitest covers both directions inside the minimized bar. STRATEGY CORRECTED ON THE RECORD: docs/plans/AUDIO-FORWARD-STRATEGY.md opened by claiming 380 of 550 tracks 404 in production and made R2 the gate in front of all audio work. That inference from git ls-tree is wrong in its consequence - npm run deploy builds from the WORKING TREE, not HEAD, so gitignored assets upload like any other file. Verified live against euangelion.app: bible-365-day-1, -200, -365 and he-cannot-deny-himself-day-4 all return 200 with content-type audio/mp4. The catalogue is fully delivered; the real exposure is DURABILITY (380 tracks, 2.9 GiB, exist only on this machine and in the deployed bundle), which is a resilience project competing on merit, not a gate. The 25 MiB per-asset arithmetic in that document STANDS - five scored tracks measure 21.16-21.50 MiB - so a bitrate ceiling remains a prerequisite for any scored re-render. DEFECT FOUND THAT NEITHER PASS WAS LOOKING FOR: a real GET carrying Range: bytes=1000000-1000999 against /audio/bible-365-day-1.m4a returns 200 and the ENTIRE 7.4 MB body while advertising accept-ranges: bytes, so every scrub and every chapter jump refetches the whole track. It is upstream of the service-worker 206 problem anticipated in the strategy, is NOT diagnosed here, and is recorded as ranking above all nine UX deltas because chapters and queues both multiply seeking. OPEN, founder-owned: whether to disclose that the narration is synthesised - his own voice, cloned with consent, is the strongest position available, but r/podcasting is arguing the norm out this month and a devotional audience is unusually sharp about authenticity.'

  - id: SA-095
    title: curated-series-mark-read-advances-plan
    note: 'Founder-directed 2026-08-19 (F-141). /TODAY CAN FINISH A DAY OF A CURATED SERIES. Founder: ''When I finish day one and move on, it keeps making day one the active. There needs to be a way to mark a devotional done in a series so that the series can automatically keep moving.'' /today has TWO readers and only one could finish anything: the Soul Audit plan path (DailyBreadView) has had MARK DAY COMPLETE since F-066, while the CURATED SERIES path (CuratedActiveView) had NOTHING. On the curated path setActiveDay is LOCAL REACT STATE - moving to day 2 changed the view and nothing else, evaporated on reload, and the server''s active_series.current_day sat at 1 forever. The only mark-read control in the product lived on /devotional/[slug], so a reader working through a curated series ON THE PAGE BUILT TO HOLD THEIR PLACE could never advance it. The machinery was already there and already correct - markDevotionalComplete calls advanceActiveDayAfterCompletion which PATCHes current_day (F-097) - it simply had no caller on this surface; half that fix landed in August and this is the other half. FIX: CuratedActiveView gains the completion control with the SAME COPY as /devotional/[slug] so the two readers do not describe the same act in two voices. Pressing it records the completion (advancing current_day server-side), emits libraryUpdated so the library ACTIVE card stops showing the day just finished, moves the view to the next day and refreshes. Day chips gain a tick for days already read so the strip shows what is DONE rather than only what is SELECTED. DELIBERATELY NOT LOCKING FUTURE DAYS: day-gating is founder-disabled and the reading-plan material is emphatic that guilt mechanics drive people off - finishing is offered, never demanded. VERIFIED by mounting the real component: the control appears on the active day, and pressing it records the completion for THIS day - asserted on the slug, because completing the wrong day would advance the plan past unread material. ALSO CORRECTED THIS SESSION: the /today and /daily-bread routes swapped in SA-059 but src/components/daily-bread/ still serves /today while /daily-bread renders src/components/edition/*, so the folder names describe the PRE-SWAP IA and read backwards to anyone opening the tree. Rename deferred - it touches many imports and several agents are in the code.'

  - id: SA-094
    title: page-side-modules-the-morning-critique-and-the-filter-workaround
    note: 'Founder morning critique 2026-08-19 executed same-day (F-140): "You didnt add any modules... MORE CONTENT! MORE SECTIONS! MORE MODULES YOU HALF ASSED IT!" ROOT CAUSE OWNED: the seven SA-092 kinds were invisible because their rows sat behind a SQL paste that never ran (probed prod: 23514 on the constraint). ARCHITECTURAL CORRECTION: deterministic content never needed a database — src/lib/edition/page-modules.ts + the Workers-safe generators (getVerse rides the ASSETS binding) compute redletter/proverb/verse/archive/b365/question AT RENDER TIME from bundled data (PRO.json imported as a module; bible-365-refs.json extracted 365/365; red-letter-bsb.json). No rows, no paste, full paper by construction; the DB keeps the review queue + audited gallery. A Management-API attempt to run the DDL myself was blocked by the permission classifier — prod DDL stays founder-only, and now only matters for reading-progress sync (019). THE CRITIQUE, POINT BY POINT: lead links its full series; games genuinely broken up (quiz renders as THREE separate singles at three positions; crossword flanked by the Catechism Corner — the founder-named blank is prose now; unscramble, word search and quiz never adjacent); the funnies has a DESIGNED reserved frame (hatched plate, "The strip is being drawn") — the gallery is not the cartoon; practice/word compartments opened up (1.35rem→1.9/2rem padding); the season is ELABORATE (color band, plain name, span, 120-180w essay, the numbered week explained through the season''s own sentence pattern — "Week after Pentecost" never renders bare; 8 seasons + 26 feasts + movable days covered, drift-gated against liturgical.ts); the returning-reader band is a SIDE PANEL at the top of the rail. NEW STANDING CONTENT: Catechism Corner (Heidelberg 1563, 33 Q&As verbatim, proof texts parseReference-verified); the Hymnal (33 hymns COPIED BY SCRIPT from the 1890 Otterbein Hymnal, Gutenberg #16455 — THE FILTER LESSON: three model attempts at emitting hymn texts were blocked by the output content policy (it cannot verify PD status at generation time), so scripts/edition/build-hymn-bank.mjs copies the received text from the public-domain source file and no model types a lyric; attributions from the hymnal''s own credit lines + a small documented map for classics it prints uncredited); Voices (200 verbatim quotes, every one substring-asserted against its source file — the extraction EXCLUDED the corpus''s mislabeled Gutenberg bundles, e.g. a "spurgeon" file containing Willa Cather fiction); the Word Search (45 themed sets, 12x12, 8-direction seeded placement, drag + two-tap client). ALSO FIXED: liturgical.ts''s 53rd-Sunday-of-Advent bug (early-December dates before a late Advent start counted from LAST year''s Advent; a pre-Advent December day is Ordinary Time — proven on Dec 1 2028). MULTI-SESSION DISCIPLINE (founder warning): work landed as five explicit-path protection commits before the gated one; the parallel audio session''s SA-093/F-139 ids were detected and respected (this work re-numbered from 093 to 094); one swept foreign file (F-124.md) was amended back out. Preview evidence: 196 test files / 2,449 green; the Workers-runtime page carries every section and grew 151KB → 196KB.'

  - id: SA-096
    title: audio-forward-approved-stage-1-continuity
    note: 'Founder approved the audio-forward plan 2026-08-19 ("I am for the audio plan. get it going"), after overruling the draft''s anti-binge posture: "its ok that a person binge a series, it means the material is really working for them. That is why I want an extreme breadth of content." AUTO-ADVANCE IS ON EVERYWHERE, series included; the series-stops-at-end-of-day rule proposed in the first draft is WITHDRAWN. Second founder critique, also accepted: the first plan was a player and a queue bolted to a reading site, not an ecosystem. THE THESIS THAT REPLACED IT: reading is organised by NEED (the Soul Audit question, pathway, series) and listening is organised by OCCASION (how long have I got, what am I doing) - orthogonal axes over the same content, which is why audio needs its own front door rather than a mirror of the reading IA. Evidence in the catalogue: bible-365 is 365 of 550 tracks and 69.5 of 98.6 hours (70%), and it is the only occasion-shaped thing there. MEASURED BREADTH GAP: median track 11.1 min, NOTHING over 28 min, only 23 tracks under 5 - every piece assumes one occasion; nine formats proposed (Office, Night, Scripture-whole, Edition, deep dive, Lectio) of which the Edition and deep dives need voicing only, no new writing. Founder instinct followed on placement: listening lives in /library (your listening) while the front door for NEW listening starts as a home-page section. THIS DECISION SHIPS STAGE 1a ONLY (F-142), the continuity fixes, verified individually rather than taken on the strategy''s word - and one of its three claimed defects was REFUTED: the ended-flush writing seconds:0 is deliberate (completed_at is set and kept), so the obligation moves to the future continue-listening query, which must filter on completed_at rather than infer from position. The two real defects: position was never written on client-side navigation (pagehide does not fire on a Next route swap, and the cleanup removed listeners without saving), and the 30s server-write throttle was a module-global timestamp that let one reading suppress another''s first write. Fixing the first exposed a third, caught by the test: React detaches refs before passive cleanups, so the unmount flush read a null audio element and saved nothing - position now comes from a lastKnown snapshot updated on timeupdate. SEPARATELY RETRACTED, and it invalidates a gate in the strategy: he-cannot-deny-himself-day-4 is NOT damaged. Re-transcribed in nine slices cut at silence boundaries, every segment is present, in order, ending cleanly on the last frame; the "restarts a sentence and cuts mid-phrase" report came from a single 71-second slice on which Whisper hallucinated a repeated tail. Second false defect report of this kind on this project. The one REAL defect found there is systemic: headings are spoken twice across ~464 devotionals, which dedup_headings() addresses on the new engine. STILL OPEN: R2 (Stage 1b - the only fix for Range/seeking, which Cloudflare static assets do not implement, and for 2.9 GiB of audio existing only on one machine), and founder disclosure ruling on synthesised narration.'

  - id: SA-097
    title: audio-above-the-route-queue-and-library-listening
    note: 'Founder 2026-08-19: "push through the plan to the very end, do not stop and ask me anything". Stages 2-5 of the approved audio-forward plan (F-143). THE ELEMENT MOVED ABOVE THE ROUTES: a single <audio> now lives in the root layout via GlobalAudioHost and is published through a module singleton (src/lib/audio/audio-element.ts) rather than store state - the element is an imperative handle, not data, and a zustand slice would re-render every consumer on registration and tempt callers to read it during render. This is why audio can survive a Next route swap at all; a media element rendered inside a page is destroyed with the page. AUTO-ADVANCE IS ON FOR EVERY KIND, per the founder''s binge ruling, and the test asserts it across series/plan/daily/saved so the withdrawn stop-at-end-of-day rule cannot return by accident. THE QUEUE IS PERSISTED but `playing` deliberately is NOT - restoring it would claim audio is sounding when nothing is, and nothing on this site autoplays on load. THE BAR CARRIES A DISMISS, which our own scroll bar lacked and which Substack and Apple News both ship (Mobbin 2026-08-19): a transport that follows a reader across every route with no way out stops being a transport and becomes chrome. It retires on the reading it is playing, because the reader''s panel is the better surface there. LISTEN STATES THE RUNTIME and calls play() SYNCHRONOUSLY INSIDE THE TAP - iOS grants a media element permission to sound only from within the gesture that asked, and awaiting anything first loses it silently on the device most people listen on. QUEUES ONLY CONTAIN DELIVERED TRACKS, filtered once in queue-builder, because a queue that hits a silent item reads as a broken player rather than a partial catalogue. LISTENING LIVES IN /library per the founder''s placement: what is queued and playing, with reorder, remove, and an empty state that offers a route out. Discovery of NEW listening is a separate job and is not built here. Reorder and remove keep the cursor on the reading actually sounding rather than on an index. ALSO CORRECTED: the comment in tracks.ts asserting Cloudflare slices Range requests from its own cached copy - measured false; Workers static assets do not implement 206, so every seek refetches the whole track while _headers advertises Accept-Ranges anyway. STILL OPEN: the reader panel still owns its own element rather than adopting the global one, R2 delivery, and the new audio-native formats (Edition voiced, Office, Night).'

  - id: SA-098
    title: audio-served-from-r2-with-real-range-requests
    note: 'Founder green-lit R2 2026-08-19 ("please handle this fix it figure it out"). TWO DEFECTS, ONE PROJECT. SEEKING: a real GET carrying Range: bytes=1000000-1000999 against a 7.4 MB reading returned 200 and the ENTIRE body, measured on both the apex and the origin worker, cache hit and all - because Cloudflare''s static-asset layer does not implement 206 Partial Content, while public/_headers advertised Accept-Ranges: bytes regardless. Every scrub refetched the whole track and chapters and queues both multiply seeking. DURABILITY: 380 of 550 tracks are gitignored, so the catalogue existed only on one laptop plus whatever was deployed and could not be rebuilt without re-rendering. ALL 550 TRACKS (3.70 GiB) ARE NOW IN THE euangelion-audio R2 BUCKET, uploaded by scripts/upload-audio-to-r2.sh - idempotent against a local ledger because wrangler 4.110 has no `r2 object list`, retrying once per file and exiting non-zero when short, which is how the single failed upload in the first pass was caught and finished. src/app/audio/[file]/route.ts serves them from R2 with genuine byte ranges; VERIFIED IN THE WORKERS RUNTIME: 1000 bytes requested and 1000 received with a correct Content-Range, a suffix range returning the last N bytes, and a full GET byte-identical to disk. THE TRAP THAT COST THE MOST TIME: assets.run_worker_first is documented to hand /audio/* to the Worker and, on wrangler 4.110, DOES NOT - a request for a track that exists as an asset never reached the route, while a request for one that does not reached it fine, which is the test that isolated it. scripts/strip-audio-from-assets.mjs deletes the directory after build and is wired into both the deploy and preview scripts; that is what actually hands the path over. Two consequences beyond seeking: deploys stop uploading 3.70 GiB every time, and Cloudflare''s hard 25 MiB per-asset limit STOPS APPLYING TO TRACKS AT ALL, which had been recorded as a blocker on any catalogue-wide scored re-render. THE FALLBACK IS LABELLED, NEVER SILENT: a key missing from R2 still serves from the asset bundle carrying x-audio-origin: assets-fallback, so an incomplete upload is visible in one curl rather than hiding behind working audio. SUFFIX RANGES ARE THE SUBTLE CASE and are covered by test - bytes=-500 means the LAST 500 bytes, and reading it forwards would silently replay the opening of a reading when a listener drags to the end, which is exactly what iOS media elements do. STANDING OBLIGATION: re-run the upload script after any re-render.'

  - id: SA-099
    title: library-series-standing-current-and-continue
    note: 'Founder-directed 2026-08-19 (F-145). THE LIBRARY SAYS WHERE YOU ARE, NOT JUST WHAT YOU OWN. Founder: ''The Library needs better organization, and layout. Its as basic as it can possibly be and needs to be fully addressed.'' The four sections were already right - ACTIVE / SAVED / PAUSED / COMPLETED - but the CARDS were not: a saved series read ''Whole series - N days'' and stopped, IDENTICAL whether the reader had finished six days or never opened it. The one place that should know where you are knew only what you owned. That is a shelf, not a library. PATTERN RESEARCH (Mobbin, iOS): Coursera names the next item on every card and links straight to it so resuming never means landing at the top and hunting; Speak badges the live course CURRENT; Peloton and Moonly put a completion fraction on the card and lead the list with In Progress. FIX: seriesStanding() derives completed/total/percentage/next from the local completion log - a pure derivation over SERIES_DATA, no new plumbing, re-derived every render so it is correct the moment a day is marked read. ACTIVE is badged CURRENT with its standing. SAVED shows ''N of M read'' for a started series and offers CONTINUE - DAY n linking to THAT EXACT DAY; ACTIVATE SERIES is the right verb for a series never opened and the wrong one for a series the reader is six days into, so both are offered and the reader picks. PAUSED gains standing alongside its existing ''You reached Day N''. SAVED ORDER puts started series first - a shelf sorted by save-date answers a question nobody asks. COMPLETED DELIBERATELY UNCHANGED: a bar that is always full is decoration, and finished is finished; the completion date is the useful fact. Rendered with INLINE DESIGN TOKENS rather than new CSS classes because globals.css was being actively worked in another session at the time. VERIFIED by mounting the real LibraryView: the live series is badged CURRENT and shows ''2 of 5 read''; a started saved series offers CONTINUE - DAY 3 and the href resolves to that day rather than the series top; an untouched saved series gets no CONTINUE and sorts below a started one - the fixture supplies them in the WRONG ORDER deliberately so the sort is proven rather than accidental. 200 test files / 2,485 tests green.'

  - id: SA-100
    title: the-subscription-pipelines-weekly-paper-and-weekly-series
    note: 'Founder-directed 2026-08-19 (F-140 addendum + F-146). TWO AUTOMATIONS MOVED ONTO THE FOUNDER''S CLAUDE SUBSCRIPTION, both timed to the Wednesday 5am Eastern quota reset so heavy composition always runs on a full tank. (1) THE PAPER (GitHub Actions): cron moved from nightly 03:00 UTC to Wednesdays 10:15 UTC (6:15am EDT / 5:15am EST — after 5am Eastern in both DST phases without tracking DST); scheduled runs build 8 days (Thu→next Thu, always exactly one Sunday). The Sunday feature composes through Claude Code headless in CI via CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`, Pro/Max) with ANTHROPIC_API_KEY force-unset in that branch and DELETED from GitHub secrets — the content pipeline''s Anthropic bill is $0.00/month; the Worker keeps its own key for on-site visitor AI, which a subscription cannot legally serve. Composition is gated: a 12-word contiguous span of the real BSB text must appear verbatim or the build FAILS; historic quotes only from the committed reference index; output lands as a DRAFT in /admin/edition. Proven live twice (914w and 976w drafts of "The One Who Turned Back", Luke 17). An expired token fails VISIBLY in the Actions tab — rerun setup-token. Also fixed pre-flight: the runner still carried the seven page-side kinds and would have crashed nightly against the un-widened kind CHECK; pruned (their rows are unread — SA-094). tsx -e cannot host top-level await; the composer''s helpers run as temp .mts files. (2) THE WEEKLY SERIES MACHINE (F-146, local launchd — Wednesdays 5:20am local): full devo-go on a series/auto-* branch, headless on the subscription. Thematic = founder override file (content/next-series-thematic.md, archived+reset on consumption) OR derived: headless last-30-days discovery over faith/culture conversation + the prior week''s thread, continued WITHOUT reference (series stand alone; the news is the doorway, never the content). Full quality per the skill: ElevenLabs founder voice (SA-043 new-content rule — the "Voicebox only" ruling was scoped to the back-catalog daily-bread renders), /imagen through Codex CLI (built-in tool, anchors, assembled prompts). devo-go''s AskUserQuestion inputs become STANDING-BRIEF.md, founder-editable. THE READING GATE STANDS: SA-029 is a founder ruling automation does not override — the run stops at the gate artifact + pushed branch + notification; `touch scripts/devo-weekly/AUTO_PUBLISH` is the founder''s explicit full-auto switch. REVISED SAME DAY — founder: the series must work like the paper, machine-independent. Scheduled build moved to .github/workflows/weekly-series.yml (Wed 10:20 UTC, cloud): grounding from the COMMITTED index/lexicons/corpus + WebSearch with unverifiable material CUT; ElevenLabs over HTTPS (chunk cache via actions/cache — never pay twice); imagery via headless codex exec on the founder's ChatGPT subscription (CODEX_AUTH_JSON secret; stale auth fails visibly). THE READING GATE IS A PULL REQUEST — readable/mergeable from a phone; AUTO_PUBLISH became a repo VARIABLE. The override file is editable in the GitHub web UI from any device. Local orchestrator retained for attended runs only; launchd retired. Maiden voyage still flagged for founder attention.'

  - id: SA-101
    title: listenable-paper-occasion-picker-and-offline-downloads
    note: 'Founder 2026-08-19: "Complete stages 6-9 consecutively without stopping." (F-147) STAGE 6, THE PAPER IS LISTENABLE: /daily-bread offers Listen beside OPEN FULL READER, built on the server from the manifest so the browser does not read it twice, and rendering NOTHING on a day whose reading has no track rather than a control that would play silence. All 15 rotation slugs already had audio from SA-092. STAGE 7, THE OCCASION PICKER - the listening equivalent of the Soul Audit and deliberately faster: two taps, no questionnaire, because someone reaching for audio has their hands full. How long have you got, and what are you doing, resolved to a QUEUE you press play on rather than a list you browse. Three decisions inside it: the answer is SEEDED ON THE DAY plus the occasion so going back and re-choosing does not silently reshuffle something a listener was part-way through; ACTIVITY SHAPES THE FILL, NOT THE CONTENT (a commute under-fills because overshooting means arriving mid-sentence, background listening tolerates overshoot and a longer single piece, resting caps piece length so stopping is easy) and it never judges which content is suitable, which the catalogue cannot support; and it SPREADS ACROSS SERIES before repeating one, so a 20-minute session is not two days of the same arc. STAGE 9, DOWNLOADS: a service-worker cache the reader fills deliberately. TWO TRAPS, BOTH DOCUMENTED BEFORE THEY WERE HIT AND BOTH REAL. (1) The bucket is NOT VERSIONED and is exempted from BOTH cache sweeps - the worker''s activate purge AND the client''s version-mismatch clear in ServiceWorkerRegistration, which deletes every key starting euangelion- and runs on EVERY release. Without the second exemption a reader who saved a series for a flight would lose it to a deploy they never saw and could never connect. A test pins the two files'' agreement because they have already drifted once (SW_VERSION sat nine releases behind CACHE_NAME). (2) The worker SYNTHESISES 206 FROM CACHED BYTES: a cached Response is a 200 carrying the whole body, and handing that to a media element that asked for a range makes iOS refuse to seek - offline gets the same partial-content contract as online (SA-098), including a real 416 for an unsatisfiable range and correct suffix handling, since bytes=-500 means the LAST 500 and reading it forwards would replay the opening. STAGE 8 IS NOT BUILT AND IS NOT PRETENDED: the Office and Night are new writing and new recording, not engineering. The pipeline can be built; the content cannot be invented to close a plan item. What did land against the same gap is that the picker''s an-hour-or-more ASSEMBLES a long session out of existing readings rather than returning nothing, so the top of the range is usable while the gap itself stays visible. ALSO STILL OPEN: /today is plan-driven and has no Listen affordance; series day rows have no per-day play control because the card is a single Link and a nested button is invalid markup, so that needs restructuring rather than an insertion.'

  - id: SA-102
    title: public-config-build-guard
    note: 'Founder-directed 2026-08-19 (F-148). A BUILD WITHOUT ITS CLIENT CONFIG MUST FAIL, NOT SHIP. Google sign-in was enabled in Supabase, coded into both auth pages, flagged NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=true - and ABSENT FROM PRODUCTION. NEXT_PUBLIC_* is INLINED AT BUILD TIME; .env.local holds these values and is GITIGNORED; a Cloudflare Worker secret does nothing for them. So a build from a fresh clone, a CI runner, or a CLEAN GIT WORKTREE silently succeeds and emits a bundle with NO Supabase client configuration and NO Continue with Google. Nothing fails, the deploy reports success, and the only way to notice is to go looking for a feature in production and find it gone. The live v127 build was made without .env.local. PROVEN rather than inferred: a local build WITH the file inlines ''Continue with Google'' into 2 chunks and the Supabase host into 3, so the code and the flag were correct all along and the ARTIFACT was not. The irony is that the clean-checkout deploy - introduced deliberately in SA-095 so one session could not ship another session''s uncommitted work - is exactly the path most likely to omit a gitignored file. FIX: scripts/check-public-config.mjs, FIRST in the build chain. It reads the env files itself in Next''s precedence order, because Next loads them internally and a pre-build script would otherwise see an empty process.env. It fails the build when NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY or NEXT_PUBLIC_APP_URL is missing, and NAMES the optional flags that are dark so a feature cannot go quietly off. Output is NAMES ONLY, never values, so anyone debugging a build can paste it; the error explains the inlining rule and gives the fix (cp .env.local .) rather than only reporting absence, because the failure mode is unintuitive enough that ''MISSING X'' alone would send someone hunting in the Cloudflare dashboard. VERIFIED both directions: with .env.local it reports 3 required present; in a directory with no env files it exits 1 listing all three plus the remediation.'

  - id: SA-103
    title: series-current-day-marker
    note: 'Founder-directed 2026-08-19 (F-149). THE SERIES PAGE SAYS WHERE YOU ARE. The series page already knew read state - it rendered READ AGAIN on a finished day and tracked n/m COMPLETE - but EVERY UNREAD DAY RENDERED ''READ NOW'', so day 1 and day 7 of an untouched series were TYPOGRAPHICALLY IDENTICAL. The card wall answered ''what is in this series'' and never ''where am I''. That is the difference between a contents page and a plan. FIX: one day is marked START HERE - the first unread day, resolved through nextUnreadDay, THE SAME PRIMITIVE the Library card and /today use, so the three surfaces cannot disagree about where the reader stands. Finished days read tick READ; remaining unread days quiet down to READ. Future days are NOT locked beyond the existing canRead gate, which is founder-disabled: Alan rings the current step and locks what follows, but the ring is the useful half and the lock fights a standing ruling. VERIFIED by asserting the primitive''s contract rather than re-asserting React: an untouched series starts at day 1; it advances to the FIRST UNREAD day rather than past the highest read one; A GAP IS HONOURED - read day 1 and day 3 and the reader is sent back to day 2 rather than forward; and a finished series marks NO current day rather than looping to day 1.'

  - id: SA-105
    title: components-today-rename
    note: 'Founder-directed 2026-08-19 (F-151). THE COMPONENT FOLDER NOW NAMES THE ROUTE IT SERVES. SA-059 swapped the two routes: /today became YOUR reading and /daily-bread became the shared edition. THE COMPONENT FOLDERS DID NOT MOVE. So /today (your plan) rendered from src/components/daily-bread/ while /daily-bread (the paper) rendered from src/components/edition/ - the folder named daily-bread served /today, and the folder serving /daily-bread was called edition. READING THE TREE GAVE YOU THE IA BACKWARDS. This is not hypothetical: on 2026-08-19 it misled THIS session with the code open - a progression bug was diagnosed against the wrong page and reported to the founder that way, and the founder corrected it. Anything reading the tree - a new session, a new agent, a person - inherits the same wrong model. FIX: git mv src/components/daily-bread src/components/today, seven importers rewritten; edition/ already named its route correctly and is untouched. Chosen NOW because the blast radius was checkable and small - seven files, NONE held by another session at the time. A rename is cheap when nothing else is in flight and expensive when something is. KNOWN RESIDUE: DailyBreadView.tsx keeps its name inside components/today/. It renders the Soul Audit plan path of /today so the name is now wrong at the file level too, but the FOLDER was the load-bearing confusion and renaming the component as well would have widened the diff for less benefit. VERIFIED: type-check clean, 2,504 tests green, verify:folder-structure OK, zero remaining references to components/daily-bread/. No behaviour change.'

  - id: SA-106
    title: pipeline-manifest-spine-and-firewall
    note: 'Founder-directed 2026-08-19 (F-152). PIPELINE PHASE 0 - THE MANIFEST SPINE AND THE FIREWALL. DEVO-PIPELINE-HANDOFF-SPEC Part I puts the manifest schema and its validator FIRST, before any stage is built. Neither existed. The manifest at content/pipeline/<slug>.pipeline.json is what every stage reads and writes; resume, partial rerun, --auto mode and the evidence report are THE SAME MECHANISM - a stage advancing a state machine - so a malformed manifest is not cosmetic, it is a pipeline that cannot be trusted to know what it has already done. BUT THE FIREWALL IS WHY THIS SHIPS FIRST. last30days returns Reddit posts, X threads and YouTube comments: excellent evidence about what readers ASK and the WORDS THEY USE, and NO evidence whatsoever about God, Scripture or history. devo-go''s regime - scripture corpus-verbatim, every quote cited from primary texts, every story primary-source verified with the rejection documented - is the product''s advantage in a category drowning in unverified AI output, and ONE Reddit anecdote laundered into a devotional through the discovery channel would cost more than the entire discovery stage gains. Spec Part E states the rule; convention cannot hold it across sessions and agents, so it is mechanical now. SCHEMA: schema/slug/thematic/mode, per-stage state against a closed set, and rulings.sa + rulings.prd REQUIRED so a run cannot be unattributable; the filename must match the slug because resume finds manifests by filename. FIREWALL: no phrase in discovery.audience_language may appear verbatim in any public/devotionals/<slug>-* body or in content/source-packs/<slug>.md. Matching NORMALISES PUNCTUATION AND CASING so reformatting is not an escape hatch; phrases under four words are ignored because those collide by coincidence rather than by lifting. A violation exits 2, DISTINCT from a schema error''s 1, so a caller can tell ''malformed'' from ''contaminated'' - they need different humans. Wired as verify:pipeline in pre-commit; it NO-OPS cleanly while no manifests exist, so it lands before the stages do. VERIFIED by 9 tests against the real script, including that a lifted phrase BLOCKS and prints the phrase and file, that the same phrase passes when NOT lifted, and that punctuation and casing changes still match. DELIBERATELY NOT BUILT: the devo-run skill skeleton with its eight gates - the validator is the half that protects the corpus and can land safely alone, and the orchestrator is better authored alongside the first real stage.'

  - id: SA-107
    title: the-queue-is-a-drawer-not-a-bar
    note: 'Founder 2026-08-19: audio was "clunky on the site in the areas that arent strictly the devotional", should "exist as a drawer que" that a reader can "add to" as they navigate, with playlists "stored in library", and the whole thing "tucked, but not invisible" plus a homepage callout (F-153). THE BAR IS GONE. GlobalAudioBar is DELETED - a full-width card pinned across the bottom of every page announced itself constantly and pushed against the written content the site is for, which is the opposite of the posture. AudioDrawer replaces it as a HANDLE: a compact pill carrying the title, one play control, and +N for what is behind it; tapping opens the queue as a drawer. NOT INVISIBLE IS A SET OF DECISIONS, not a slogan - the handle exists whenever a queue does, its three bars animate ONLY while audio is actually sounding and stop entirely under prefers-reduced-motion, and the count makes queue depth legible without opening anything. MARKUP CORRECTION CAUGHT IN REVIEW: the first draft nested the play control inside the expand button; a control inside a control is invalid and unreachable by keyboard, so they are siblings. ADDING IS QUIET: AddToQueue is the + every studied queue puts on a browse row (NYTimes Audio, Apple Podcasts Play Next) and it never starts playback, never navigates, and never takes over from what is sounding - it confirms briefly because an add with no feedback reads as a dead button. On a series day it is a SIBLING OF THE LINK, positioned in the cell, never inside it - a button nested in an anchor is invalid and unreachable, which is exactly why the previous pass left this undone rather than forcing it. PLAYLISTS ARE KEPT IN THE LIBRARY, per the founder, OVERRULING the earlier strategy argument that named playlists are not worth building at 98 hours of catalogue. What follows from his ruling is that saving must be CHEAP: one tap in the drawer on whatever is already queued, never a create-then-fill flow nobody finishes. SavedPlaylists renders nothing until one exists, because an empty shelf explaining an unused feature is clutter. HOMEPAGE CALLOUT: tucked with no announcement is just hidden, so the homepage now says audio exists - leading with the OCCASION rather than the feature (what a listener wants to know is that it works while their hands are busy) and stating the catalogue hours COMPUTED FROM THE MANIFEST so the claim cannot drift from what renders. STILL OPEN: /today has no Listen affordance; and the founder asked for PROPOSED HOMEPAGE LAYOUTS - the information flow, the story of the site, and why a user would want to be here - which is a proposal, deliberately not built.'

  - id: SA-108
    title: today-listens-from-where-you-are
    note: 'Founder 2026-08-19: "fix the /today listen affordance next" (F-154). LISTEN FROM HERE now sits in the curated-active action row on /today, and the queue BEGINS at the day on screen rather than moving a cursor through the whole series - queueFromDay DROPS the days already behind the reader, because /today means your PLACE in a series and offering to replay day one when someone is on day four is a different, worse product. Two behaviours are deliberate and tested: an unnarrated day mid-series returns the WHOLE series rather than nothing, so one gap cannot silence everything after it; and the control renders NOTHING when no remaining day is narrated, rather than offering a button that plays silence. THE PLAN PATH DELIBERATELY GETS NO LISTEN CONTROL, and that is a finding rather than an omission. A Soul Audit plan day is DayContent - generated per reader by curated-builder out of the curation engine, reference volumes and series metadata. It carries no devotional slug, is not lifted from any file in public/devotionals/, and has never been narrated, so no track exists. The tempting move is to offer the audio of the series the plan was DRAWN FROM (PlanRecord.series_slug); that would play DIFFERENT WORDS THAN THE ONES ON SCREEN, which is worse than no button - a reader would follow along and find the voice reading something else. On-demand rendering for generated days remains open question #6 in the engine research and stays deferred. NOTE ON THE SUITE: narration-manifest-current fails on bible-365-day-2 pending the parallel session''s re-score; those files are theirs and were not touched.'

  - id: SA-109
    title: audio-gets-its-own-area-and-gets-out-of-the-way
    note: 'Founder 2026-08-19, correcting the previous pass: "the listen and what are you doing on the Series page should not be ther. Audio should be a seperate area (sidebar) non intrusive. This placement is extremely intrusive." (F-155). HE WAS RIGHT AND THE ERROR IS WORTH NAMING: the earlier work put a bordered Listen CTA in the series meta-action row and a full How-long-have-you-got picker above the series shelves. Both were reasoned from real research - every audio product studied on Mobbin puts play beside read - but that research came from AUDIO-FIRST products. This is a reading site with audio in it, and copying the placement copied a posture that does not belong. A pattern being correct in its own category is not an argument for it here. BOTH REMOVED from the series pages; nothing about audio is injected into a browse surface any more. AUDIO NOW HAS EXACTLY ONE HOME: a right-anchored sidebar, full height, on anything with room for it; a bottom sheet on a phone, because a right sidebar at 375px is a full-screen panel anyway and the thumb is at the bottom. DISCOVERY MOVED INSIDE IT - the picker is a compact section rather than a surface, losing its rule, display heading and vertical rhythm, because inside audio''s own area it is a section and not a headline. THE CONSEQUENCE THAT HAD TO BE DESIGNED FOR: removing the picker from /series removed the only way in, so the sidebar can no longer require something to be playing - it opens with an EMPTY queue, hides transport and queue controls when there is nothing to control, and the homepage callout button now OPENS it rather than navigating. panelOpen is deliberately NOT persisted: a sidebar that reopens itself on every load is the same intrusion in another form. WHAT STAYED, deliberately: the small + on a series day row, because that is how a reader adds while navigating and the founder asked for it explicitly - one icon in a card corner is not the intrusion he objected to; and the tucked handle, which appears only when something is queued and is the thing that makes audio not-invisible.'

  - id: SA-110
    title: audio-is-reachable-from-every-page
    note: 'Founder, immediately after SA-109 shipped: "wait I should be able to access the audio player on everypage right?" He could not, and the regression was MINE (F-156). SA-109 correctly moved discovery off /series and into the sidebar, but the sidebar could only be opened by the tucked handle and the handle requires something already queued (!!item && started). So with an EMPTY QUEUE the entire site had exactly one entry point - the homepage callout. On /series, /today, /daily-bread or any devotional there was no way to reach audio at all. THE LESSON WORTH KEEPING: removing an intrusion without replacing its FUNCTION is a regression, not a fix. The picker was in the wrong place and was also, at that moment, the only way in. THE FIX is an audio control in the masthead utilities tier beside search and theme, on both the desktop utilities row and the mobile topbar row. That tier is right for three reasons: it renders on all 27 shell pages, it costs no vertical space and interrupts no reading, and SA-024 already established that global utilities belong there rather than in the mobile tab bar - this follows that ruling rather than reopening it. A DOT MARKS A LIVE QUEUE: present only when something is queued, pulsing only while playing, stopped entirely under prefers-reduced-motion. That meets the not-invisible requirement without the control ever being loud - quiet when there is nothing to return to, legible the moment there is. The dot is positioned absolutely rather than drawn with a pseudo-element, because EditorialMotionSystem claims ::after on .mock-paper controls at runtime and any ::after geometry there un-collapses a hidden underline into a painted slab.'

  - id: SA-112
    title: the-sidebar-was-invisible-to-ad-blockers
    note: 'The audio sidebar shipped invisible to anyone with an ad blocker, and every automated check passed while it was broken (F-155). Founder: "when I click audio button the playlist que drawer should slide out." It did not. THE CAUSE: the sidebar container class was .ad-root. Ad blockers ship cosmetic filters matching that exact string and inject display:none !important from the USER ORIGIN - which beats author !important, beats an inline style set from JS, and never appears in document.styleSheets, so nothing on the page can see it or override it. That is why the diagnosis took several passes: the element was in the DOM, attached, with correct computed position and z-index, and NO matching rule could be found anywhere. MEASURED IN CHROME AGAINST PRODUCTION: a bare div appended to body computes display:block; the identical div classed ad-root computes none; ad-drawer, ad-handle, adx-root, banner-ad and sponsored are all untouched - it is that one string on a filter list. FIX: every class in the component is prefixed lsn- instead. THE LESSON, which is bigger than this bug: 24 unit tests passed against this component, including one asserting the drawer opens on click, and jsdom has no ad blocker so none of them could ever have caught it. What caught it was opening the deployed page in a real browser and clicking the button. For anything user-facing, a green suite is not evidence that a reader can use the feature.'

  - id: SA-111
    title: unmark-completion-and-one-day-source
    note: 'Founder-directed 2026-08-19 (F-157). A COMPLETION YOU CAN TAKE BACK. Founder: ''i accidentally marked one and now cant go back''. Marking a day read wrote to THREE places - localStorage, the account''s user_progress row, and active_series.current_day - and NONE HAD AN INVERSE: no unmark function, no DELETE on /api/reading-progress, no repository delete. An action a person can take by accident, on a surface built for one-handed use at 6am, needs a way back, or the product is telling the reader their mistake is permanent on every device they own. FIX: the whole chain in reverse - deleteReadingCompletion (repository), DELETE /api/reading-progress?devotionalSlug= (API, same auth/rate-limit/slug validation as POST), removeReadingCompletion (sync), rewindActiveDayAfterUnmark (day), unmarkDevotionalComplete (progress), and MARK AS UNREAD on both readers. LOCAL-ONLY REMOVAL WOULD HAVE BEEN WORSE THAN NOTHING: the next reconcile pulls the completion back, so an undo that stopped at localStorage is not an undo, it is a delay. The day rewind only ever moves BACKWARD and only for the active series - un-marking a day the reader is already past changes nothing, they are re-reading and their place is theirs. Deleting rather than tombstoning: user_progress answers ''has this been read'' and a row saying ''no'' is the same as no row, except it would then have to be filtered out of every count, standing and reconcile; the reconcile already treats absence as not-read. The control is offered QUIETLY - a text link, not a second CTA - because undo should be findable, not competing with the thing it undoes. A SECOND BUG FOUND IN THE SAME PASS: the Library had TWO SOURCES OF TRUTH IN ONE VIEW. The ACTIVE card resolved CONTINUE from the server''s active_series.current_day while the SAVED cards resolved theirs from actual completions; those agree until they do not - a failed server write, or days finished out of order - and then two cards in one view point at DIFFERENT DAYS FOR THE SAME SERIES, which is worse than either answer alone. Completions now win everywhere with the server day as fallback, because completions are the reader''s own record and the thing they can actually see. VERIFIED by 6 tests: un-marks and stops reading as read; OTHER DAYS UNTOUCHED (undo is not a reset); the account removal is attempted; the day rewind is attempted; un-marking something never marked is a QUIET NO-OP rather than a spurious write; and the removal is PERSISTED so it survives a reload.'

  - id: SA-114
    title: finished-state-preview-7am-flip-admin-backend
    note: 'Founder-directed 2026-08-19 (F-158). THE PAPER PREVIEWS IN ITS FINISHED STATE, FLIPS AT 7AM, AND THE FOUNDER CAN EDIT IT. Founder: "I need to be able to preview both the next days Daily Bread, as well as Next weeks devotional as browser drafts, meaning in the finished state on the browser so I can see exactly what it will look like - but with approve and reject still around each piece needing approval. I want a link in my settings to all the admin backend stuff. Go ahead and give me a backend so I can easily make edits myself." Two constraints: "only I should be able to see drafts", and the go-live rule as CORRECTED - "no the new daily bread goes live at 7 everyday. the weekly devotional goes live 7 am monday" (supersedes the 3am formulation from earlier the same night). SILENCE PUBLISHES: an unrejected draft prints when its edition goes live; rejection is the veto; approval is optional confidence, not a gate. ARCHITECTURE: (1) ONE COMPONENT RENDERS THE PAPER TWICE - the whole edition extracted to src/components/edition/EditionPage.tsx; /daily-bread renders it live and /admin/preview/daily-bread renders it with preview chrome, so the preview can NEVER drift from what readers see, because it is not a copy of the page, it IS the page. (2) THE 7AM FLIP is read-time, not cron: effectiveEditionDate() computes the current edition in America/New_York (DST-safe via Intl shortOffset); before 7am ET the site serves yesterday''s paper, at 7am the new edition prints and its unrejected drafts print with it (draftIsLive/getLiveEdition in src/lib/edition/deadline.ts). No scheduler to fail, nothing to deploy at 7am - the boundary is enforced by every read. (3) MONDAY 7AM SERIES RELEASE (.github/workflows/monday-release.yml): GitHub cron speaks UTC only, so DUAL crons (11:05 + 12:05 UTC Monday) with an ET-hour guard let exactly ONE through at 7am ET year-round; it merges the newest open reading-gate PR on series/auto-* (the founder''s veto is closing the PR) and deploys itself, because merges by GITHUB_TOKEN never trigger other workflows (GitHub anti-recursion) and the push->deploy integration is unreliable anyway. Deploy is gated LOUDLY on CLOUDFLARE_API_TOKEN - merged-but-not-deployed announces itself with the exact fix steps. (4) A REAL BACKEND: /admin rewritten from a mockup (fake "12 pending submissions", fake $2,140) to an honest hub with live draft counts and visible failure states; PATCH /api/admin/edition edits a draft in place (validated by the real validateEditionItem, 409 on non-draft including the compare-and-set race); the queue gets Edit per card - prose fields for authored leads, JSON for everything else; Settings shows an ADMIN card only when the admin probe returns 200. (5) ONLY THE FOUNDER SEES DRAFTS: the preview route re-asserts ADMIN_EMAIL_ALLOWLIST itself and 404s everyone else - defense in depth over trusting one gate. RENUMBERING NOTE: built citing SA-111/F-157, then SA-113/F-158, and renumbered TWICE in one night as parallel sessions recorded SA-111 (unmark-completion) and SA-113 (hero rotation); the wip commits f25e27ab/ccd25937/6b926407 citing "SA-111 intermediate" belong to THIS decision.'

  - id: SA-115
    title: one-audio-element-site-wide
    note: 'Founder invoked the test-driven-development skill; this is the first audio work in the sequence written test-first, and the process caught what review had not (F-160). THE DEFECT: GlobalAudioHost mounts an <audio> in the root layout so playback survives a route change, and NarrationPlayer rendered its own as well - so a devotional page carried TWO independent playback engines. Whichever element a control happened to hold was the one that answered, and a queue sounding through the global element kept playing when the reader pressed play on its own. There is no arrangement of two media elements that behaves correctly. Logged open at SA-097 and left open through five subsequent decisions. RED: a test rendering host and reader together, asserting one <audio> in the document, failed with expected 2 to have length 1 - the right failure for the right reason. GREEN: NarrationPlayer ADOPTS the layout''s element via useSyncExternalStore(subscribeAudioElement, getAudioElement) and keeps audioRef pointed at it, so all thirty-odd existing audioRef.current call sites work unchanged; the element''s JSX props became listeners because the element belongs to the layout now and the panel is a view onto it; src is assigned only when it differs so arriving on a reading already sounding does not restart it; and loadedmetadata is invoked directly when the element is adopted mid-life because that event will never fire again. WHAT THE ALL-TESTS-PASS GATE CAUGHT, and this is the part worth keeping: FIFTEEN existing tests broke. They rendered the reader alone, and with no host there was no element to adopt - a real consequence, since the reader now depends on the layout providing the element. Their SETUP was updated to mount the host; their ASSERTIONS were not touched. Two were the exception and are recorded honestly: they proved fell-back-to-speech by asserting NO <audio> existed, a proxy that is dead now the element is always present, so they assert the real thing instead - a player rendered but without the seek slider that only narration has. STANDING LESSON from the preceding ad-blocker bug, applied here: a green suite is not evidence a reader can use the feature, so this was verified in a real browser as well.'

  - id: SA-116
    title: audio-breadth-axis-and-the-continuity-bug-that-moved
    note: 'Founder-directed 2026-08-19 (F-161). Founder handed "The Listening Plan" to the executing-plans skill and selected every option offered back. THE PLAN WAS STALE AND SAYING SO WAS THE WORK: dated 19 August, second draft, "Nothing built yet", while EIGHT OF ITS NINE STAGES had shipped the same day under SA-098 and SA-104..SA-115 - R2, the global element, the bar, queues, the library, the voiced Edition, the occasion picker, downloads. Executing it as written would have rebuilt shipped work. Two of its three named continuity bugs were already fixed: the throttle is per-track (lastPushAt is a Map), and the finish handler''s seconds:0 is deliberate because it carries ended:true alongside. (1) THE THIRD BUG SURVIVED BY MOVING, NOT BY BEING MISSED. NarrationPlayer has saved on pagehide + visibilitychange since it owned the element; SA-115 hoisted playback into GlobalAudioHost and the handler did not come with it. Everything played outside the reader panel - drawer queue, occasion picker, /today, the Edition - could lose up to 30s of position on tab close or a phone being locked. Fixed with the same two handlers, guarded on having actually played so that merely loading the site cannot write a row at position 0 and count an open as a listen. (2) listenedDelta WAS HARD-CODED 0 at both of the host''s push sites, so anything played outside the reader accumulated NO listening total at all. Now real elapsed playback, clamped delta>0 && delta<2 - deliberately identical arithmetic to NarrationPlayer, because two accumulators answering "was that listening?" differently would eventually disagree and the account would hold a number neither could explain. (3) pushPosition NOW REPORTS WHETHER THE ACCOUNT TOOK THE WRITE. It returned void, so callers cleared their accumulator whether or not the server had it; the interval runs every 5s against a 30s throttle, so the listening total was discarding roughly FIVE OF EVERY SIX TICKS. Both call sites now clear only on true. (4) THE BREADTH AXIS: src/lib/audio/formats.ts introduces the missing noun. The system knew two shapes of audio - a devotional read aloud and a scripture day read aloud, both ~11 minutes, both discovered through SERIES_DATA - and modelled neither. A format declares its length band, the activities it suits, and whether it is AUDIO-NATIVE (would be poor as reading; no restructuring of the devotional corpus produces it). (5) THE OFFICE, NIGHT AND LECTIO ARE DECLARED AND DELIBERATELY EMPTY. They are new writing and new recording. AUDIO_NATIVE_PIECES is [], deliveredPieces() returns [], every surface renders nothing - the same refusal SA-098 made when it would not pretend Stage 8 was built. A format populated with placeholder pieces to close a plan item is worse than an absent format. (6) SCRIPTURE-WHOLE IS REAL TODAY AND NOTHING WAS RECORDED TO MAKE IT SO. bible-365 is 365 DELIVERED tracks running in canonical order, so grouped by book it is long-form already: 45 consecutive runs across 31 books, 31 clearing 40 minutes, 26 inside the specified 40-90 band, longest Revelation at 93m - 46.1 hours of long-form. (An earlier draft of this note said 59 runs / 36 over 40 / five hours; those came from a crude strip-the-trailing-numbers grouping and are WRONG - the real parser rejects the non-book headings, which also correctly breaks the runs around them. Measured with the shipped implementation.) The occasion picker''s "an hour or more" returned nothing and now offers whole books, shortest first. It was always there, addressed a day at a time. (7) BOOK IDENTITY COMES FROM parseReference, THE SITE''S ONLY SCRIPTURE PARSER - correctness, not tidiness. The corpus carries thematic headings ("Sabbath", "Selected", "Amos, Hosea, Micah") that a naive strip-the-trailing-numbers split would offer a listener as books; lookupBookId rejects all three and a test pins it. (8) THE QUEUE IS THE LONG-FORM UNIT, NOT THE TRACK. Each item is still an 11-minute reading, so it still satisfies the per-piece ceiling, still resumes per track, and still survives being stopped halfway. One 90-minute file would do none of that. STILL OPEN AND NOT PRETENDED: the Office, Night and Lectio need the founder in front of a microphone; Decisions 04 (where the founder''s voice goes) and 06 (whether narration is disclosed as synthesised) are unanswered and 06 is a trust posture, not an engineering call.'

  - id: SA-117
    title: a-reading-registers-itself-so-it-can-be-paused
    note: 'Founder from live use: "the site should not be autoplaying.... and ther is no way to turn pause right now. the player didnt even detect the audio was playing." REPRODUCED IN CHROME AGAINST PRODUCTION (F-162): press play in a reading, navigate to /series, and paused=false with currentTime=30.1 - still sounding - while pauseControls is EMPTY. No way to stop it anywhere on the site. TWO CAUSES, BOTH MINE. (1) THE READER TOLD THE STORE NOTHING: it drove the shared element directly, and the drawer handle - which carries the only pause control outside the reader''s own panel - appears only when the store holds an item, so an empty queue meant no handle, no control, audio sounding on. (2) THE STALE SHELL: readers still on a cached build had the pre-SA-115 reader rendering its own <audio> alongside the host''s, so the visible controls drove one element while the other sounded - which is exactly "the player didn''t detect the audio was playing". It READS as autoplay because audio continues across navigation, which is the intended feature, while nothing on screen admits it is playing. FIX: a reading REGISTERS ITSELF on play, as a single-item queue, so the handle appears and carries a pause control on every route - but ONLY when it is not already the cursor, because pressing play inside a queue must not collapse that queue to one item. The host also had to learn to ADOPT AN ALREADY-LOADED SRC: registering makes its loader see a new item, and without a guard it would reassign src and load() on an element mid-playback, restarting the reading under the listener. WRITTEN TEST-FIRST per the founder''s TDD directive; RED was "expected [] to deeply equal [''has-track-day-1'']". STANDING LESSON REINFORCED: the suite was fully green while this bug was live on the site, because no test navigated away mid-playback. It was found by driving a real browser.'

  - id: SA-119
    title: the-sidebar-is-the-player
    note: 'Founder chose option A from three rendered mockups after saying "desktop sidebar should contain universal player" and, of the sidebar and the reader''s own panel, "both exist and basically are redundant" (F-164). He then clarified: "The sidebar (universal player) should also que other devotionals, not just the chapters" - because registering only the reading you pressed play on left Up Next permanently empty, a queue of one. TWO CHANGES, BOTH TEST-FIRST. (1) THE SIDEBAR CARRIES THE WHOLE PLAYER: a drag-to-position control with elapsed and remaining, a previous-in-queue step, and speed, sleep timer and chapters - reusing SpeedSheet, SleepTimer and NarrationChapters rather than rebuilding them. RED named the four missing controls by their accessible names. The sheets are actually rendered, not just the buttons: a control that opens nothing is worse than no control. (2) PLAYING A READING QUEUES ITS SERIES BEHIND IT via queueForReading, FROM that day rather than from day one, so day three does not offer to replay days one and two; it falls back to the reading alone when it belongs to no series, because a generated day is still a valid thing to be playing. RED was "expected 1 to be greater than 1". STILL OPEN AND HONESTLY INCOMPLETE: the reader''s panel is NOT yet slimmed to the single row option A calls for, so both surfaces still carry controls - the exact redundancy the founder objected to. Nothing is lost in this state and the suite is green at 2600, but option A is half done. TERMINOLOGY NOTE for future sessions: the founder does not use "transport"; say "the play controls".'

  - id: SA-120
    title: the-reading-panel-is-one-row
    note: 'The second half of option A, and the half SA-119 shipped without. Founder, of the audio sidebar and the reading''s own Audio Edition panel: "both exist and basically are redundant" - both carried speed, plus/minus 15 seconds, chapters and a sleep timer, both drove the same element, both showed the same position. Option A: "the sidebar becomes the full player... the reader panel shrinks to a single Listen row: play/pause, progress, duration. Anything more opens the sidebar." THE PANEL IS NOW ONE ROW: play/pause centred (the SA-058 placement, held by the empty first grid column), the progress control, time remaining, and beside them CLIPPING plus the way through to the sidebar. CLIPPING STAYS DELIBERATELY - it attaches a note to THIS reading at THIS timestamp, it is an act of reading rather than a player control, and it exists nowhere else; cutting it in the name of "one row" would have deleted a feature under cover of a layout decision. MOVING THE REST EXPOSED THREE FAULTS, all fixed here test-first, none of which mattered while the panel still carried working copies. (1) THE SIDEBAR''S SLEEP TIMER DID NOTHING: SA-119 gave it a chip and a sheet that opens and I called it done; it recorded the choice into state nothing read, so a reader who set fifteen minutes and put the phone down got the whole reading - worse than no timer, because they stop watching the clock. It now counts against a wall-clock end time and stops the reading, end-of-chapter included. (2) THE FADE MOVED WITH IT: the panel eased volume down over five seconds rather than cutting mid-sentence, which is the right behaviour for a sleep timer on a devotional, so it was ported rather than deleted. (3) THE SIDEBAR NEVER PERSISTED THE SKIP LENGTH and opened at 1x/15s regardless of what the reader had chosen - harmless while the panel was also a speed control, not harmless once the sidebar is the only one; it now reads and writes the same two keys. NOT VERIFIED IN A BROWSER: the Chrome available to this session cannot decode AAC-in-MP4 (a blob of known-good bytes fails instantly with a codec error), so playback could not be exercised end to end. The layout and the sidebar were checked live; the sleep timer and the fade were not.'

  - id: SA-122
    title: player-carries-what-real-players-carry
    note: 'Founder: "the reader needs to be based on real world readers, you have a lotta missing features that are fairly standard for audio. players needs to be reworked based on research from mobbin... dont half ass it." EIGHT PLAYERS SURVEYED ON MOBBIN - Spotify Audiobooks, Apple Podcasts, ElevenReader, Headway, Blinkist, Finimize, Patreon, The Atlantic; full analysis with citations in docs/audio/PLAYER-GAP-ANALYSIS-2026-08-20.md. THE RESEARCH SETTLED THE SHAPE FIRST: Blinkist, The Atlantic, SCMP and Speechify all dock a slim bar over the text and keep the full player elsewhere, which is exactly option A (SA-120). So this is NOT a reversal - the finding is that the FULL player was under-furnished. SHIPPED: (1) VOLUME, carried by Apple Podcasts and ElevenReader, absent here, leaving desktop listeners with no in-page volume at all; hidden at pointer:coarse because iOS Safari ignores the volume property and a control that moves without doing anything is worse than none. (2) SHARE, the most-carried feature we lacked (4 of 8), system sheet where there is one and clipboard where there is not, with the button reading "Link copied" so the fallback is not silent. THE DEFECT THE RESEARCH TURNED UP: the CSP had NO media-src, confirmed live by a securitypolicyviolation event naming media-src with blockedURI blob and disposition enforce. Media therefore fell back to default-src ''self'', which does not cover blob:, blocking the offline path where the service worker synthesises 206 responses from cached bytes. CHANGELOG already claimed media-src named the R2 host; it did not. security.test.ts could never have caught it because it asserts against a hardcoded COPY of the header - the new test reads next.config.ts itself. CORRECTION TO SA-120: I reported that the browser could not decode AAC, on the evidence of a blob failing instantly. That blob was blocked by this CSP. The codec claim is WITHDRAWN. The same-origin track still stalls in that browser with no violation and no error, cause unknown, unreproduced on a real device. NOT BUILT AND WHY: cover art (7 of 8 lead with it) and section-level read-along (ElevenReader, Speechify, Headway, Blinkist) are real builds against a reading surface signed off hours earlier, and word-level read-along needs per-word timings the render pipeline does not emit; naming the narrator (ElevenReader "Oliver Silk", Speechify "MrBeast") is evidence for the founder''s PENDING ruling on disclosing synthesised narration and stays a recommendation.'

