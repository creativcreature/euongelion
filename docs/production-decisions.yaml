  - id: SA-018
    title: save-state-auth-model-anonymous-bookmarks-authed-annotations
    note: 'Amended 2026-06-09 (founder-authorized); was auth-required-for-persistent-save-state-actions. Bookmarks (save-for-later) now allowed anonymously, keyed by audit session token and merged to the account on sign-in; annotations (notes/highlights/stickies) remain sign-in-gated. See F-035 and CHANGELOG 2026-06-09.'
  - id: SA-019
    title: artwork-image-layer-full-bleed-heroes-inline-lightbox
