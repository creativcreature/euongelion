  - id: SA-037
    title: reader-declutter-nothing-above-the-devotional-title
    note: 'Founder-directed 2026-08-14 (F-088), reviewing he-cannot-deny-himself-day-5 "Between the Pieces": "Nothing above the individual devotional title should appear on page - all information above where this first appears on page is completely bogging down the reading experience." Measured before the change, the title did not appear on the first screen at all at 1280x900. (1) REMOVED from above the title on /devotional/[slug]: Breadcrumbs, the Substack cover banner, and DevotionalFolio - the folio being the vehicle that carried ChurchYearOverline onto every devotional. The church-year line belongs on the home page, unobtrusively; that placement is NOT yet done and remains open. (2) MOVED, NOT DELETED: the action row (back to series / share / substack) and DevotionalActions (start / save) now follow the reading - founder: "the links and such are needed, but the current implimentation is very clunky and buries the content". (3) REORDERED: DevotionalHeadline rendered scripture ABOVE the title; order is now title, dek, scripture. On mobile the art div precedes the text in DOM order, so a single order:2 in the existing max-width:900px block places the plate after the title. (4) ADDED: the day teaser renders as the standfirst through .devotional-headline-dek, a class present since the 2026-05-13 audit that no prop had ever fed. (5) THIS IS A REMOVAL AND REORDER, NOT A RESTYLE. A first attempt introduced a bespoke reader layout with its own type scale and was rejected - founder: "Your proposal ruins the actual site. I dint ask you to fully restyle the site, I asked you to remove items and reorder." Existing components, classes and type carry the change; the only CSS added is one order/border-side flip. Amends the F-083 page-cleanup scope of 2026-07-27. (6) NarrationPlayer control row wraps at 375px - five controls in a non-wrapping flex row broke LISTEN and CHAPTERS mid-word.'
  - id: SA-038
    title: highlighting-works-without-an-account-persistence-is-what-an-account-buys
    note: 'Founder-ruled 2026-08-14 (F-088): "I was signed in, but should work regardless, just not save to an account without an account." AMENDS SA-018 for highlights only. (1) THE MARK IS PAINTED FROM THE SELECTION, NOT FROM THE RESPONSE. applyHighlightMark previously ran only after response.ok, so any failure - including the 401 a signed-out reader always gets - produced no highlight and no message at all. The mark is now applied immediately on press and never waits on the network. (2) AN ACCOUNT DECIDES PERSISTENCE, NOT VISIBILITY. Signed-in highlights POST to /api/annotations and rehydrate on load exactly as before; signed-out highlights are visible for the session and are told "Sign in to keep this" rather than being redirected out of the reading mid-page. The redirect-to-sign-in on AUTH_REQUIRED_SAVE_STATE is removed for highlights. (3) SA-018 OTHERWISE STANDS: notes and stickies remain sign-in-gated, and nothing about what is stored server-side changed - anonymous highlights are not written to the database. (4) NO SILENT RETURNS in this path. Three existed: a missing range closed the toolbar silently (and the scroll handler clears that range in ordinary use), a non-auth error returned with no message, and a mark that wrapped an empty range rendered invisibly. All three now report on the toolbar button. (5) The CSS was never at fault - injecting the exact mark into the live page computes rgba(246,223,128,0.54). Diagnosis before fixing, per the standing rule.'
  - id: SA-039
    title: saving-is-series-level-and-anonymous-highlights-are-kept-on-device
    note: 'Founder-directed 2026-08-14 (F-088): "User should save a devotional series, not individual devotional. Right now a user has to save each individual devotional in a series for it to appear in the library which is incorrect." (1) THE UNIT OF SAVING IS THE SERIES. SAVE SERIES stores the SERIES slug; the reader no longer saves one day at a time. Both save surfaces changed - DevotionalActions on /devotional/[slug] and CuratedActiveView on /daily-bread. (2) NO MIGRATION WAS NEEDED, AND NONE WAS TAKEN. /api/bookmarks validates slug SAFETY, not that a slug names a devotional, so a series slug stores in the existing session_bookmarks row shape. This deliberately avoids adding a fourth unapplied migration behind the three billing migrations still pending before GENERATION_GATE_LIVE, and avoids prod DDL, which needs founder-named approval. If a dedicated saved_series table is wanted later the API surface does not change. (3) EXISTING ROWS ROLL UP RATHER THAN BEING REWRITTEN. A saved day slug counts as its series being saved - the auto-migration the founder asked for, achieved by reading rather than by mutating anyone library. Nothing is deleted; no backfill runs. Unsaving a series clears the series row AND every legacy day row for it, or the shelf would keep showing a removed series. __tests__/series-save.test.ts pins this, including the identity-crisis to identity rename. (4) THE LIBRARY SHELVES BY SERIES: a saved series links to /series/<slug> (the /devotional/<series-slug> route is a 404) and reads "Whole series, N days". (5) ANONYMOUS HIGHLIGHTS ARE KEPT ON THE DEVICE. Amends SA-038 point 2: a highlight made without an account is written to localStorage and restored on load, deduped against server rows so a since-signed-in reader does not see a passage marked twice. It is still NOT written to the database - SA-018 line on persistence-to-an-account holds. Verified: highlight, reload, one mark survives.'
  - id: SA-042
    title: study-chat-needs-a-workers-safe-devotional-loader-and-highlights-must-be-visible
    note: 'Founder-reported 2026-08-15 (F-089): "We need to address the on page chat. It doesnt work at all" and "the highlighting still doesnt work". (1) STUDY CHAT WAS DEAD IN PRODUCTION AND ONLY IN PRODUCTION. buildDevotionalDocs() enumerates devotionals with fs.readdirSync on public/devotionals. Cloudflare Workers has no filesystem, so the canonical RAG index carried zero devotional docs there, findDevotionalDocs returned [], hasDevotionalContext was false, and every request 400d with "Devotional context is unavailable for this page" before reaching a model. Reference docs already had a Workers fallback; devotional docs never did. Chat therefore worked perfectly in npm run dev, which HAS a filesystem, and failed 100% in production - the asymmetry is why it shipped. FIX: devotionalToRagDocs(slug, data) split out of parseDevotionalFile so the doc-builder can run on a devotional fetched over the network, and findDevotionalDocs falls back to fetchTodayDevotional - the same Workers-safe loader the reader itself uses. STANDING RULE: any server code that reads public/ off disk is broken on Workers; verify in npm run preview (workerd), never in dev, because dev cannot reproduce it. (2) A HIGHLIGHT THAT CANNOT BE SEEN IS A BROKEN HIGHLIGHT. The mark was painting correctly after SA-038/SA-039 and was invisible: translucent rgba(246,223,128,0.54) over the #f0ece6 cream page composites to rgb(243,229,175) against rgb(240,236,230) paper. Light-mode highlighter colours are now opaque swatches with dark ink (YouVersion model); dark mode lifts 0.34 to 0.62. (3) PLAIN SELECTION IS WHITE ON BRAND COBALT. ::selection derived its background from the text colour, so in light mode selecting text looked like the text had gone dark rather than been selected. Now #1f2a8d with white ink, deliberately distinct from every highlighter colour so "selected" and "highlighted" are never confused.'
  - id: SA-043
    title: founder-voice-for-new-devotionals-michael-for-the-back-catalog
    note: 'Founder-directed 2026-08-14/15 (F-086). "Voice Master V-3 is what I want the devotionals to sound like"; "The entire sites voice needs the new voice. Start with the most recent chronologically uploaded and work your way back"; then, on cost: "leave michael for the other ones". (1) TWO VOICES, SPLIT BY RECENCY, NOT BY QUALITY. The founder''s cloned voice (ElevenLabs IVC, model eleven_v3, stability 0.5) carries the he-cannot-deny-himself series and every NEW devotional from here. Kokoro am_michael keeps the ~500-devotional back catalog. The split is economic and it is sound: the whole catalog is 5.01M characters against 691k credits a month, but a new devotional averages 9,487 characters, so the Pro plan covers 72 new devotionals a month against a publishing rate of about seven. Converting the back catalog would buy little and cost months. (2) THE CLONE IS BUILT FROM THE CONFIRMED MASTER, NOT FROM CLIPS. The first clone was built from 12 mp3 clips totalling 3.5 MINUTES, which is why it invented prosody and mispronounced him: an IVC learns timbre from that much audio and nothing else. It is now built from 4CH012I.wav, 24.3 min uncompressed, one mic, one room, verified as him alone by pitch distribution (91% of voiced frames under 120 Hz, single mode). The founder confirmed the file by path; filenames were NOT trusted to identify a recording. Neither model choice nor stability could fix what was a data problem - eleven_multilingual_v2 at stability 0.8 traded an inaccurate performance for an inaccurate monotone. (3) HEADINGS AND SUBTITLES ARE SPOKEN; PULL QUOTES ARE NOT. A reader SEES where a section starts, a listener cannot, so 2,242 module headings and the day''s subtitle are now read - they were classed as labels and left silent, which stripped every devotional of audible structure. Pull quotes go the other way: all 66 duplicate body prose verbatim, so spoken they are a stutter. Also fixed: 49 Greek Extended glyphs (U+1F00-U+1FFF, outside the old strip range) were being handed to the voice in 11 devotionals, and a one-word title ("Contentment") was dropped by the minimum-length floor. (4) THE RENDERER AND THE ON-PAGE READER ARE HELD AT EXACT PARITY BY A FINGERPRINT. narration_extract.py and src/lib/audio/segments.ts had drifted on 103 of 533 devotionals. They now agree on all 533, and each track stores a SHA-1 of the text it actually speaks, which the reader recomputes. That turns "does the audio match the page" from a manual sweep into a test, and makes the catalog renderer skip only tracks that are still current - an edited devotional re-renders instead of keeping stale audio. (5) CHAPTERS ARE MEASURED, NEVER ESTIMATED. Request chunks are cut at module boundaries as well as segment boundaries, so every module starts a chunk and its start time is the exact sum of the durations before it. Billing is per character, so the extra requests cost nothing. (6) THE ELEVENLABS TRAP: A KEY CARRIES ITS OWN QUOTA. Days 4-7 failed with repeated HTTP 401 while the account held 641,765 credits and /v1/user authenticated fine. The key itself was capped at 50,000. The status code alone reads as a bad key; only the response BODY says quota_exceeded. Log the body on every non-200. (7) NEVER PAY TWICE FOR THE SAME AUDIO. That failure discarded 13 completed chunks of day 4. Chunks are now cached by (voice, model, settings, text) hash, retries back off across about six minutes, and one failed devotional no longer aborts the ones after it.'
  - id: SA-045
    title: one-daily-bread-nav-entry-and-daily-bread-leads-with-artwork
    note: 'Founder-directed 2026-08-15 (F-091): "Daily Bread and Today are the same menu item. remove the redundancy, instead of calling it today, call the item Daily Bread." and "the layout on daily bread/today is incorrect". (1) ONE NAME, ONE DESTINATION. DESKTOP_NAV_ITEMS carried both { /daily-bread, TODAY } and { /daily-bread, DAILY BREAD } - the same href twice - so the active-state check lit BOTH at once and the nav read as a rendering fault. The TODAY entry is removed and the mobile tab is relabelled DAILY BREAD. SA-033 is unchanged and still correct: "today" means YOUR devotional resolved through Daily Bread, not the /today editorial rotation, which stays reachable as "Today Edition" in the footer. The /today route itself is untouched so existing links keep working. (2) DAILY BREAD LEADS WITH ARTWORK. Every devotional opens with DevotionalHeadline - plate left, title/standfirst/scripture right - while /daily-bread empty state hand-rolled its own markup with NO image, so the two surfaces did not read as one product. It now renders the same component fed by getSeriesHero(). Founder reference for correct layout: /devotional/community-day-1. (3) OPEN, NOT ACTIONED: 31 of 37 series hero images are the wrong aspect for the headline slot (aspect-ratio 1408/768, object-fit cover). 28 are square 1024x1024 and 3 are portrait, so they are hard-cropped and lose ~45% of height; community-day-1 looks right precisely because its plate is natively 1408x768. That is an ASSET problem, not a layout one, and the remedy - regenerate ~31 landscape plates through the devo-go riso pipeline, derive 16:9 crops from the square masters, or accept the crop - is a founder call with real cost.'
  - id: SA-048
    title: chat-message-list-must-scroll-and-composer-must-stay-visible
    note: 'Founder-reported 2026-08-15 (F-093): "the chat needs to have its seperate scroll wheel, as I cannot access the content the chat wrote out as its below my visibility." The message list carried flex-1 overflow-y-auto, which LOOKS correct and was not: a flex child inherits min-height auto and refuses to shrink below its content, so the list GREW to fit the reply and overflow-y never engaged. Everything below it - including the composer - was pushed past the bottom of the window. Measured with 3000px injected, before: clientHeight 3145, scrollHeight 3145, scrolls false, composer off-screen, viewport 900. After min-h-0 on the panel grid, the conversation column AND the scroller: clientHeight 541, scrollHeight 3145, scrolls true, composer visible. STANDING RULE: fixing only the scroller is insufficient - an unconstrained flex/grid ancestor passes its full content height down, so the child never has a bounded box to scroll inside. Every ancestor in the chain needs min-h-0. __tests__/chat-scroll-contract.test.ts pins all three and fails if any future flex-1 overflow-y-auto is added without the guard. SEPARATE AND UNRESOLVED: study chat takes 18-19s per reply against the 30s Workers wall-clock ceiling (measured twice on production: 18.0s, 19.3s) and returned a 504 in-browser during this work. The likely contributor is getCanonicalRagIndex loading the full 15MB reference-index.json on cold start; CLAUDE.md documents a 3.2MB reference-index-slim.json for exactly this purpose and that file does not exist in the repo.'
  - id: SA-075
    title: rekindled-three-plate-motion-arc-anchored-to-verified-cinema-stills
    note: 'Founder-directed 2026-08-16/17 (F-119), building the Rekindled series. (1) THREE PLATES PER DAY, COMPOSED FOR MOTION. Founder: "create an 3 image arch per day... that tell a stroy arch with each other" and "I want these to read maybe a bit more cinematically in tonal quality and subject focus to make very well crafted motion stills. The motion needs to be considered in the creation of the images." Full scope is a storyboard for future YouTube episodes. Every subject line now names ONE moving element, its direction of travel, and the static anchors. Every motion assigned is a naturally looping phenomenon - flame, smoke, heat shimmer, water, cloth, dust, ember glow. Moving figures were excluded because they do not loop. (2) HIGGSFIELD IS UN-RETIRED FOR VIDEO ONLY, AND IS IMAGE-FIRST. Founder: "Higgsfield is video only- and the video must start with the image. The image must be made using /imagen skill through codex as a subagent." This partially reverses the CLAUDE.md retirement, which stands for generation. Stills come from Codex''s BUILT-IN image_gen via ~/.agents/skills/imagen (ChatGPT subscription, no per-image billing); the fallback CLI at ~/.codex/skills/.system/imagegen/scripts/image_gen.py remains BANNED and every Codex prompt pins the built-in path explicitly. (3) COMPOSITIONS ARE ANCHORED TO REAL, VERIFIED CINEMA STILLS. Three generations were rejected first. v1 flat/poster was not composed for motion. v2 added abstract cinematic language and band compliance COLLAPSED 8/22 to 3/22, because cinematic depth staging IS tonal mass; founder verdict "too fake looking and fabricated". v3 used paintings recalled from memory and was killed before generating on the founder''s instruction to "literally research cenima stills". v4 anchors 20 of 22 plates to shots verified by downloading ~4,500 full-size frames across ~90 films and measuring them numerically, because WebSearch was exhausted and every engine CAPTCHA-blocked - falling back to memory was rejected as the one unacceptable outcome. TWO BRIEFS CAME BACK UNMATCHED AND ARE MARKED AS ADAPTATIONS IN THE PROMPTS THEMSELVES rather than faked: a two-pairs-of-hands lamp handover, and a town as scattered window-lights. (4) COVERAGE BANDS RECALIBRATED FOR CINEMATIC WORK, SUPERSEDING THE SA-052 NUMBERS: AIRY 25-45%, MID 50-70%, DENSE 75-92% with a hard 92% ceiling, and STANDARD DEVIATION retained as the real gate. The rejected 33-plate set measured sd 9.7; the approved set 26.8; this set 26.2. Absolute band compliance was made obsolete by the founder''s own direction; spread was not. (5) SPLIT HEADER, NOT YET BUILT. Founder wants the header still for thumbnails and an animated version on the devotional page. The stills ship now; the heroMotion field and its component are NOT in this change and remain open. (6) MOTION CLIPS ARE HELD. Founder: "dont generate videos until I oke the first please." Zero Higgsfield calls have been made. One sample clip is to be approved before the remaining twenty run. (7) VERIFICATION THAT CHANGED THE CONTENT. Genesis 15:17 is a TORCH (lappid), not a lamp (ner) - KJV''s "burning lamp" is straining, so torch and lamp run as two threads rather than one. The real spine is one verb, kabah, in Lev 6:13 / 1 Sam 3:3 / Isa 42:3, rendered sbennymi in Matt 25:8 - the command and the promise are the same word. The bereshit letter pattern IS attested (Midrash Aggadah ed. Buber 1894, Gen 1:1:6) but is MEDIEVAL, means circumcision/Sabbath and Torah rather than the Genesis 15 covenant, and the Baal HaTurim attribution circulating online is FALSE. Three misattributed quotations were verified dead and excluded. The Confessions V.viii.15 line as popularly quoted is a paraphrase in no published translation, and its bishop is never named. (8) EXCLUDED FROM THE SITE BY FOUNDER RULING: the founder''s friend''s brother, who turned to Christ three days before dying. Room-only; the public day uses Monica and Augustine instead. Verbatim account archived outside the repo.'
