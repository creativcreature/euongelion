  - id: SA-026
    title: custom-generation-account-gate-one-free-per-verified-account
    note: 'Founder-ratified 2026-07-10 (custom-generation brief Q&A). Soul Audit submit, 3-option review, and all curated reading remain anonymous and free forever. Bespoke (custom-generated) plans require a verified account; each new verified account receives exactly 1 free generation, then the paywall. Amends the anonymous-generation scope of SA-002/SA-018; SA-033 (no gate before reading a devotional) remains intact — the gate exists at exactly one moment: requesting a custom generation.'
  - id: SA-027
    title: paid-custom-generation-six-access-paths-subscription-primary
    note: 'Founder-ratified 2026-07-10. Locked pricing stands: $7/mo, $77/yr, $140/2yr, $200/3yr (Master Plan 0.2); the brief~s $4.99/$39/$99 figures are dead. Six entitlement doors into one generation pipeline, subscription emphasized as default: (1) subscription, (2) 1 free generation per verified account, (3) one-time credit packs, (4) BYOK in Settings only — amends the 2026-05-03 BYOK-tier rejection to a de-emphasized non-tier path, (5) MCP round-trip per docs/run/RESEARCH_OAUTH.md Option D, (6) gift/sponsor codes. The gospel and all curated content are never paywalled; only bespoke generation is gated. Build order: brief section 11 phases.'
  - id: SA-028
    title: billing-subscription-state-single-source-public-users
    note: 'Founder-ratified 2026-07-10 ("implement right fully — not half fixes"). Subscription/entitlement state has one source of truth: public.users (webhook-written subscription_tier plus new stripe_customer_id/stripe_subscription_id columns). All entitlement reads (billing/entitlements, chat quota, brain providers) move off Supabase Auth user_metadata onto the DB row. Customer mapping by stored Stripe IDs, not email match. Entitlement changes are driven by verified Stripe webhooks only, never client redirects; nightly reconciliation against Stripe.'
  - id: SA-029
    title: jabez-series-sabbath-first-week-shape-and-content-rulings
    note: 'Founder-ratified 2026-07-12 (Prayer of Jabez series build). (1) A prefab 7-day series starting on a Sunday opens with the Sabbath day (Day 1), followed by five deep-dive teaching days in the week chiasm A-B-C-B-prime-A-prime (Days 2-6) and closes with the Recap (Day 7) — reordering the AUTHORING-SPEC default (recap Day 6 / sabbath Day 7). (2) Recap days must carry Further-Your-Learning material equipping study beyond the series. (3) Prosperity-gospel misuse of a passage is confronted head-on, charitably and by name. (4) Founder reads the full text BEFORE any imagery is generated. (5) Series imagery generator: Higgsfield GPT Image 2, riso duotone per the founder mockup reference; videos must be official-channel and embeddable (inline playback, never embed-blocked). AMENDED 2026-07-22 (founder): the Jabez build process is ratified as THE standard for ALL prefab devotional builds, codified as the /devo-go skill (.claude/skills/devo-go/); deviations require a new registered ruling. Note: unrelated to the ad-hoc "SA-029/SA-030" fix labels in CHANGELOG 2026-05 (soul-audit debug session) — those were never registered decisions; this yaml is the canonical registry.'

  - id: SA-030
    title: two-minute-open-self-contained-devotional-head
    note: 'Founder-ratified 2026-07-22. FORWARD-ONLY (not retroactive to existing series, incl. prayer-of-jabez): every new prefab devotional day opens with a self-contained ~2-minute devotional — anchor Scripture as is, one vocab word, one reflection, one short prayer — followed by a DEEP DIVE CTA that jumps into the full devotional on the same page; after the CTA, the deep dive proceeds per the usual A-B-C-B-prime-A-prime structure (SA-029 / AUTHORING-SPEC). The 2-minute block is complete on its own: a reader who stops at the CTA has had a whole devotional. Enforced opt-in by the validator when a day declares format: two-minute-open. Codified in the /devo-go skill. Note: unrelated to the ad-hoc "SA-030" fix label in CHANGELOG 2026-05 — never a registered decision; this yaml is canonical.'

  - id: SA-031
    title: harvest-series-featured-area-policy-and-uninterrupted-pipeline
    note: 'Founder-ratified 2026-07-26 (The Harvest series build, F-082). (1) FEATURED-AREA POLICY: the homepage featured area shows exactly 7 series; the MAIN feature slot always belongs to the MOST RECENT series; too-busy-for-god rotated out for the-harvest. Supersedes the 2026-05-08 Bible-365-first featured direction. Applied in src/data/series.ts FEATURED_SERIES and src/data/series-rails.ts FEATURED_SERIES_SLUGS. (2) MONDAY-START SHAPE: a series starting Monday runs five deep-dive days (A-B-C-B-prime-A-prime, Days 1-5), Saturday Recap (Day 6), Sunday Sabbath close (Day 7) — the AUTHORING-SPEC default shape; SA-029(1) sabbath-first applies only to Sunday starts. (3) UNINTERRUPTED PIPELINE ("run the full pipeline please... no interruption. end to end", 2026-07-26): the /devo-go pipeline runs end-to-end without pausing at the SA-029(4) reading gate or the deploy-confirmation gate; the reading artifact is still published and all gates/evidence still run and are reported — they become non-blocking. Founder reviews live output and requests revisions after. This amends SA-029(4) and the devo-go skill gate order.'

  - id: SA-032
    title: harvest-v4-cluster-cross-testament-accuracy-and-account-resume
    note: 'Founder-ratified 2026-07-27 (The Harvest v4 + platform). (1) ACCOUNT-STATE RESUME: signing out must never lose reading state — the active devotional and any soul-audit plan follow the ACCOUNT (active_series user-keyed; devotional_plan_instances.owner_user_id stamped at sign-in and lazily on read), so signing back in resumes exactly where the reader left off on any device. Sign-out still clears local cookies. (2) PARABLE-CLUSTER RULE: a series seeded on a parable that Scripture groups in a discourse (Matthew 13 kingdom parables) covers the cluster as interrelated — the-harvest v4 spans Sower + Wheat-and-Weeds with Mustard/Leaven/Net woven in. (3) CROSS-TESTAMENT RULE (all prefab days, forward): NT-anchored days carry a real OT connection that day; OT-anchored days carry a NT connection; corpus-verbatim only. (4) IMAGERY ACCURACY GATE: every illustration fact-checked (botanical/historical/textual) against the claim it illustrates before placement — style-checking alone is insufficient (precedent: identical-formed-heads wheat/darnel plate, founder-caught in production). (5) REPETITION SWEEP: editor pass must count and thin cross-day recurring phrases before READY. Codified in the /devo-go skill.'

  - id: SA-033
    title: wake-up-mount-retirement-and-cleanup-pass-2
    note: 'Founder-standing orders executed 2026-07-27 ("keep going - finish and deploy everything"; wake-up pin 2026-07-12). (1) Legacy /wake-up/* double-mount RETIRED: shared readers relocated to canonical /devotional/[slug] and /series/[slug]; silo branching removed; permanent redirects preserve every old URL incl. the RSS feed path; footer/tab-bar/sitemap/error-boundary/sunday links swept. (2) Settings AI & KEYS repaired within SA-026: the mislabeled single key field split into honest Anthropic + OpenAI fields; Google (upstream model shut down)/MiniMax/NVIDIA picker options and key fields retired from the UI (router untouched). (3) Uncited fear-stat copy removed from identity/peace/hope series contexts per PUBLIC-FACING-LANGUAGE tone rules (SOURCE-OF-TRUTH open item #11). (4) Unwired soul-audit UI orphans removed; deferred infra (clarifier, phase-5 queue, voice-bank) and /design/imagery-samples deliberately KEPT.'

  - id: SA-034
    title: two-minute-open-v2-scripture-writeup-and-third-person-series-voice
    note: 'Founder-ratified 2026-08-10 (the he-cannot-deny-himself series build, F-085). (1) TWO-MINUTE-OPEN v2 — FORWARD-ONLY amendment to SA-030: the self-contained opening block gains a short write-up ABOUT the anchor scripture between the vocab word and the reflection, so the open teaches the passage instead of jumping from a word straight to a question. New sequence: scripture, vocab, teaching (~150-250 words), reflection, prayer, cta. Days declare format "two-minute-open-v2"; the validator enforces the six-module sequence AND that the DEEP DIVE cta targets #devotional-section-7 (section ids are 1-indexed over the module array). The five-module "two-minute-open" shipped in the-harvest remains valid and is NOT migrated; it is simply not used for new days. Codified in content/AUTHORING-SPEC.md and the /devo-go skill. (2) THIRD-PERSON SERIES VOICE: a founder may pin a series to third-person/first-person-plural narration, overriding the AUTHORING-SPEC section 2 voice table permission to use "you" in teaching/bridge/story/insight/vocab prose. reflection, prayer, takeaway, and interactive modules stay in direct address because the form IS address. Pinned for he-cannot-deny-himself; recorded in the series brief and enforced by an editor grep. (3) SEED-VS-ANCHOR: a passage the founder names as the week sentiment rather than the week text (here 1 Thessalonians 5:1-10) is honored as a secondary scripture and named in the recap, never promoted to anchor.'
  - id: SA-035
    title: prerendered-narration-complete-reading-contract-and-single-voice-lock
    note: 'Founder-driven 2026-08-11 (F-086). (1) AUDIO EDITION IS PRE-RENDERED, NOT SYNTHESISED. The Web Speech reader shipped in F-030 is demoted to a fallback for devotionals with no rendered track. `speechSynthesis` is not a media element, so Media Session cannot attach: no lock screen, no background playback, and iOS halts it when the screen sleeps. Listening while working was impossible by construction regardless of voice quality. Narration is now pre-rendered to AAC and played through a real <audio> element. (2) THE READING CONTRACT IS COMPLETE-BY-DEFAULT. Measured across 521 devotionals, the old fixed field list spoke a median 70.7% of each entry's distinct prose - about 252,000 words catalog-wide were never read, including every `profile` module. src/lib/audio/segments.ts now carries an ordered field list per module type PLUS a catch-all sweep, so a field appearing in only a handful of modules can never go silent; mirrored fields (teaching.content == teaching.body, identical in 1,410 of 1,422) are deduped rather than read twice. Result: +37.2% words spoken, median 1.37x, zero devotionals regressed. (3) NARRATOR IS A PRESET VOICE, NOT A FOUNDER CLONE. The clone path (Voicebox + qwen-TTS from interview audio) was abandoned on measurement: it could not reach narration pace by any lever - seeds moved rate +/-0.4 w/s, the `instruct` field is a confirmed no-op on the MLX path, and register-specific reference profiles changed pacing not at all - so every take needed an audible ~1.35x time-stretch. Two constants in the prototype spec were also wrong: the founder's 'natural rate' of 2.82 w/s is really 3.57, and take A3's reported 2.87 w/s measures 3.48, because v1 computed rate from API metadata instead of the audio it wrote. Canonical voice is Kokoro-82M `am_michael` at ~162 wpm. (4) ONE VOICE, MECHANICALLY ENFORCED. A catalog narrated by two voices is obvious to a listener and invisible to text-accuracy checks. spec/verify_voice_lock.py fails on any track that is not the canonical voice. (5) PRONUNCIATION OF GREEK/HEBREW TRANSLITERATIONS IS HUMAN-VERIFIED. Whisper was not trained on them and mangles them whatever the voice does, so the automated gate is invalid for exactly these terms. Overrides live in spec/pronunciation-overrides.json and alter only what is sent to the engine, never the devotional text, so the reading stays verbatim. The `pronunciation` field already in the content is NOT usable as-is: the engine reads its hyphens as breaks (KHEH-sed -> 'k-sad').'

  - id: SA-036
    title: commissioned-series-day-count-is-a-founder-input-not-an-assistant-inference
    note: 'Founder-corrected 2026-08-14 (F-087, the looking-at-the-sun series). This decision RECORDS A REVERSAL. The reading was first built and shipped as a SINGLE day on the assistant''s own inference from the phrasing of the request ("a devotional", "a link to the devo") plus a delivery date; the assistant then wrote that choice into this file as though it were policy. The founder rejected it the same day and the series was rebuilt clean-sheet as the full seven days. The rulings that stand are these. (1) DAY COUNT IS A REQUIRED FOUNDER INPUT AND IS NEVER INFERRED. /devo-go lists "passage/topic + day count + start day" among its required inputs and instructs the operator to lock the week shape via AskUserQuestion BEFORE writing anything. Skipping that gate is a process violation regardless of how reasonable the inference looks, and a reading commissioned for a named person is still a seven-day series unless the founder says otherwise. The default is seven. (2) DO NOT ENCODE AN ASSISTANT JUDGEMENT CALL AS A DECISION. production-decisions.yaml records founder rulings. Writing an unasked-for scope choice into it disguises a judgement call as policy and makes the drift harder to spot later; the prior text of this entry is the precedent for what not to do. (3) A CONVERSATION TRANSCRIPT IS A VALID CONTENT SEED, AND THE SPOKEN WORDS ARE THE SPINE. Source content came from a Granola meeting transcript (2026-08-13) in which the founder gave an impromptu five-minute reading. Every substantive move in the published week traces to something he actually said — wilderness as instruction rather than punishment, rest and grace, the Martha problem, "pay attention to what you pay attention to," running the race with endurance, and the sun image the series is named for. The transcript is the seed and the emotional spine; it is NOT a citation source, and every scriptural, lexical, historical and biographical claim was verified independently to the standard of any other build. The named recipient appears nowhere in the published text. (4) COMMISSIONED SERIES DO NOT TAKE THE HOMEPAGE FEATURE SLOT WITHOUT A RULING. SA-031(1) gives the main homepage feature to the most recent series. A series commissioned for one person enters SERIES_DATA and NEW_SERIES_ORDER, takes one editorially-appropriate /series rail placement, and leaves FEATURED_SERIES and HOMEPAGE_TODAY untouched unless the founder directs otherwise. Reach is by direct link. (5) THE IMAGERY ACCURACY GATE (SA-032) EXTENDS TO CAPTIONS. Where a library plate is right for the moment but wrong in a verifiable detail, the caption states the discrepancy rather than asserting the detail. Precedent set here: the rothem of 1 Kings 19 is a low desert shrub and the chosen plate renders a full-canopied tree, so the caption says so in parentheses. Silence would have been a false claim; discarding an otherwise correct plate over an incidental detail would have been waste. (6) VIDEO CHANNEL VERIFICATION IS NOT OPTIONAL. A re-upload (`iVwauTiyFjM`) carrying BibleProject''s exact title and content was caught by oEmbed reporting the channel as "Starry Night Elf" and was rejected; the official id is `_TzdEPuqgQg`. Confirms traps.md section 12 as a standing check rather than a historical note.'

  - id: SA-040
    title: devo-go-imagery-is-generated-through-the-locked-pipeline-never-selected-from-the-library
    note: 'Founder-rejected 2026-08-14 (F-087): "THE ARTWORK IS INCORRECT!!! YOU DIDNT USE THE DEVO-GO PROMPT FOR IMAGES!!" All ten looking-at-the-sun plates were replaced. (1) SELECTING FROM THE LIBRARY IS NOT THE IMAGERY STAGE. F-087 shipped with "images from the library only, nothing generated"; /devo-go references/imagery-and-video.md defines that stage as GENERATION through Higgsfield gpt_image_2. The library-first rule in CLAUDE.md governs incidental site imagery; a prefab series build runs the generation pipeline. (2) THE REFERENCE IMAGES ARE LOAD-BEARING AND MANDATORY. D-012 requires the empty-tomb hero (public/images/site/homepage/hero/header-v2.webp) be passed as medias role=image on EVERY generation, with a founder wokegodx plate for stipple and figure treatment. Text-only prompts drift, and the measurements show it: the rejected set carried 0.00 percent crimson across all ten, gold up to 34 percent as a co-dominant ink (day4-samaritan gold #da991d at 24 percent beat blue), blue collapsed to near-black navy #0e1d3e at delta 118-130 from ultramarine #1B3FAE, grays present against the no-grays rule, day1 rendered as a duotone photo-gradient and day4 as flat mid-century vector. Regenerated with references attached, all ten measure delta 36-62 and gold at or under 0.5 percent. (3) PASS THE ANCHOR FOR TECHNIQUE, NOT THE GOLD PLATES FOR COLOR. D-010 says study the founder references for shape and artistry and IGNORE color; the model cannot ignore color. Two of the five wokegodx plates are gold or orange dominant, and passing them invites the exact gold-flood failure being fixed. Pass the anchor hero for palette plus one figure plate for grain, and override its background in words. (4) THE FIGURE LOCK IS THE FIRST THING TO CHECK, NOT THE LAST. D-010 requires historically and regionally accurate figures and D-011/D-013 lock African/African-American; the rejected day4-samaritan rendered two Europeans. The first regeneration still produced a European Christ on day 5 and bleached Elijah to cream on day 3, because in a duotone strong light washes dark skin out. The clause that fixed it: skin STAYS dark cobalt dot density, the light rims him and never bleaches him to cream. (5) MEASURE, DO NOT EYEBALL. Every plate is sampled for dominant-blue distance from #1B3FAE and for crimson and gold pixel share before placement; the numbers caught what a glance would have called handsome. The style check follows the SA-032 fact check and both are mandatory. (6) FIX THE IMAGE, NOT THE CAPTION. SA-036(5) let a caption state a plate discrepancy because the plate was a fixed library asset. Under generation SA-032 governs instead: the rothem was re-rendered as the low broom shrub it actually is and the apology was struck from the caption.'

  - id: SA-041
    title: figures-are-identity-obscured-so-the-reader-can-stand-in-their-place
    note: 'Founder-directed 2026-08-14 (F-087), on the SA-040 replate: "supposed to be scientifically and historically accurate depictions if depicting literal people. And the aim is to obscure their identity more so so the reader can read themselves into the image. You nailed the style but not the subject." (1) ACCURACY AND ANONYMITY ARE TWO DIFFERENT AXES AND BOTH ARE REQUIRED. D-010 governs the DEPICTION: period-correct dress, correct anatomy and posture, correct setting, correct botany, African/African-American per D-011/D-013. THIS decision governs the IDENTITY: no rendered individual likeness. Satisfying the first does not satisfy the second, which is exactly how the SA-040 pass shipped four plates that were historically accurate and still wrong — they were portraits. (2) NO PORTRAITS. A devotional image is one the reader steps INTO, not one they look AT. Figures are seen from behind, turned away, bowed, cropped, wrapped, or read as bold graphic silhouettes with the face lost in shadow or swallowed by the light, edges dissolving into stipple. No eyes, no rendered facial features, no recognizable individual. This is not new direction so much as the governing form of what D-011 and D-013 already said in passing (chiaroscuro silhouettes; ONE bold African silhouette in vast negative space). (3) THE TEST IS WHETHER THE READER CAN BE THE PERSON. Day 3 is the reader lying wrapped under the broom; day 5 is the reader kneeling with an arm thrown over the eyes; the series card looks AT the sun WITH the figure rather than looking at the figure. The six plates that survived the correction survived because no face was visible in them: three figures walking away up the Emmaus road, feet on a track, hands on a scroll, and the three plates with no people at all. (4) SCOPE. Applies to literal named biblical people and to anonymous figures alike, on every narrative surface. Object and landscape plates are unaffected.'

  - id: SA-044
    title: active-day-is-shown-and-advanced-the-series-page-is-a-library-and-search-takes-phrasing
    note: 'Founder-directed 2026-08-14 (F-090), three asks in one night. (1) THE ACTIVE DEVOTIONAL SHOWS THE ACTIVE DAY. "The Active devotional should always show the active day as well. Not just default to day one. If I mark it done, the next day should show." Two independent halves were both missing. PATCH /api/devotionals/active has accepted a currentDay since 2026-05-14 and clamps it to the series length, but NO CLIENT EVER CALLED IT, so active_series.current_day sat where the series was started while completion accumulated only in localStorage. And the surfaces that did know the day linked past it: the library ACTIVE card printed "Day 3" above a button to a bare /daily-bread. markDevotionalComplete is now the single choke point that advances the server day, and src/lib/reading/active-day.ts owns both halves so they cannot drift apart again. It deliberately NEVER falls back to day 1 — an unresolvable day links to the SERIES page, because silently restarting someone three days in is what made the bug look like working software. "Next day" is the first INCOMPLETE day, not last-completed + 1, which skipped gaps when a reader went out of order. (2) THE SERIES PAGE IS A LIBRARY. "The series page needs revamp as series are hiding… function like a library of magazines, be more interactive and better searchable… 2 views, 1 is the full library alphabetical and sortable in various ways, and 2 is a list. actually add a feature style as well that shows it more bento box style." The rails view was the hiding mechanism: a handful of curated sideways shelves over 37 series meant anything in no rail was unreachable without switching views and knowing to look. Replaced by FEATURE (bento, newest eligible series leading, in-progress promoted), LIBRARY (every slug in ALL_SERIES_ORDER, six sorts, A-Z jump rail) and LIST. Coverage is now structural rather than editorial and is asserted in tests against ALL_SERIES_ORDER, so a new series appears without anyone remembering to shelve it. Filing drops leading articles for BOTH the sort and the bucket — when only the bucket stripped "The", the jump rail read "... R S N W T V". (3) SEARCH BY PHRASING, AND IT IS NOT THE SOUL AUDIT. "I want the user to be able to search by phrasing etc so they can find the most relevant devotionals - this is NOT the soul audit." The existing searchSeries/searchDevotionals use AND semantics, correct for a command-palette lookup and useless for how people describe a need: "I feel anxious about money" returned ZERO because no teaser contains the token "i". searchLibraryByPhrase drops stopwords, scores OR with a SQUARED coverage multiplier so partial matches sink, and pays an exact-phrase bonus per field. It searches devotionals as well as series, because a reader describing a feeling usually wants the one reading that meets it. No consent gate, no plan, no curation — it ranks the existing catalog and links into it. Both scorers stay: the precise one is still right for known-title lookup. (4) THE HOMEPAGE FEATURE ROTATES, AND THE COMMISSIONED SERIES IS AN EXCEPTION. "New series in the features each refresh, except the latest uploaded should always be the first shown on homepage." / "Each page refresh." Rotation MUST happen on the client: the homepage carries s-maxage=31536000, so a rotation computed during render is frozen into the edge cache and every visitor sees the same "random" set, and any Math.random() in render is a hydration mismatch. Server render is deterministic; an effect reshuffles the tail after hydration; the lead never moves. The lead is the newest ELIGIBLE series, derived from the end of NEW_SERIES_ORDER rather than hardcoded — the old HOMEPAGE_TODAY literal still named a series two releases old. Founder confirmed the exception directly ("not looking at the sun - thats an exception"), upholding SA-036(4): a commissioned series is excluded from the homepage lead, from the rotating tail, and from the /series bento hero, but still appears in LIBRARY and LIST because nothing may hide.'

  - id: SA-046
    title: an-existing-highlight-is-editable-recolour-note-remove
    note: 'Founder-reported 2026-08-15 (F-092): "the highlight feature doesnt work on desktop. I can highlight text, but not change colors or make notes etc. i am also signed in." (1) THE COLOURS WERE NEVER BROKEN — THERE WAS NO SECOND ACT. Reproduced on production: selecting text and picking a swatch works, and the mark paints in the chosen colour. What did not exist was any way back IN. handleSelection returns early for any selection anchored inside .reader-highlight — a guard that correctly prevents nested highlights, but which left an existing mark completely inert: clicking it did nothing, re-selecting it did nothing, and a scan of every button in the reader returned no note, edit or delete control at all. A highlight was frozen the instant it was made. Being signed in was incidental; the same was true signed out. (2) THE API ALREADY SUPPORTED ALL OF IT. /api/annotations has had PATCH (style + body, by annotationId) and DELETE since before this report. This was a missing SURFACE, not a missing feature, and nothing server-side changed. (3) CLICKING A HIGHLIGHT NOW OPENS IT. The same toolbar reopens anchored to the mark, where the swatches recolour it in place, a note can be written on it, and it can be removed. The mark repaints IMMEDIATELY and reconciles after, for the same reason the create path does (SA-038): the reader action must land visibly whether or not the network does. (4) NOTES LIVE IN style.note, NOT body. body already carries the anchor text and hydration falls back to it (anchor_text || body), so putting a note there would make a note and its anchor indistinguishable on restore. style is ours, PATCH accepts it, and colour and note then travel the same path. A noted passage is dotted-underlined so notes are findable by eye rather than by clicking every mark. (5) DEVICE-KEPT HIGHLIGHTS EDIT TOO. A highlight made signed-out has no id; recolour and remove rewrite localStorage instead of calling the API. The same control must not behave differently depending on something the reader cannot see. (6) THE TOOLBAR PREVENTS DEFAULT ON MOUSEDOWN. Without it the browser collapses the selection as the toolbar is clicked, which is a live hazard for the create path even though it was not the cause here.'

  - id: SA-047
    title: the-toolbar-flips-when-there-is-no-room-and-color-gold-is-not-gold-in-light-mode
    note: 'Founder-reported 2026-08-15 (F-092), following SA-046: "it works but i need to be able to remove the highlight. also the chat button style doesnt work - its black on blue currently (hard to see) and needs to change style according to whether light or dark mode." (1) REMOVE WORKED; IT WAS UNREACHABLE. Verified end-to-end on production, including persistence: create, click, Remove, reload — the mark stays gone and the localStorage row is cleared. The defect was POSITIONAL. The toolbar always rendered above the passage, clamped to y >= 10 and translated up by its own height, so for a highlight near the top of the window it landed off the top of the screen or underneath the sticky masthead, and its controls could not be clicked at all. It now flips BELOW the passage when there is less than 140px of room above. A control that exists but cannot be reached is not a control. (2) --color-gold IS A LEGACY ALIAS AND HAS NOW CAUSED THIS TWICE. The chat launcher used the utilities `bg-gold text-tehom`. --color-gold resolves to COBALT #1f2a8d in light mode (the name is historical; the alias is --color-cobalt) and to #c8a56a only in dark, so light mode painted a near-black #0a1320 icon on a blue disc. This is the same trap that made the /series bento kickers invisible in light mode 24 hours earlier (SA-044). RULE: any element whose GROUND is fixed across themes, or which pairs a background and a foreground, must set BOTH halves explicitly per theme — never reach for `bg-gold`/`--color-gold` and assume it is gold. The launcher now measures 9.7:1 (cobalt on cream) in light and 7.9:1 (gold on deep ink) in dark.'

  - id: SA-054
    title: 'Mobile paragraph spacing — space belongs to the leading, not the viewport'
    status: accepted
    note: 'Founder-directed 2026-08-16: "indents dont seem to be working on site and it makes text hard to read, this could be just a mobile thing, but we will need a site wide check on that." Then, after measurement: "reads fine on desktop, its a mobile paragraoh spacing issue- no indent needed i think." (1) THERE WERE NO INDENTS TO BREAK. text-indent appears nowhere on prose paragraphs — the only two occurrences in the codebase are an auth-code input and a hanging-punctuation fallback. Indents were never implemented, so nothing regressed; the founder was reading a symptom (paragraphs running together) and reasonably attributed it to a missing indent. Founder then ruled no indent is wanted. (2) THE CAUSE IS A VIEWPORT-RELATIVE CLAMP. .devotional-shell-panel .vw-body sets margin-bottom to --devotional-rhythm-sm, which is clamp(0.75rem, 1vw, 1rem). On a 390px phone 1vw is 3.9px, so the clamp collapses to its 0.75rem floor: a 12.75px gap under a 33.3px line-height, a ratio of 0.39. On a 1655px desktop the same token resolves to 16.55px. Paragraph space that is expressed in vw decouples from the type it separates. (3) THAT SELECTOR ALSO BEATS TAILWIND. space-y-6 was on the container and would have produced 25.5px, verified by injecting a control .space-y-6 into the live page which measured 25.5px correctly. The two-class unlayered descendant selector .devotional-shell-panel .vw-body wins over the @layer utilities space-y rule — the same layering trap this project has hit before. (4) THE FIX IS em, SCOPED TO MOBILE. margin-bottom: 1.45em inside a max-width 767px query, measured on production at 0.80 of line-height against 0.39 before. em tracks the type size, including the reader font-scale control. Desktop is deliberately untouched at 0.36 because the founder confirmed it reads correctly, and changing an accepted surface to satisfy a formula would be the wrong trade. (5) THE CHECK IS RATIO-BASED AND VIEWPORT-AWARE. scripts/check-paragraph-spacing.mjs measures gap divided by line-height across six routes at two viewports, because a 13px gap is generous under 16px type and invisible under 33px type. Mobile gates at 0.5, desktop at 0.33. Two calibration bugs were found and fixed while building it: multi-column containers put the next paragraph at the TOP OF THE NEXT COLUMN, so raw geometry returned ratios like -4.06 and read as catastrophic failure — the probe now detects the column break and falls back to declared margins; and single-pair containers (cookie banner, headline dek) are banners rather than reading flows and were producing more noise than signal, so a container now needs three consecutive pairs to be judged. A gate that cries wolf stops being believed, which is the same lesson SA-052 recorded about brightness-based image checks.'
  - id: SA-053
    title: 'Devotional readability — gate the tail, lower the arc, forward-only'
    status: accepted
    note: 'Founder-directed 2026-08-16: "It feels slightly too mature for some audiences. I think it needs to be 8th grade level reading maybe slightly more elevated. I can follow, but other folks may find it a bit too dense of material. I want the breadth of content to stay the same, but slightly lower reading level. just slightly." Then, on scope: "I dont want any retro active changes to text- just to the skill for future devotionals." (1) MEASURE FIRST, AND THE MEASUREMENT OVERTURNED THE PREMISE. Across the four most recent series (looking-at-the-sun, he-cannot-deny-himself, the-harvest, prayer-of-jabez), authored prose only with quoted Scripture excluded, the weighted Flesch-Kincaid is 7.7 and Reading Ease is 71 — that is already 8th grade and already plain English. Lowering the AVERAGE further would flatten prose that is correctly pitched. (2) THE DENSITY IS IN THE TAIL, WHICH AVERAGES HIDE. Each series carries 11-25 sentences of 45-95 words scoring grade 33-36, and 12-17% of all sentences run 30+ words. A reader stalls on those; the mean does not register them. So the gate is on the tail, not the mean: series-wide FK <= 8.5, under 8% of sentences at 30+ words, and NOTHING over 45 words. (3) THE DOMINANT FAILURE IS ONE SENTENCE SHAPE. 36% of the over-30-word sentences are setup clause + embedded archaic quotation + continuation, all punctuated as a single sentence — Milton, Augustine, a 1924 speech. The rule is now: setup sentence, quote its own sentence, response sentence. This single habit is the largest source of density in the catalog. (4) STORY AND INSIGHT MODULES ARE THE OFFENDERS at 20.9 and 24.3 words per sentence against teaching at 16.6. (5) THE FIX IS RE-PUNCTUATION, NEVER DELETION. Modelled: splitting long sentences at clause boundaries that already exist moves FK 7.7 -> 7.2 and 30w+ from 15% -> 11% without cutting a single word. That satisfies the founder constraint that breadth of content stays the same — same research, same quotes, same ideas, fewer stalls. (6) THE READING-LEVEL ARC SURVIVES BUT ITS CEILING DROPS. workflow.md specified "8th -> 12th -> college -> 12th -> 8th"; the chiastic arc is deliberate and stays, but the peak comes down to "8th -> 10th -> 11th -> 10th -> 8th". A flat cap would have destroyed the pivot day design, which is why this was raised with the founder before changing it rather than after. (7) FORWARD-ONLY. Founder ruled explicitly against retroactive edits to shipped devotional text. No devotional JSON was modified; the change is to the devo-go skill and a new gate script only. (8) TOOLING: scripts/check-readability.mjs reports both the mean and the tail and exits non-zero on the tail, run at the Phase 5 editorial gate.'
  - id: SA-052
    title: 'Series imagery — region-accurate people, fully developed frames'
    status: accepted
    note: 'Founder-directed 2026-08-15 (F-097). Founder rejected the existing series imagery and the first regeneration: "these all look like generic ai white people and not region and hostory seocific people"; "I dont like blacked out faces, so just try to hide faces through posing, but if a face is shown its ok"; "not NO white people for modern depictions, but not whitte people only"; "I would prefer the hero images not have soo much whitespace... no stark nothing backgrounds." (1) THE WHITEWASH WAS A RENDERING PROBLEM, NOT ONLY A WORDING PROBLEM. In a cobalt-on-cream duotone the cream paper is the ONLY other ink, so unprinted skin IS white skin. Naming an ethnicity while leaving skin near paper still outputs a white person. The prompt now states skin as a VALUE — brown to deep brown, therefore printed at DENSE dot coverage, obviously darker than the ground. This single line is the highest-leverage change in the pass. (2) THE EMPTY BACKGROUNDS WERE SELF-INFLICTED. The old style block asked for "generous negative space, high horizon line, small figure scale", which the model read as permission to leave the frame blank. Deleted and replaced by a FULLY DEVELOPED FRAME clause; measured bare-paper coverage across the final set is under 0.5 percent. (3) ANONYMITY COMES FROM SCALE AND POSE, NOT FROM BLACKOUT. The four founder-approved plates all keep the human small and turned away, so no face is ever rendered. The rejected batch made the figure large and frontal, which forced the model to invent a face and a wardrobe. Faces are now hidden by posture, angle, bowed head or head covering; a visible region-accurate face is explicitly acceptable; a featureless black void is explicitly forbidden. (4) THE GRAIN WAS UPSCALING, NOT COMPRESSION. next.config.ts sets images.unoptimized, so Next serves the raw file with no srcset. The headline slot is aspect-ratio 1408/768 at sizes="(max-width:900px) 100vw, 66vw" — about 1267 CSS px on a 1920 desktop and about 1125 device px on a 375pt phone at 3x. A 1024 square was being UPSCALED about 1.24x in the slot that matters most, and upscaled Ben-Day dots read as mush. Install is now 1600x872, the same shape as the slot, which also serves the OG card at 1.91:1. A square was the wrong master shape for every consumer. (5) THE GATE ADMITS WHAT IT CANNOT MEASURE. verify-masters.mjs measures border and blank-paper coverage and REFUSES to score the figures, printing instead which plates still need a human look. A plate can clear both measurements and still be a man in a sweatshirt. rooted failed at 3.7 percent blank sky, was regenerated with an explicit sky clause, and passed. 33/33 measured pass. (6) FOUR PLATES ARE UNTOUCHED. he-cannot-deny-himself, looking-at-the-sun, prayer-of-jabez and the-harvest are the founder-approved bar and are skipped by name in the install script. (7) THE PROMPT SET LIVES ON DISK, NOT IN CONTEXT. The first attempt lost its entire subject set to compaction and had to be re-authored from scratch at real cost. prompt-preamble.md, series-image-subjects.json, build-prompts.mjs, verify-masters.mjs and install-series-masters.mjs now hold the whole pipeline, and run state is derived from what is on disk. (8) OPEN, NOT SHIPPED: the founder also asked for imagery that reads "slightly more editorial". That is an aesthetic direction change affecting all 33 plates and was NOT attempted on my own reading of "slightly". Page weight also rose from 5.5 MB to 17.8 MB for the set (about 490 KB per hero against about 150 KB), because dense halftone is worst-case for compression; reducing further visibly degrades the dots.'
  - id: SA-049
    title: ten-print-forms-for-the-catalog-and-a-ground-that-does-not-follow-the-theme
    note: 'Founder-directed 2026-08-15 (F-094): "bento title hierarchy needs addressing. the Title and image are the main pieces of info. I want the list view to not show the category. The bento image sizing is off. The Library look should have less columns. Overall the page design needs more finesse with special attention paid to each page state. I want an additional version that looks like a newspaper rack... lets say 10 distinct and unique ways of displaying the info that is super sortable and searchable... BEAUTIFULLY DESIGNED... REFERENCE INNOVATIVE AND UNIQUE REAL WORLD DESIGN... TOGGLABLE WITH ICONS." (1) TEN LAYOUTS, EACH A REAL FORM OF DISPLAYING PRINT. Ten arbitrary CSS grids would have been ten arbitrary CSS grids. The founder own words for this page are "a library of magazines" and "each devotional is a newspaper on the rack", so every view takes its proportions and furniture from a real print form: FEATURE (Monocle front-of-book), RACK (a kiosk rail), COVERS (Phaidon plate wall), SPINES (a shelf), LIST (a stock list), INDEX (back-of-book dot leaders), CONTACT (a Magnum contact sheet), MOSAIC (Richter Atlas), BROADSHEET (a newspaper page), ISSUES (an issue chronology). (2) NUMBERS MUST MEAN SOMETHING. Decorative 01/02/03 markers are the generic default. Here the contact sheet numbers frames by their position in the CURRENT sort (re-sort and the numbering changes, as a re-laid contact sheet would) and ISSUES numbers by release order from seriesRecencyRank. Spine WIDTH encodes length, because width is the one thing a real shelf tells you at a glance. (3) TITLE AND PLATE CARRY THE TILE. The bento previously led with a gold uppercase kicker ABOVE the title — the brightest element on the tile was the least important thing on it. The kicker is gone; the tile is now plate + title, with length as a quiet line beneath. Rows went 150px to 210px so a landscape plate is not squeezed into a letterbox. (4) THE ICONS ARE MINIATURES OF THEIR OWN LAYOUT. The Rack glyph is a rail with papers over it; Spines is bars of differing width on a board; Index has a dotted leader. A reader can tell what a control will do before pressing it, which generic grid/list icons cannot. (5) --mock-ink INVERTS PER THEME AND MUST NEVER GROUND --plate-ink TYPE. In dark mode --mock-ink IS cream, so `background: var(--mock-ink); color: var(--plate-ink)` rendered the spines cream-on-cream and invisible. Added --plate-ground (#131b40), fixed in both themes, for every surface that carries plate type. This is the THIRD variant of the same trap after SA-044 and SA-047: any surface whose ground must not follow the theme needs a fixed token, not a mock token. (6) EVERY STATE IS DESIGNED, NOT DEFAULTED. Searching hands the page to results; an empty result names what was searched and offers five seed phrases that actually return something, plus a way back; a returning reader sees "Day n of m" and a progress rail; a cold reader sees neither. There is deliberately NO pre-hydration spinner — the catalog is static and server-rendered, so the page arrives complete and only the reader own progress fills in. (7) THE CHOSEN LAYOUT PERSISTS. With ten of them, dropping the reader back into FEATURE on every visit would be a small insult; the choice is stored per device and read after hydration so the server pass stays deterministic.'

  - id: SA-050
    title: seven-layouts-centred-controls-and-a-resume-line-that-defers-to-the-shelves
    note: 'Founder-directed 2026-08-15 (F-094), reviewing the ten layouts live: "on desktop center the toggles. remove contact sheet and broad sheet, and index. center the sort on desktop as well." Then: "the inprogress needs to be made much less prominent. the series I see as more important and the continue as secondary to that (still above fold)." (1) SEVEN, NOT TEN. INDEX, CONTACT and BROADSHEET are removed. Ten was the brief; seven is what survived review. A switcher is worth more when every option on it earns its place, and the three cut were the three that carried no artwork or no hierarchy — an index and a broadsheet are lovely as objects and weak as ways to choose a reading you have not seen. The components are deleted rather than left unmounted; git history holds them if they are ever wanted back. (2) THE CONTROLS ARE CENTRED AND STACKED. The bar was a space-between row with views left and sort right, which read as an application toolbar. Centred and stacked it reads as a masthead control, which is what this page is. (3) IN-PROGRESS IS SUBORDINATE TO THE SHELVES. The resume affordance was a bordered tile with a gold label, a heading and a CTA line — louder than any single series on a page whose entire job is choosing a series. It is now ONE quiet line ("Continue · <title> · Day n"), meta-sized and muted, above the search and above the fold but plainly secondary. Added as a `resume` variant on ActivePlanBadge rather than by changing `tile`, which stays available. It renders nothing at all when there is no active plan, so a cold reader sees only the shelves.'

  - id: SA-051
    title: red-is-reserved-for-the-words-of-christ-and-attribution-is-never-inferred
    note: 'Founder-directed 2026-08-15 (F-095): "the continue is the right size but maybe needs a color or something to stand out a bit. also- through out the site- Jesus direct words in Red. ensure the highlight color is correct for such text." Then, asked whether a source exists: "are there no guides to this for the edition we have online anywhere?" (1) THE RESUME LINE GETS A WARM ACCENT, NOT RED. Bronze #8a5e12 on cream (5.1:1) and gold #d8b273 on the deep ground, with a 3px left rule and a 7 percent wash. Deliberately NOT red: red is now reserved site-wide for the words of Christ, and spending it on a navigation affordance would empty it of meaning. (2) THE RED IS THE BRAND RED. The first pass invented #7a1c12 by contrast measurement WITHOUT checking the palette; the founder corrected it - "i have a red color that is a part of the branding already". --color-crimson already exists (#c4192e light / #e25868 dark, the riso spot ink, already used for pullquote marks) and red letter now uses that token. Measured: 5.2:1 on cream and 4.2:1 on the deep ground, which clears AA at the display sizes scripture is set in. The brand crimson does NOT survive a highlight behind it (purple 2.8, blue 3.1, pink 3.2), so INSIDE a highlight only it deepens to #7d0f19 - the same hue further down, 5.1:1 on the worst ground and 9.3 on cream - reading as the brand red darkened rather than a second colour. LESSON: check the design tokens before measuring a new value; a contrast-correct invented colour still fragments the palette. (3) ATTRIBUTION IS NEVER INFERRED, AND NO SOURCE EXISTS FOR OUR EDITIONS. Verified rather than assumed: the KJV OSIS on disk carries 2,021 exact words-of-Jesus milestone pairs but covers 1 of our 125 Gospel passages; the OFFICIAL public-domain BSB USFM (usfm-bible/examples.bsb, 43LUKBSB.usfm, 156KB) contains ZERO \wj markers and only footnote markup; NIV is copyrighted with no open dataset; STEPBible-Data has no speaker attribution. Our Gospel passages are BSB 70, NIV 50, ESV 2, NKJV 2, KJV 1. (4) A QUOTATION-MARK PASS IS WRONG ON THIS CATALOG, DEMONSTRABLY. Luke 10:33-37 (BSB) in looking-at-the-sun-day-4 has three quoted spans; the middle one, "The one who showed him mercy", is the expert in the law, not Jesus. A naive pass puts Christ colour on another man words. KJV compounds it by not punctuating speech at all. STANDING PRINCIPLE: a missing red word is a typographic omission, a wrongly red word is a false attribution. Under-mark, never over-mark. (5) SO THE RENDERER SHIPS AND THE ATTRIBUTION DOES NOT. Module.redLetter carries spans copied verbatim from the passage; renderRedLetter wraps them longest-first and SKIPS any span it cannot find rather than widening the red. Three attribution options are with the founder and unanswered: a safe auto-pass constrained by the KJV verse list that skips mixed-speaker verses (recommended), hand-authoring, or an auto-pass plus a per-passage review artifact. Full investigation recorded in docs/run/HANDOFF-2026-08-15-library-and-red-letter.md.'

  - id: SA-052
    title: one-reader-shape-covers-leads-the-switcher-and-red-letter-reaches-multi-verse-passages
    note: 'Founder-directed 2026-08-15 (F-094/F-095), three corrections on the live build. (1) DAILY BREAD IS THE SAME READER. "The daily bread reader should look exactly the same as the normal reader (ie centered column, no image on the right on scroll etc." The difference was one prop: the dedicated reader passes DevotionalRhythm enabled={false}, and CuratedActiveView passed enabled={rhythmImages.length > 0}, which turned on the alternating text-left / sticky-image-right rhythm on Daily Bread and nowhere else. Both are now one centred column. If the rhythm is ever wanted back it must be turned on in BOTH or neither - a reader that changes shape by route reads as two products. (2) COVERS LEADS THE SWITCHER, ISSUES SECOND, PATHWAY SORT REMOVED. The art is the fastest way to recognise a reading you have seen and recency is the second, so those are the first two controls and Covers is the default view. Pathway (Sleep/Awake/Shepherd) is gone from the sort - it is an authoring taxonomy, not something a reader browses by, and the list had already dropped it as a column (SA-049). (3) RED LETTER REACHES THE COMMON GOSPEL SHAPE. The founder had still seen no red: "Infact- I havent seen one red letter yet." The passages he was opening are MULTI-VERSE MIXED in NIV - John 6:25-29 is narration, Jesus, narration, Jesus - which fell through every path: not all whole-verse, not a single verse, and NIV wording never matches BSB. Added a fourth path that attributes the passage OWN quotations by their reporting clause ("Jesus answered,"), accepted ONLY when the count of Jesus-attributed quotations equals the count of His speeches the KJV says begin in that verse range - two independent sources agreeing rather than one heuristic guessing, and any unattributable quotation voids the whole passage. ORDERING IS LOad-BEARING: this runs only AFTER the verbatim path returns nothing, because the verbatim path carries parable narration that has no quotation marks at all (Luke 10:30-35). Running it first regressed Luke 10 to the single quoted line and silently dropped the parable - caught by the existing negative-control test.'

  - id: SA-053
    title: red-letter-is-comprehensive-explicit-attribution-wins-and-direction-is-load-bearing
    note: 'Founder-directed 2026-08-15 (F-095), pushing for completeness: "If it literally says \"jesus said\" it is safe to make a red letter. Be more diligent and cross reference as much as possible. Needs to be comprehensive." (1) EXPLICIT ATTRIBUTION IS DECISIVE ON ITS OWN. The previous guard required the count of Jesus-attributed quotations to equal the count of speeches the KJV expects AND allowed no unattributable quotation anywhere, so a single unclear quote discarded the ones we were certain of - passages reading literally "Jesus said to them," and "Then Jesus declared," were left black. Now an explicit subject attribution marks that quotation regardless of what else is in the passage. (2) DIRECTION MATTERS AND NEARLY INVERTED THE MEANING. "They said to Jesus" names him as the OBJECT. A loose /Jesus.*said/ match would have painted the crowd words in Christ colour - the precise failure this whole module exists to prevent. Object forms are now matched FIRST and rule him out. (3) THE REPORTING CLAUSE IS THE GAP BETWEEN QUOTATIONS, NOT A FIXED WINDOW. A fixed 80-character look-back reached past the previous quote and picked up an unrelated clause; in "The crowd said to Jesus, \"...\" Jesus answered, \"...\"" it saw "said to Jesus" while attributing the SECOND quote and ruled Christ out of his own words. Look-back is clamped to the previous quotation end and look-ahead to the next quotation start. (4) A CLAUSE ENDING IN A COMMA LEADS INTO THE NEXT QUOTE. The text between two quotations is genuinely ambiguous - "...?\" Jesus answered, \"..." could trail the first or lead the second. Punctuation settles it; without this the first speaker words were attributed to Christ. (5) THREE MORE CROSS-REFERENCES, EACH GATED. A bare "he said" is trusted only when no other speaker is named anywhere in the passage, so the pronoun has one possible referent. A continuation quote is trusted only when nobody else has spoken in between. A dominical formula ("Very truly I tell you", "I am the") corroborates only inside a verse range the KJV already says he speaks in. (6) KJV WORDING ADDED TO THE VERBATIM PATH. KJV does not punctuate speech at all, so a KJV passage has no quotations to attribute and BSB wording never matches it. Luke 10:38-42 ("Martha, Martha") was the single passage in the catalog left black for this reason. RESULT: 93 of 153 Gospel modules attributed, 60 correctly black because their range contains no speech of his, and ZERO remaining passages that contain his words and lack attribution. Coverage is comprehensive by measurement, not by assertion.'

  - id: SA-054
    title: feature-is-a-front-page-spines-are-shelves-and-today-is-the-daily-edition
    note: 'Founder-directed 2026-08-16 (F-094/F-097). (1) FEATURE IS A FRONT PAGE, NOT A BENTO. "Try something different here- make it feel like a literal newspaper grid, with different sized stories etc." A broadsheet allocates space by importance, so the view does too: a LEAD with a 21:9 plate and a banner headline, two boxed SECOND stories separated by a column rule, a ruled RAIL of briefs, then the rest set as four columns of listings. Every size says something about the series rather than decorating it. (2) RACK: FOUR TO A RAIL, NOT SIX. "Rack doesnt feel like a news paper rack enough and I think there are too many columns." At four each paper is wide enough to read as a folded front page - masthead, rule, plate, standfirst - which is the order a real front page uses. (3) SPINES: SHELVES, NOT A SCROLLBAR. "Spine should have several rows of books and the spines can be larger. No overflow scroll, all on page visible." Twelve to a shelf, each shelf with its own board, wrapping instead of scrolling, and spines widened to 104-190px so a row FILLS rather than trailing into whitespace. Width still encodes length. (4) /today IS THE DAILY EDITION AND EARNS A NAV ENTRY. "I want it to be like a literally daily edition of a newspaper... this is a place where people can come for daily content." Masthead with a thin-over-thick double rule, a dateline carrying Vol/No DERIVED from the date (same day = same edition for every reader) and the real liturgical day, a front page of lead story plus an "Also in this edition" rail, then the full reading below. SA-033 still holds: DAILY BREAD means YOUR devotional; TODAY is the edition, a different thing, and the nav no longer duplicates because they are no longer one destination. (5) THE EDITORIAL SECTIONS ARE DECLARED AND EMPTY, BY DESIGN. Dispatches, Community and the prayer list have NO data source in this repo - there is no feed of global reports and no submissions table. src/data/daily-edition.ts declares and types them; each renders ONLY when it carries real entries and is absent entirely otherwise. No placeholder card, no "coming soon". Inventing a dispatch from Nigeria or a prayer request would publish fiction as fact under a masthead, in a devotional context - the one failure this product cannot afford. Every Dispatch carries a required `source` because an unattributed report is a rumour.'

  - id: SA-055
    title: subject-desks-matched-bookends-and-a-real-daily-edition
    note: 'Founder-directed 2026-08-16 (F-098), second round on the same surfaces. (1) THE FEATURE BOTTOM IS A NEWS SITE, NOT A CLASSIFIED COLUMN. "the top feels like a newspaper, the bottom needs more finnese… should feel like a newpaper but like newspaper website with sections and such", and "please bring images into the feature toggle state for all devotionals". Below the front page the catalog now prints as SUBJECT DESKS - Beginnings, Scripture, The interior life, Under pressure, Identity and work, Together, Hard questions - each laid out as a section front: a lede column with a plate beside a filling grid of equal thumbnails. Every entry carries an image. Sections are by SUBJECT, never by pathway: SA-050 removed pathway from browse and it does not return through the side door. src/data/series-sections.ts sweeps anything unclassified into a final desk, so no reading is ever dropped - a browse surface that silently omits a series is worse than an imperfect heading. (2) RACK PAPERS ARE ALL ONE SIZE. "i do not like the giant image at the bottom of rack. all of them should be same sized." The cause was flex: 1 1 0 - the final rail holds one paper, not four, so that paper stretched to the full width of the rack. Fixed basis now; a kiosk does not resize its papers to fill the bar. (3) SHELVES CENTRE BETWEEN MATCHED BOOKENDS. "Center the books on spine- add unique book ends on each row that are site thematic." Six thematic pairs - lamp, wheat, fish, anchor, chi-rho, door - drawn from this site own furniture, the left one mirrored as a real matched pair is, indexed by shelf so the wall never reshuffles. Eight spines per shelf, not twelve: at the widened sizes twelve overflowed the row and WRAPPED inside itself, putting the bookends around two lines of books and the board under only the lower one. (4) THE DAILY EDITION CARRIES A REAL PAPER. "The today page needs more content, you will have to invent stuff that makes sense… needs images to lead thumbnails, icons etc… the site will eventually have practical guides on biblke reading and studying etc too. Today page could lead this effort. Could use a daily cartoon." Added: THE PRACTICE (one finishable thing to do today), a Greek/Hebrew WORD STUDY at standard lexical meaning, HOW TO READ (the first practical Bible-reading guides, each led by a plate chosen for its subject), THE DAILY PANEL (our riso parable plates with a written caption - what an editorial cartoon actually is, since a gag strip is the wrong register for this masthead), and THE PRAYER LIST as a weekday intercession pattern. Rail briefs gained thumbnails. All of it rotates by day of year, never at random, because an edition that differs between two readers on the same morning is a feed wearing a masthead. (5) THE INVENTION LINE, MADE EXPLICIT. The founder authorised invention; this decision records WHERE it applies. We invent our own voice - practices, guides, captions, categories of intercession, lexical glosses. We do not invent other people REPORTED FACTS. DISPATCHES, COMMUNITY and reader PRAYERS stay empty and their sections stay absent, because a dispatch saying a named church in a named place did a thing, or a prayer request from a named reader, is a claim about real people with no source behind it. Everything in the prayer list is a category of need true every week in every place; nothing claims a fact about a person. (6) HOME IS A MARK. "change the Home menu item to an icon of a biblical style home." A Levantine house - flat roof oversailing the walls as the parapet Deut 22:8 requires, tall arched door - in three strokes, because a stair and a window turned it to mud at the 18px it actually renders at. Accessible name stays "Home". (7) PLATES ARE DERIVED, NOT SHIPPED RAW. next.config sets images.unoptimized, so a 1-2 MB library PNG reaches the browser untouched. The 16 edition plates are webp derivatives in public/images/edition/: 25.1 MB became 2.26 MB.'

contracts:
  required_files:
    - src/app/api/soul-audit/submit/route.ts
    - src/app/api/soul-audit/select/route.ts
    - src/app/api/devotional-plan/[token]/day/[n]/route.ts
    - src/app/api/mock-account/session/route.ts
