name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Verify Production Contracts
        run: npm run verify:production-contracts

      - name: Verify Tracking Integrity
        run: npm run verify:tracking

      - name: Verify Feature PRD Integrity
        run: npm run verify:feature-prds

      - name: Verify Governance Alignment
        run: npm run verify:governance-alignment

      - name: Verify Methodology Traceability
        run: npm run verify:methodology-traceability

      - name: Verify Folder Structure Integrity
        run: npm run verify:folder-structure

      - name: Verify App Store Gate
        run: npm run verify:appstore-gate

      - name: Lint
        run: npm run lint

      # Tests and the end-to-end run need no build and no secrets, so they run
      # before Build: a build configuration failure must not hide them.
      - name: Test
        run: npm test

      # SA-142 / F-184: the whole Daily Bread V2 publication run in memory —
      # real builders, scheduler, numbering, and the total-AI-outage scenario.
      # No network, no secrets.
      - name: Daily Bread V2 end-to-end
        run: npm run daily-bread -- e2e

      # NEXT_PUBLIC_* is inlined at build time and check-public-config.mjs
      # refuses to build without it (SA-102). A runner has no .env.local, so
      # the values come from repository secrets. The app URL is public.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://euangelion.app

      - name: Bundle secret audit
        run: npm run verify:bundle-secrets

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
