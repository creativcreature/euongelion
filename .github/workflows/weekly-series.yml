name: weekly-series

# The weekly series machine, CLOUD EDITION (SA-100 / F-146, revised).
#
# Founder: "This needs to work as well as the Daily Bread page — regardless
# of if this machine is on or not." So the whole devo-go build runs here,
# Wednesdays just after the founder's 5am Eastern Claude-quota reset, on
# infrastructure that never sleeps:
#
#   · Writing/verification: Claude Code headless on the founder's
#     SUBSCRIPTION (CLAUDE_CODE_OAUTH_TOKEN). Grounding uses the COMMITTED
#     reference index + lexicons — the same artifacts production composes
#     from — plus WebSearch for verification. Anything needing the deep
#     local library is CUT, never shipped hedged.
#   · Narration: ElevenLabs founder voice over plain HTTPS
#     (render_el_catalog.py; chunk cache persisted via actions/cache so a
#     retried run never pays twice — SA-043).
#   · Imagery: Codex headless (`codex exec`) on the founder's ChatGPT
#     subscription via CODEX_AUTH_JSON — built-in image_gen only, style
#     anchors attached, native size per the standing 2026-08-16 ruling
#     (founder upscales downstream when desired).
#   · The gate stands: output is a pushed `series/auto-*` branch and a PULL
#     REQUEST — the reading gate as a PR the founder can read anywhere,
#     including a phone. Merge = ship. Nothing publishes unseen unless the
#     repo variable AUTO_PUBLISH=true exists (the founder's explicit switch).
#
# Thematic override, machine-independent: edit content/next-series-thematic.md
# on ANY device (GitHub web editor works) and it rides the next run.
#
# REQUIRED SECRETS: CLAUDE_CODE_OAUTH_TOKEN, ELEVENLABS_API_KEY,
# CODEX_AUTH_JSON, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# If Codex auth rotates stale, the imagery step fails VISIBLY here and the
# fix is re-uploading ~/.codex/auth.json to the CODEX_AUTH_JSON secret.
#
# OPTIONAL SECRET (SA-114 / F-158): CLOUDFLARE_API_TOKEN — a Cloudflare token
# with Workers Scripts:Edit (see FOUNDER-ACTIONS.md, "Series browser
# preview"). When present, the run uploads a PREVIEW VERSION of the Worker
# (production traffic untouched) and comments the rendered URL on the
# reading-gate PR. When absent, the preview step says so loudly and skips.

on:
  schedule:
    - cron: '20 10 * * 3' # Wed 10:20 UTC = 6:20am EDT / 5:20am EST
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = build the series; thematic-only = derive and print the thematic, build nothing'
        required: false
        default: 'full'

permissions:
  contents: write
  pull-requests: write
  # SA-114 (F-158): `gh label create` (the reading-gate label) goes through
  # the Issues API — without this it 403s and the PR label can never apply.
  issues: write

concurrency:
  group: weekly-series
  cancel-in-progress: false

jobs:
  build-series:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Install toolchain (claude, codex, ffmpeg)
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code @openai/codex
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install requests

      - name: Materialize Codex auth (ChatGPT subscription)
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json

      # SA-043: never pay twice. The ElevenLabs chunk cache survives between
      # runs so retries and revisions re-render only what changed.
      - name: Restore narration chunk cache
        uses: actions/cache@v4
        with:
          path: euangelion-voice-prototype/renders/.chunk-cache
          key: el-chunk-cache-${{ github.run_id }}
          restore-keys: |
            el-chunk-cache-

      - name: Build the week's series
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_MODE: ${{ inputs.mode || 'full' }}
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "euangelion-weekly"
          git config user.email "chrisparker21@gmail.com"
          bash scripts/devo-weekly/ci-orchestrate.sh

      # SA-114 (F-158): true browser preview of the reading gate. `wrangler
      # versions upload` creates a PREVIEW VERSION of the euangelion Worker
      # WITHOUT routing production traffic to it and prints a versioned
      # …workers.dev preview URL — the founder reads the built series rendered
      # in a real browser. Gated on the CLOUDFLARE_API_TOKEN secret (same
      # env-mapped HAS_* pattern daily-edition.yml uses for its token); when
      # the secret is absent the skip is LOUD, never silent.
      - name: Preview deployment
        id: preview
        if: ${{ (inputs.mode || 'full') == 'full' }}
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 15a3f83632fea316caa448503bb786f9
        run: |
          set -euo pipefail
          if [ "$HAS_CF_TOKEN" != "true" ]; then
            echo "::warning::Series browser preview SKIPPED — the CLOUDFLARE_API_TOKEN secret is not set."
            echo "Preview skipped: no CLOUDFLARE_API_TOKEN repository secret, so this run cannot"
            echo "upload a preview version of the Worker for the founder to read in a browser."
            echo "To enable it (one-time):"
            echo "  1. Create a Cloudflare API token with the 'Workers Scripts:Edit' permission at"
            echo "     https://dash.cloudflare.com/profile/api-tokens"
            echo "     (account chrisparker21@gmail.com / 15a3f83632fea316caa448503bb786f9)."
            echo "  2. Add it as the CLOUDFLARE_API_TOKEN repo secret: GitHub -> creativcreature/euongelion"
            echo "     -> Settings -> Secrets and variables -> Actions -> New repository secret."
            echo "Full walkthrough: FOUNDER-ACTIONS.md, 'Series browser preview'."
            exit 0
          fi
          rm -rf .next .open-next
          npx opennextjs-cloudflare build
          UPLOAD_LOG="$(mktemp)"
          npx wrangler versions upload 2>&1 | tee "$UPLOAD_LOG"
          PREVIEW_URL="$(sed -n 's/.*Version Preview URL:[[:space:]]*//p' "$UPLOAD_LOG" | head -n 1 | tr -d '[:space:]' || true)"
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="$(grep -Eio 'https://[a-z0-9.-]+\.workers\.dev[^[:space:]]*' "$UPLOAD_LOG" | head -n 1 || true)"
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "::error::wrangler versions upload printed no preview URL — nothing to hand the founder. Read the upload log above."
            exit 1
          fi
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "[preview] $PREVIEW_URL"

      # SA-114 (F-158): hand the preview to the founder ON the reading-gate
      # PR, wired here in the workflow layer — the PR is found by head branch
      # (SERIES_BRANCH, exported by ci-orchestrate.sh), so the comment lands
      # regardless of what the model did inside the build step.
      - name: Comment preview URL on the reading-gate PR
        if: ${{ (inputs.mode || 'full') == 'full' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          set -euo pipefail
          if [ -z "${PREVIEW_URL:-}" ]; then
            echo "No preview URL — the preview deployment was skipped (that step's log says how to enable it). Nothing to comment."
            exit 0
          fi
          if [ -z "${SERIES_BRANCH:-}" ]; then
            echo "::error::SERIES_BRANCH was not exported by ci-orchestrate.sh — cannot find the reading-gate PR by head branch."
            exit 1
          fi
          # --state all: AUTO_PUBLISH runs merge the PR before this step runs.
          PR_NUMBER="$(gh pr list --head "$SERIES_BRANCH" --state all --json number --jq '.[0].number // empty' || true)"
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::No PR found for head branch $SERIES_BRANCH — the reading gate never opened, so the preview has nowhere to land. Preview URL (this log only): $PREVIEW_URL"
            exit 1
          fi
          SLUG="$(git diff --name-only --diff-filter=A origin/main...HEAD -- public/devotionals/ | sed -E 's|^public/devotionals/||; s|-day-[0-9]+\.json$||' | sort -u | head -n 1 || true)"
          if [ -n "$SLUG" ]; then
            BODY="Read it rendered: $PREVIEW_URL/series/$SLUG"$'\n\n'"Preview version of the Worker — production traffic is untouched. Whole site at this version: $PREVIEW_URL"
          else
            echo "::warning::Could not derive the new series slug from the branch diff — commenting the preview root instead."
            BODY="Read it rendered: $PREVIEW_URL"$'\n\n'"(Could not derive the series slug from the branch diff — open $PREVIEW_URL/series and pick the new series. Production traffic is untouched.)"
          fi
          gh pr comment "$PR_NUMBER" --body "$BODY"
